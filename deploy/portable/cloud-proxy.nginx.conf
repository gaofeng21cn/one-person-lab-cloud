# nginx's entrypoint substitutes only the installation's Workspace domain;
# nginx runtime variables remain intact.
resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 8443 ssl default_server;
    server_name _;

    ssl_certificate     /pki/proxy.crt;
    ssl_certificate_key /pki/proxy.key;
    ssl_protocols       TLSv1.3;
    client_max_body_size 64m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/v2/ {
        set $console_bff "console-bff:8190";
        proxy_pass http://$console_bff$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
    }

    location /objects/ {
        set $capability_objects "capability:8191";
        proxy_pass http://$capability_objects$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location /w/ {
        set $serve_access "serve:8192";
        proxy_pass http://$serve_access$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }

    location /api/ {
        set $control_plane "control-plane:8787";
        proxy_pass http://$control_plane$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location / {
        set $control_plane_root "control-plane:8787";
        proxy_pass http://$control_plane_root$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

