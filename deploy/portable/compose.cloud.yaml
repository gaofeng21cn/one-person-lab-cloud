# Production single-host Cloud topology.
#
# This file is the published installation surface of OPL Cloud: it declares the
# complete owner topology of one installation on one host as one composed Cloud
# backend container alongside PostgreSQL and the same-origin proxy. It is
# self-contained: every service, volume, network and config it needs is
# declared here, and it reads no other Compose file.
#
# All 11 Cloud owner processes run inside `cloud-backend` under
# `/usr/local/bin/opl-cloud-composition`, reading the baked owner topology
# contract (`/app/contracts/opl-cloud-owner-topology.json`) and isolating each
# child's database DSN, mTLS keypair (`OPL_GRPC_CERT_DIR=/pki`), and declared
# environment allowlist while removing 10 redundant container wrappers.
#
# One PostgreSQL holds one database per owner and the role pair each owner's
# own DDL expects: a schema owner role that connects and a writer role that
# the owner grants its writes to. No owner can read another owner's tables.
#
# Usage
#   docker compose -f deploy/portable/compose.cloud.yaml config
#   docker compose -f deploy/portable/compose.cloud.yaml up -d
services:
  postgres:
    image: postgres:16.8-bookworm@sha256:301bcb60b8a3ee4ab7e147932723e3abd1cef53516ce5210b39fd9fe5e3602ae
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${OPL_POSTGRES_ADMIN_PASSWORD:?Set OPL_POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      OPL_CONTROL_PLANE_DATABASE_PASSWORD: ${OPL_CONTROL_PLANE_DATABASE_PASSWORD:?Set OPL_CONTROL_PLANE_DATABASE_PASSWORD}
      OPL_FABRIC_DATABASE_PASSWORD: ${OPL_FABRIC_DATABASE_PASSWORD:?Set OPL_FABRIC_DATABASE_PASSWORD}
      OPL_LEDGER_DATABASE_PASSWORD: ${OPL_LEDGER_DATABASE_PASSWORD:?Set OPL_LEDGER_DATABASE_PASSWORD}
      OPL_CAPABILITY_DATABASE_PASSWORD: ${OPL_CAPABILITY_DATABASE_PASSWORD:?Set OPL_CAPABILITY_DATABASE_PASSWORD}
      OPL_BUILD_DATABASE_PASSWORD: ${OPL_BUILD_DATABASE_PASSWORD:?Set OPL_BUILD_DATABASE_PASSWORD}
      OPL_RUNTIME_CONTROL_DATABASE_PASSWORD: ${OPL_RUNTIME_CONTROL_DATABASE_PASSWORD:?Set OPL_RUNTIME_CONTROL_DATABASE_PASSWORD}
      OPL_WORKSPACE_DATABASE_PASSWORD: ${OPL_WORKSPACE_DATABASE_PASSWORD:?Set OPL_WORKSPACE_DATABASE_PASSWORD}
      OPL_SERVE_DATABASE_PASSWORD: ${OPL_SERVE_DATABASE_PASSWORD:?Set OPL_SERVE_DATABASE_PASSWORD}
      OPL_RESOURCE_CATALOG_DATABASE_PASSWORD: ${OPL_RESOURCE_CATALOG_DATABASE_PASSWORD:?Set OPL_RESOURCE_CATALOG_DATABASE_PASSWORD}
      OPL_TENANT_DATABASE_PASSWORD: ${OPL_TENANT_DATABASE_PASSWORD:?Set OPL_TENANT_DATABASE_PASSWORD}
      OPL_GATEWAY_DATABASE_PASSWORD: ${OPL_GATEWAY_DATABASE_PASSWORD:?Set OPL_GATEWAY_DATABASE_PASSWORD}
    configs:
      - source: opl-local-v2-postgres-init
        target: /docker-entrypoint-initdb.d/10-opl-local-v2-databases.sh
        mode: 0555
    volumes:
      - opl-cloud-local-v2-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$$OPL_CONTROL_PLANE_DATABASE_PASSWORD" psql -h 127.0.0.1 -U opl_control_plane -d opl_control_plane -Atqc 'select 1' >/dev/null &&
          PGPASSWORD="$$OPL_FABRIC_DATABASE_PASSWORD" psql -h 127.0.0.1 -U opl_fabric_owner -d opl_fabric -Atqc 'select 1' >/dev/null &&
          PGPASSWORD="$$OPL_LEDGER_DATABASE_PASSWORD" psql -h 127.0.0.1 -U opl_ledger -d opl_ledger -Atqc 'select 1' >/dev/null &&
          PGPASSWORD="$$OPL_CAPABILITY_DATABASE_PASSWORD" psql -h 127.0.0.1 -U opl_capability_owner -d opl_capability -Atqc 'select 1' >/dev/null &&
          PGPASSWORD="$$OPL_BUILD_DATABASE_PASSWORD" psql -h 127.0.0.1 -U opl_build_owner -d opl_build -Atqc 'select 1' >/dev/null &&
          PGPASSWORD="$$OPL_RUNTIME_CONTROL_DATABASE_PASSWORD" psql -h 127.0.0.1 -U opl_runtime_control_owner -d opl_runtime_control -Atqc 'select 1' >/dev/null &&
          PGPASSWORD="$$OPL_WORKSPACE_DATABASE_PASSWORD" psql -h 127.0.0.1 -U opl_workspace_owner -d opl_workspace -Atqc 'select 1' >/dev/null &&
          PGPASSWORD="$$OPL_SERVE_DATABASE_PASSWORD" psql -h 127.0.0.1 -U opl_serve_owner -d opl_serve -Atqc 'select 1' >/dev/null &&
          PGPASSWORD="$$OPL_RESOURCE_CATALOG_DATABASE_PASSWORD" psql -h 127.0.0.1 -U opl_resource_catalog_owner -d opl_resource_catalog -Atqc 'select 1' >/dev/null &&
          PGPASSWORD="$$OPL_TENANT_DATABASE_PASSWORD" psql -h 127.0.0.1 -U opl_tenant_owner -d opl_tenant -Atqc 'select 1' >/dev/null &&
          PGPASSWORD="$$OPL_GATEWAY_DATABASE_PASSWORD" psql -h 127.0.0.1 -U opl_gateway_owner -d opl_gateway -Atqc 'select 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      opl-cloud-local-v2:
        ipv4_address: ${OPL_POSTGRES_HOST:-172.29.0.10}

  # The composed Cloud backend deployment unit. Runs all 11 declared owner
  # processes in one process space via opl-cloud-composition while preserving
  # per-owner PostgreSQL roles, mTLS service identities and allowlists.
  cloud-backend:
    image: ${OPL_CLOUD_IMAGE:?Set OPL_CLOUD_IMAGE to the product image digest}
    restart: unless-stopped
    init: true
    # Owner processes read 0600 PKI private keys, serve Capability object storage,
    # and drive host Docker / prjquota via Local-Docker Fabric.
    user: root
    cap_add:
      - SYS_ADMIN
    networks:
      - opl-cloud-local-v2
    command: ["/usr/local/bin/opl-cloud-composition"]
    labels:
      opl.fabric.local-docker.gateway: control-plane
      opl.cloud.fabric-provider: local-docker
    environment:
      NODE_ENV: production
      PGSSLMODE: disable
      OPL_CLOUD_OWNER_TOPOLOGY: /app/contracts/opl-cloud-owner-topology.json
      OPL_GRPC_CA_FILE: /pki/ca.crt
      OPL_GRPC_CERT_DIR: /pki
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      OPL_CLOUD_IDENTITY_URL: 127.0.0.1:8187
      OPL_CLOUD_IDENTITY_TOKEN: ${OPL_CLOUD_IDENTITY_TOKEN:?Set OPL_CLOUD_IDENTITY_TOKEN}
      # Database connections: DATABASE_URL serves retained legacy consumers
      # (control-plane, ledger, fabric HTTP); each extracted owner receives its
      # own explicit composition database URL projected by opl-cloud-composition.
      DATABASE_URL: postgresql://opl_control_plane:${OPL_CONTROL_PLANE_DATABASE_PASSWORD:?Set OPL_CONTROL_PLANE_DATABASE_PASSWORD}@${OPL_POSTGRES_HOST:-172.29.0.10}:5432/opl_control_plane?sslmode=disable
      OPL_TENANT_DATABASE_URL: postgresql://opl_tenant_owner:${OPL_TENANT_DATABASE_PASSWORD:?Set OPL_TENANT_DATABASE_PASSWORD}@${OPL_POSTGRES_HOST:-172.29.0.10}:5432/opl_tenant?sslmode=disable
      OPL_GATEWAY_DATABASE_URL: postgresql://opl_gateway_owner:${OPL_GATEWAY_DATABASE_PASSWORD:?Set OPL_GATEWAY_DATABASE_PASSWORD}@${OPL_POSTGRES_HOST:-172.29.0.10}:5432/opl_gateway?sslmode=disable
      OPL_RESOURCE_CATALOG_DATABASE_URL: postgresql://opl_resource_catalog_owner:${OPL_RESOURCE_CATALOG_DATABASE_PASSWORD:?Set OPL_RESOURCE_CATALOG_DATABASE_PASSWORD}@${OPL_POSTGRES_HOST:-172.29.0.10}:5432/opl_resource_catalog?sslmode=disable
      OPL_CAPABILITY_DATABASE_URL: postgresql://opl_capability_owner:${OPL_CAPABILITY_DATABASE_PASSWORD:?Set OPL_CAPABILITY_DATABASE_PASSWORD}@${OPL_POSTGRES_HOST:-172.29.0.10}:5432/opl_capability?sslmode=disable
      OPL_BUILD_DATABASE_URL: postgresql://opl_build_owner:${OPL_BUILD_DATABASE_PASSWORD:?Set OPL_BUILD_DATABASE_PASSWORD}@${OPL_POSTGRES_HOST:-172.29.0.10}:5432/opl_build?sslmode=disable
      OPL_RUNTIME_CONTROL_DATABASE_URL: postgresql://opl_runtime_control_owner:${OPL_RUNTIME_CONTROL_DATABASE_PASSWORD:?Set OPL_RUNTIME_CONTROL_DATABASE_PASSWORD}@${OPL_POSTGRES_HOST:-172.29.0.10}:5432/opl_runtime_control?sslmode=disable
      OPL_WORKSPACE_DATABASE_URL: postgresql://opl_workspace_owner:${OPL_WORKSPACE_DATABASE_PASSWORD:?Set OPL_WORKSPACE_DATABASE_PASSWORD}@${OPL_POSTGRES_HOST:-172.29.0.10}:5432/opl_workspace?sslmode=disable
      OPL_SERVE_DATABASE_URL: postgresql://opl_serve_owner:${OPL_SERVE_DATABASE_PASSWORD:?Set OPL_SERVE_DATABASE_PASSWORD}@${OPL_POSTGRES_HOST:-172.29.0.10}:5432/opl_serve?sslmode=disable
      OPL_FABRIC_DATABASE_URL: postgresql://opl_fabric_owner:${OPL_FABRIC_DATABASE_PASSWORD:?Set OPL_FABRIC_DATABASE_PASSWORD}@${OPL_POSTGRES_HOST:-172.29.0.10}:5432/opl_fabric?sslmode=disable
      # Owner & deployment-unit listeners inside the shared network namespace.
      OPL_CAPABILITY_ADDR: ":8181"
      OPL_CAPABILITY_OBJECT_LISTEN_ADDR: ":8191"
      OPL_BUILD_ADDR: ":8182"
      OPL_RUNTIME_CONTROL_ADDR: ":8183"
      OPL_WORKSPACE_ADDR: ":8184"
      OPL_SERVE_ADDR: ":8185"
      OPL_SERVE_ACCESS_ADDR: ":8192"
      OPL_RESOURCE_CATALOG_ADDR: ":8186"
      OPL_TENANT_ADDR: ":8187"
      OPL_FABRIC_ADDR: ":8188"
      OPL_LEDGER_ADDR: ":8189"
      OPL_BFF_ADDR: ":8190"
      LEDGER_ADDR: ":8081"
      FABRIC_ADDR: ":8082"
      CONTROL_PLANE_ADDR: ":8787"
      PORT: "8787"
      # Caller peer addresses resolved over loopback inside the shared container.
      OPL_CAPABILITY_URL: 127.0.0.1:8181
      OPL_BUILD_URL: 127.0.0.1:8182
      OPL_RUNTIME_CONTROL_URL: 127.0.0.1:8183
      OPL_WORKSPACE_URL: 127.0.0.1:8184
      OPL_SERVE_URL: 127.0.0.1:8185
      OPL_RESOURCE_CATALOG_URL: 127.0.0.1:8186
      OPL_GATEWAY_ADDR: 127.0.0.1:8187
      OPL_GATEWAY_URL: 127.0.0.1:8187
      OPL_FABRIC_URL: 127.0.0.1:8188
      OPL_FABRIC_COORDINATION_ADDR: 127.0.0.1:8188
      OPL_LEDGER_URL: 127.0.0.1:8189
      OPL_FABRIC_APPLICATION_URL: "http://127.0.0.1:8082"
      FABRIC_URL: "http://127.0.0.1:8082"
      LEDGER_URL: "http://127.0.0.1:8081"
      OPL_CONTROL_PLANE_URL: "http://127.0.0.1:8787"
      # Inbound peer allowlists & outbound service tokens.
      OPL_TENANT_PEER_TOKENS: ${OPL_TENANT_PEER_TOKENS:?Set OPL_TENANT_PEER_TOKENS}
      OPL_TENANT_TOKEN: ${OPL_CLOUD_IDENTITY_TOKEN}
      OPL_GATEWAY_TOKEN: ${OPL_CLOUD_IDENTITY_TOKEN}
      OPL_CAPABILITY_PEER_TOKENS: ${OPL_CAPABILITY_PEER_TOKENS:?Set OPL_CAPABILITY_PEER_TOKENS}
      OPL_CAPABILITY_TOKEN: ${OPL_CAPABILITY_TOKEN:?Set OPL_CAPABILITY_TOKEN}
      OPL_BUILD_PEER_TOKENS: ${OPL_BUILD_PEER_TOKENS:?Set OPL_BUILD_PEER_TOKENS}
      OPL_BUILD_TOKEN: ${OPL_BUILD_TOKEN:?Set OPL_BUILD_TOKEN}
      OPL_RUNTIME_CONTROL_PEER_TOKENS: ${OPL_RUNTIME_CONTROL_PEER_TOKENS:?Set OPL_RUNTIME_CONTROL_PEER_TOKENS}
      OPL_RUNTIME_CONTROL_TOKEN: ${OPL_RUNTIME_CONTROL_TOKEN:?Set OPL_RUNTIME_CONTROL_TOKEN}
      OPL_WORKSPACE_PEER_TOKENS: ${OPL_WORKSPACE_PEER_TOKENS:?Set OPL_WORKSPACE_PEER_TOKENS}
      OPL_WORKSPACE_TOKEN: ${OPL_WORKSPACE_TOKEN:?Set OPL_WORKSPACE_TOKEN}
      OPL_SERVE_PEER_TOKENS: ${OPL_SERVE_PEER_TOKENS:?Set OPL_SERVE_PEER_TOKENS}
      OPL_SERVE_TOKEN: ${OPL_SERVE_TOKEN:?Set OPL_SERVE_TOKEN}
      OPL_RESOURCE_CATALOG_PEER_TOKENS: ${OPL_RESOURCE_CATALOG_PEER_TOKENS:?Set OPL_RESOURCE_CATALOG_PEER_TOKENS}
      OPL_RESOURCE_CATALOG_TOKEN: ${OPL_RESOURCE_CATALOG_TOKEN:?Set OPL_RESOURCE_CATALOG_TOKEN}
      OPL_LEDGER_PEER_TOKENS: ${OPL_LEDGER_PEER_TOKENS:?Set OPL_LEDGER_PEER_TOKENS}
      OPL_LEDGER_TOKEN: ${OPL_LEDGER_TOKEN:?Set OPL_LEDGER_TOKEN}
      OPL_LEDGER_SERVICE_TOKEN: ${OPL_LEDGER_SERVICE_TOKEN:?Set OPL_LEDGER_SERVICE_TOKEN}
      OPL_LEDGER_CAPABILITY_KEY: ${OPL_LEDGER_CAPABILITY_KEY:?Set OPL_LEDGER_CAPABILITY_KEY}
      OPL_FABRIC_PEER_TOKENS: ${OPL_FABRIC_PEER_TOKENS:?Set OPL_FABRIC_PEER_TOKENS}
      OPL_FABRIC_TOKEN: ${OPL_FABRIC_TOKEN:?Set OPL_FABRIC_TOKEN}
      OPL_FABRIC_COORDINATION_TOKEN: ${OPL_FABRIC_TOKEN}
      OPL_FABRIC_SERVICE_TOKEN: ${OPL_FABRIC_SERVICE_TOKEN:?Set OPL_FABRIC_SERVICE_TOKEN}
      OPL_FABRIC_RUNNER_SERVICE_TOKEN: ${OPL_FABRIC_RUNNER_SERVICE_TOKEN:?Set OPL_FABRIC_RUNNER_SERVICE_TOKEN}
      OPL_FABRIC_CAPABILITY_KEY: ${OPL_FABRIC_CAPABILITY_KEY:?Set OPL_FABRIC_CAPABILITY_KEY}
      OPL_FABRIC_SERVE_SERVICE_TOKEN: ${OPL_FABRIC_SERVE_SERVICE_TOKEN:?Set OPL_FABRIC_SERVE_SERVICE_TOKEN}
      OPL_FABRIC_SERVE_CAPABILITY_KEY: ${OPL_FABRIC_SERVE_CAPABILITY_KEY:?Set OPL_FABRIC_SERVE_CAPABILITY_KEY}
      OPL_INTERNAL_SERVICE_TOKEN: ${OPL_INTERNAL_SERVICE_TOKEN:?Set OPL_INTERNAL_SERVICE_TOKEN}
      OPL_CONTROL_PLANE_TOKEN: ${OPL_CONTROL_PLANE_TOKEN:?Set OPL_CONTROL_PLANE_TOKEN}
      OPL_CONTROL_PLANE_BFF_TOKEN: ${OPL_CONTROL_PLANE_TOKEN:?Set OPL_CONTROL_PLANE_TOKEN}
      # External Sub2API, session, registry and admin configuration.
      OPL_SUB2API_BASE_URL: ${OPL_SUB2API_BASE_URL:?Set OPL_SUB2API_BASE_URL}
      OPL_SUB2API_URL: ${OPL_SUB2API_BASE_URL:?Set OPL_SUB2API_BASE_URL to the installation's HTTPS Sub2API URL}
      OPL_GATEWAY_DIRECTORY_EMAIL: ${OPL_SUB2API_ADMIN_EMAIL:?Set OPL_SUB2API_ADMIN_EMAIL for Gateway directory reads}
      OPL_GATEWAY_DIRECTORY_PASSWORD: ${OPL_SUB2API_ADMIN_PASSWORD:?Set OPL_SUB2API_ADMIN_PASSWORD for Gateway directory reads}
      OPL_SUB2API_USER_EMAIL: ${OPL_SUB2API_USER_EMAIL:?Set OPL_SUB2API_USER_EMAIL}
      OPL_SUB2API_USER_PASSWORD: ${OPL_SUB2API_USER_PASSWORD:?Set OPL_SUB2API_USER_PASSWORD}
      OPL_SUB2API_REQUEST_TIMEOUT_MS: ${OPL_SUB2API_REQUEST_TIMEOUT_MS:-5000}
      OPL_GATEWAY_WORKSPACE_KEY_GROUP: ${OPL_GATEWAY_WORKSPACE_KEY_GROUP:?Set OPL_GATEWAY_WORKSPACE_KEY_GROUP}
      OPL_SESSION_SIGNING_KEY: ${OPL_SESSION_SIGNING_KEY:?Set OPL_SESSION_SIGNING_KEY}
      OPL_INVITATION_TTL: ${OPL_INVITATION_TTL:-168h}
      OPL_PLATFORM_ADMIN_SUBJECTS: ${OPL_PLATFORM_ADMIN_SUBJECTS:?Set OPL_PLATFORM_ADMIN_SUBJECTS}
      OPL_AIONUI_ADMIN_PASSWORD_SEED: ${OPL_AIONUI_ADMIN_PASSWORD_SEED:?Set OPL_AIONUI_ADMIN_PASSWORD_SEED}
      OPL_WORKSPACE_REGISTRY_HOST: ${OPL_WORKSPACE_REGISTRY_HOST:?Set OPL_WORKSPACE_REGISTRY_HOST}
      OPL_WORKSPACE_REGISTRY_NAMESPACE: ${OPL_WORKSPACE_REGISTRY_NAMESPACE:?Set OPL_WORKSPACE_REGISTRY_NAMESPACE}
      OPL_WORKSPACE_REGISTRY_REPOSITORIES: ${OPL_WORKSPACE_REGISTRY_REPOSITORIES:-oplcloud/workspace}
      # Capability, Build, Runtime Control, Catalog, Serve, Fabric & Console settings.
      OPL_CAPABILITY_STORAGE_KIND: local
      OPL_CAPABILITY_OBJECT_ROOT: /var/lib/opl/objects
      OPL_CAPABILITY_OBJECT_URL: ${OPL_CAPABILITY_OBJECT_URL:?Set OPL_CAPABILITY_OBJECT_URL}
      OPL_CAPABILITY_OBJECT_TOKEN: ${OPL_CAPABILITY_OBJECT_TOKEN:?Set OPL_CAPABILITY_OBJECT_TOKEN}
      OPL_CAPABILITY_OBJECT_SIGNING_KEY: ${OPL_CAPABILITY_OBJECT_SIGNING_KEY:?Set OPL_CAPABILITY_OBJECT_SIGNING_KEY}
      OPL_CAPABILITY_PACKAGE_SCHEMA_PATH: /contracts/agent-plugins-1.0.0-plugin.schema.json
      OPL_CAPABILITY_PACKAGE_SCHEMA_DIGEST: ${OPL_CAPABILITY_PACKAGE_SCHEMA_DIGEST:?Set OPL_CAPABILITY_PACKAGE_SCHEMA_DIGEST}
      OPL_PUBLISHER_SCHEMA_PATH: /app/contracts/publisher-contract.schema.json
      OPL_PUBLISHER_SCHEMA_DIGEST: ${OPL_PUBLISHER_SCHEMA_DIGEST:?Set OPL_PUBLISHER_SCHEMA_DIGEST}
      OPL_RUNTIME_PUBLISHER_SCHEMA_PATH: /app/contracts/publisher-contract.schema.json
      OPL_RUNTIME_PUBLISHER_SCHEMA_DIGEST: ${OPL_PUBLISHER_SCHEMA_DIGEST}
      OPL_BUILD_BUILDER: ${OPL_BUILD_BUILDER:-opl-buildkit-local}
      OPL_BUILD_WORKDIR: /var/lib/opl/build
      OPL_BUILD_DOCKER_CONFIG: /var/lib/opl/build/docker
      OPL_BUILD_REGISTRY_PREFIX: ${OPL_BUILD_REGISTRY_PREFIX:-${OPL_WORKSPACE_REGISTRY_HOST:-registry.local-v2.test}/${OPL_WORKSPACE_REGISTRY_NAMESPACE:-opl}}
      OPL_BUILD_REGISTRY_TOKEN: ${OPL_BUILD_REGISTRY_TOKEN:?Set OPL_BUILD_REGISTRY_TOKEN}
      OPL_BUILD_INSECURE_HTTP_HOSTS: ${OPL_BUILD_INSECURE_HTTP_HOSTS:-}
      OPL_RESOURCE_CATALOG_PROFILE_JSON: ${OPL_RESOURCE_CATALOG_PROFILE_JSON:?Set OPL_RESOURCE_CATALOG_PROFILE_JSON}
      OPL_DEPLOYMENT_MODE: customer_owned
      OPL_FABRIC_PROVIDER: local-docker
      OPL_K8S_NAMESPACE: ""
      OPL_PUBLIC_URL: ${OPL_PUBLIC_URL:?Set OPL_PUBLIC_URL}
      OPL_WORKSPACE_DOMAIN: ${OPL_WORKSPACE_DOMAIN:?Set OPL_WORKSPACE_DOMAIN}
      OPL_WORKSPACE_APPLICATION_DOMAIN: ${OPL_WORKSPACE_APPLICATION_DOMAIN:-}
      OPL_WORKSPACE_APPLICATION_INGRESS_PEERS: ${OPL_WORKSPACE_APPLICATION_INGRESS_PEERS:-}
      OPL_CONSOLE_DIST_DIR: /app/dist
      OPL_SOFTWARE_PACKAGES_JSON: ${OPL_SOFTWARE_PACKAGES_JSON:-}
      OPL_SOFTWARE_REGISTRY_USERNAME: ${OPL_SOFTWARE_REGISTRY_USERNAME:-}
      OPL_SOFTWARE_REGISTRY_TOKEN: ${OPL_SOFTWARE_REGISTRY_TOKEN:-}
      OPL_SOFTWARE_CACHE_ROOT: ${OPL_SOFTWARE_CACHE_ROOT:-}
      OPL_CLOUD_IMAGE: ${OPL_CLOUD_IMAGE}
      OPL_WORKSPACE_IMAGE: ${OPL_WORKSPACE_IMAGE:?Set OPL_WORKSPACE_IMAGE to the approved Workspace image digest}
      OPL_RELEASE_SHA: ${OPL_RELEASE_SHA:?Set OPL_RELEASE_SHA}
      OPL_FABRIC_LOCAL_DOCKER_HOST: ${OPL_FABRIC_LOCAL_DOCKER_HOST:-127.0.0.1}
      OPL_FABRIC_LOCAL_DOCKER_PUBLISH_HOST: ${OPL_FABRIC_LOCAL_DOCKER_PUBLISH_HOST:-127.0.0.1}
      OPL_FABRIC_LOCAL_DOCKER_PROBE_IMAGE: ${OPL_CLOUD_IMAGE}
      OPL_FABRIC_LOCAL_DOCKER_GATEWAY_CONTAINER: ${COMPOSE_PROJECT_NAME:-opl-cloud}-cloud-backend-1
      OPL_FABRIC_LOCAL_DOCKER_STORAGE_ROOT: ${OPL_FABRIC_LOCAL_DOCKER_STORAGE_ROOT:?Set OPL_FABRIC_LOCAL_DOCKER_STORAGE_ROOT to the Workspace storage root on this host}
      OPL_FABRIC_LOCAL_DOCKER_SECRET_ROOT: ${OPL_FABRIC_LOCAL_DOCKER_SECRET_ROOT:?Set OPL_FABRIC_LOCAL_DOCKER_SECRET_ROOT to the Workspace secret root on this host}
      OPL_FABRIC_LOCAL_DOCKER_ALLOW_UNBOUNDED_SWAP: ${OPL_FABRIC_LOCAL_DOCKER_ALLOW_UNBOUNDED_SWAP:-0}
      OPL_FABRIC_LOCAL_DOCKER_PROVIDER_PROFILE_JSON: ${OPL_FABRIC_LOCAL_DOCKER_PROVIDER_PROFILE_JSON:?Set OPL_FABRIC_LOCAL_DOCKER_PROVIDER_PROFILE_JSON}
      OPL_FABRIC_LOCAL_DOCKER_TRUSTED_WORKSPACE_IMAGES: ${OPL_FABRIC_LOCAL_DOCKER_TRUSTED_WORKSPACE_IMAGES:?Set OPL_FABRIC_LOCAL_DOCKER_TRUSTED_WORKSPACE_IMAGES}
    volumes:
      - type: bind
        source: ${OPL_CAPABILITY_PACKAGE_SCHEMA_HOST_PATH:?Set OPL_CAPABILITY_PACKAGE_SCHEMA_HOST_PATH to the published Agent Plugins schema}
        target: /contracts/agent-plugins-1.0.0-plugin.schema.json
        read_only: true
      - opl-cloud-local-v2-objects:/var/lib/opl/objects
      - opl-cloud-local-v2-build:/var/lib/opl/build
      - opl-cloud-local-v2-fabric:/var/lib/opl/fabric
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: ${OPL_FABRIC_LOCAL_DOCKER_STORAGE_ROOT:?Set OPL_FABRIC_LOCAL_DOCKER_STORAGE_ROOT}
        target: ${OPL_FABRIC_LOCAL_DOCKER_STORAGE_ROOT:?Set OPL_FABRIC_LOCAL_DOCKER_STORAGE_ROOT}
      - type: bind
        source: ${OPL_FABRIC_LOCAL_DOCKER_SECRET_ROOT:?Set OPL_FABRIC_LOCAL_DOCKER_SECRET_ROOT}
        target: ${OPL_FABRIC_LOCAL_DOCKER_SECRET_ROOT:?Set OPL_FABRIC_LOCAL_DOCKER_SECRET_ROOT}
      - type: bind
        source: ${OPL_PKI_DIR:?Set OPL_PKI_DIR to the directory local-v2-pki.sh wrote}
        target: /pki
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy

  # The same-origin entry. The Console is served from one origin and routes
  # /api/v2/ and Console SPA static assets (/) to Console BFF inside
  # cloud-backend, while keeping /api/ on the retained Control Plane listener.
  cloud-local-v2:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    restart: unless-stopped
    environment:
      OPL_WORKSPACE_DOMAIN: ${OPL_WORKSPACE_DOMAIN:?Set OPL_WORKSPACE_DOMAIN}
      OPL_WORKSPACE_APPLICATION_DOMAIN: ${OPL_WORKSPACE_APPLICATION_DOMAIN:-}
      NGINX_ENVSUBST_FILTER: ^OPL_
    ports:
      - "${OPL_BIND_ADDRESS:-127.0.0.1}:${OPL_PROXY_PORT:-8443}:8443"
    volumes:
      - type: bind
        source: ./cloud-proxy.nginx.conf
        target: /etc/nginx/templates/default.conf.template
        read_only: true
      - type: bind
        source: ${OPL_PKI_DIR:?Set OPL_PKI_DIR}
        target: /pki
        read_only: true
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--output-document", "/dev/null", "https://127.0.0.1:8443/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      cloud-backend:
        condition: service_started
    networks:
      - opl-cloud-local-v2

volumes:
  opl-cloud-local-v2-postgres: {}
  opl-cloud-local-v2-objects: {}
  opl-cloud-local-v2-build: {}
  opl-cloud-local-v2-fabric: {}

networks:
  opl-cloud-local-v2:
    ipam:
      config:
        # This installation's own subnet. It is separate from the base
        # installation's OPL_DOCKER_SUBNET, because Docker refuses two networks
        # with the same subnet on one host, and a host that runs both
        # installations would fail to start this one.
        - subnet: ${OPL_DOCKER_SUBNET:-172.29.0.0/24}

configs:
  opl-local-v2-postgres-init:
    file: ./owner-databases.sh
