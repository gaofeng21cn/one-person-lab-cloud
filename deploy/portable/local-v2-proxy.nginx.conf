# Same-origin entry for the local v2 owner topology.
#
# The Console is served from one origin and calls two browser-facing surfaces:
# /api/v2/ belongs to the Console BFF and /api/ belongs to the retained
# Control Plane history path. The owner topology declares both as
# browserFacing, so this file is where one origin resolves them.
#
# The v2 path is resolved here and only here. A request under /api/v2/ is
# answered by the Console BFF and never by the retained Control Plane, and it
# never falls back to the Control Plane when the BFF is unavailable: a failing
# upstream is reported as a failing upstream instead of being answered by the
# process this topology is retiring.
#
# Capability's object data plane and the local Sub2API authority are mounted
# on the same origin because both are read from this origin: Capability signs
# its upload URLs against this origin, and the tenant's Gateway directory
# reads the Sub2API authority through it.

resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 8443 ssl;
    server_name localhost cloud-local-v2;

    ssl_certificate     /pki/proxy.crt;
    ssl_certificate_key /pki/proxy.key;
    ssl_protocols       TLSv1.3;

    client_max_body_size 64m;

    # The proxy's own liveness. It answers without an upstream, so a healthy
    # route provider is never reported unhealthy because an owner is still
    # starting. It says nothing about any owner's readiness.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The Console's v2 surface. This is the only place /api/v2/ is served.
    location /api/v2/ {
        set $console_bff "console-bff:8190";
        proxy_pass http://$console_bff$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # A Workspace deletion drives the retirement chain inside the owner
        # before it answers the command, so the origin's budget has to cover one
        # command rather than one read.
        proxy_read_timeout 180s;
    }

    # The retained Control Plane history path. It stays on the same origin so
    # the existing customer records and the announced Cloud publications keep
    # one address while the v2 surface takes over the new work.
    location /api/ {
        set $control_plane "control-plane:8787";
        proxy_pass http://$control_plane$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # Capability's object data plane. The signed upload permits Capability
    # issues point at this origin, and Build reads the immutable objects here.
    location /objects/ {
        set $capability_objects "capability:8191";
        proxy_pass http://$capability_objects$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # The local Sub2API authority. The tenant and the retained Control Plane
    # read it through this origin because the Gateway adapter admits an
    # unencrypted endpoint only on loopback.
    location /sub2api/ {
        set $sub2api_authority "sub2api-authority:8080";
        # The prefix is removed here because proxy_pass with a URI replaces
        # the whole request path, which would leave the authority reading "/".
        rewrite ^/sub2api/(.*)$ /$1 break;
        proxy_pass http://$sub2api_authority$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The Console bundle and the remaining retained Control Plane surface.
    location / {
        set $control_plane_root "control-plane:8787";
        proxy_pass http://$control_plane_root$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
