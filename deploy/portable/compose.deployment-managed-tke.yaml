services:
  control-plane:
    labels:
      opl.cloud.deployment-mode: managed_tke
    environment:
      OPL_DEPLOYMENT_MODE: managed_tke
      OPL_SUB2API_ADMIN_EMAIL: ${OPL_SUB2API_ADMIN_EMAIL:?Set OPL_SUB2API_ADMIN_EMAIL}
      OPL_SUB2API_ADMIN_PASSWORD: ${OPL_SUB2API_ADMIN_PASSWORD:?Set OPL_SUB2API_ADMIN_PASSWORD}
      OPL_RELEASE_SHA: ${OPL_RELEASE_SHA:?Set OPL_RELEASE_SHA}
      OPL_RELEASE_TREE: ${OPL_RELEASE_TREE:?Set OPL_RELEASE_TREE}
      OPL_WORKSPACE_LAUNCH_WORKER_ENABLED: "1"
      OPL_WORKSPACE_APPLICATION_DEPLOYMENT_WORKER_ENABLED: "1"
      OPL_MONTHLY_BILLING_WORKER_ENABLED: "1"
