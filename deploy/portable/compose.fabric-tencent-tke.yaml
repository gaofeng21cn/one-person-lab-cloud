services:
  fabric:
    labels:
      opl.cloud.fabric-provider: tencent-tke
    environment:
      OPL_FABRIC_PROVIDER: tencent-tke
      OPL_INGRESS_CLASS: ${OPL_INGRESS_CLASS:-}
      # The Tencent provider validates and reads these facts itself
      # (services/fabric/internal/fabric/tencent_provider.go and
      # tencent_provider_runtime.go): the constructor refuses to build a usable
      # provider without the Workspace domain, the immutable Workspace image, the
      # namespace and the provisioner binary, and Readiness reports the rest as
      # missing. Every one is sourced from the installer environment so the
      # provider fails before any provider or cluster action instead of running
      # with an empty fact.
      OPL_WORKSPACE_DOMAIN: ${OPL_WORKSPACE_DOMAIN:?Set OPL_WORKSPACE_DOMAIN}
      OPL_CLOUD_IMAGE: ${OPL_CLOUD_IMAGE:?Set OPL_CLOUD_IMAGE}
      OPL_WORKSPACE_IMAGE: ${OPL_WORKSPACE_IMAGE:?Set OPL_WORKSPACE_IMAGE to an immutable Workspace image digest}
      OPL_WORKSPACE_IMAGE_RELEASES_JSON: ${OPL_WORKSPACE_IMAGE_RELEASES_JSON:?Set the approved immutable Workspace image release catalog}
      OPL_K8S_NAMESPACE: ${OPL_K8S_NAMESPACE:?Set OPL_K8S_NAMESPACE}
      OPL_IMAGE_PULL_SECRET_NAME: ${OPL_IMAGE_PULL_SECRET_NAME:?Set OPL_IMAGE_PULL_SECRET_NAME}
      OPL_WORKSPACE_STORAGE_CLASS: ${OPL_WORKSPACE_STORAGE_CLASS:?Set OPL_WORKSPACE_STORAGE_CLASS}
      OPL_TENCENT_PROVISIONER_BIN: ${OPL_TENCENT_PROVISIONER_BIN:?Set OPL_TENCENT_PROVISIONER_BIN}
      TENCENT_DEPLOY_KUBECONFIG_REF: ${TENCENT_DEPLOY_KUBECONFIG_REF:?Set TENCENT_DEPLOY_KUBECONFIG_REF}
      # Explicit live-mutation opt-in. The provisioner refuses every non-dry-run
      # Tencent mutation unless this is "1", so the installation states it rather
      # than inheriting a permissive default.
      RUN_TENCENT_CREATE_RELEASE_EXECUTION: ${RUN_TENCENT_CREATE_RELEASE_EXECUTION:?Set RUN_TENCENT_CREATE_RELEASE_EXECUTION to 1 to authorize live Tencent resource mutations}
      OPL_FABRIC_TENCENT_TKE_PROVIDER_PROFILE_JSON: ${OPL_FABRIC_TENCENT_TKE_PROVIDER_PROFILE_JSON:?Set the deployment-owned Tencent/TKE provider profile JSON}
      # Fabric owns infrastructure provisioning and the retained application caller.
      # Serve owns new application execution. These infrastructure credentials
      # are supplied by the installer secret environment and are never written to
      # the Workspace or Control Plane containers.
      TENCENTCLOUD_SECRET_ID: ${TENCENTCLOUD_SECRET_ID:?Set TENCENTCLOUD_SECRET_ID}
      TENCENTCLOUD_SECRET_KEY: ${TENCENTCLOUD_SECRET_KEY:?Set TENCENTCLOUD_SECRET_KEY}
      TENCENTCLOUD_REGION: ${OPL_TENCENT_REGION:?Set OPL_TENCENT_REGION}
      TENCENT_DEPLOY_CLUSTER_ID: ${TENCENT_DEPLOY_CLUSTER_ID:?Set TENCENT_DEPLOY_CLUSTER_ID}
      TENCENT_CVM_SUBNET_ID: ${TENCENT_CVM_SUBNET_ID:?Set TENCENT_CVM_SUBNET_ID}
      TENCENT_CVM_SECURITY_GROUP_IDS: ${TENCENT_CVM_SECURITY_GROUP_IDS:?Set TENCENT_CVM_SECURITY_GROUP_IDS}
      OPL_WORKSPACE_NODE_IMAGE_GC_HIGH_THRESHOLD_PERCENT: ${OPL_WORKSPACE_NODE_IMAGE_GC_HIGH_THRESHOLD_PERCENT:?Set OPL_WORKSPACE_NODE_IMAGE_GC_HIGH_THRESHOLD_PERCENT}
      OPL_WORKSPACE_NODE_IMAGE_GC_LOW_THRESHOLD_PERCENT: ${OPL_WORKSPACE_NODE_IMAGE_GC_LOW_THRESHOLD_PERCENT:?Set OPL_WORKSPACE_NODE_IMAGE_GC_LOW_THRESHOLD_PERCENT}
      OPL_TENCENT_ZONE: ${OPL_TENCENT_ZONE:?Set OPL_TENCENT_ZONE}
      OPL_TENCENT_REGION: ${OPL_TENCENT_REGION:?Set OPL_TENCENT_REGION}
      # The protected-resource guard rejects every mutating kubectl action unless
      # these identify the installation's own system node pool and machine.
      OPL_SYSTEM_COMPUTE_NODE_POOL_ID: ${OPL_SYSTEM_COMPUTE_NODE_POOL_ID:?Set OPL_SYSTEM_COMPUTE_NODE_POOL_ID}
      OPL_SYSTEM_COMPUTE_MACHINE_ID: ${OPL_SYSTEM_COMPUTE_MACHINE_ID:?Set OPL_SYSTEM_COMPUTE_MACHINE_ID}
      OPL_SYSTEM_COMPUTE_NODE_NAME: ${OPL_SYSTEM_COMPUTE_NODE_NAME:?Set OPL_SYSTEM_COMPUTE_NODE_NAME}
      OPL_SYSTEM_COMPUTE_MACHINE_TYPE: ${OPL_SYSTEM_COMPUTE_MACHINE_TYPE:?Set OPL_SYSTEM_COMPUTE_MACHINE_TYPE}
      OPL_SYSTEM_COMPUTE_CVM_ID: ${OPL_SYSTEM_COMPUTE_CVM_ID:-}
      TENCENT_CVM_SYSTEM_DISK_TYPE: ${TENCENT_CVM_SYSTEM_DISK_TYPE:?Set TENCENT_CVM_SYSTEM_DISK_TYPE}
      TENCENT_CVM_SYSTEM_DISK_SIZE_GB: ${TENCENT_CVM_SYSTEM_DISK_SIZE_GB:?Set TENCENT_CVM_SYSTEM_DISK_SIZE_GB}
      TENCENT_CBS_DISK_TYPE: ${TENCENT_CBS_DISK_TYPE:?Set TENCENT_CBS_DISK_TYPE}
    # This mount belongs to Fabric infrastructure and historical operations.
    # Serve application execution has its own declared installation boundary;
    # this overlay does not grant or prove Serve access. The installer
    # mounts the TKE deploy kubeconfig read-only at the provider path.
    volumes:
      - type: bind
        source: ${TENCENT_DEPLOY_KUBECONFIG_HOST_PATH:?Set the host path of the TKE deploy kubeconfig}
        target: ${TENCENT_DEPLOY_KUBECONFIG_REF:?Set TENCENT_DEPLOY_KUBECONFIG_REF}
        read_only: true

  control-plane:
    labels:
      opl.cloud.fabric-provider: tencent-tke
    environment:
      OPL_FABRIC_PROVIDER: tencent-tke
      OPL_WORKSPACE_IMAGE: ${OPL_WORKSPACE_IMAGE:?Set OPL_WORKSPACE_IMAGE to an immutable Workspace image digest}
      OPL_WORKSPACE_IMAGE_RELEASES_JSON: ${OPL_WORKSPACE_IMAGE_RELEASES_JSON:?Set the approved immutable Workspace image release catalog}
      OPL_TENCENT_ZONE: ${OPL_TENCENT_ZONE:?Set OPL_TENCENT_ZONE}
      OPL_TENCENT_REGION: ${OPL_TENCENT_REGION:?Set OPL_TENCENT_REGION}
