<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="opl-cloud-webui" content="generic-agent-webui/v1">
  <title>智能体工作空间 · OPL Cloud</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="shell" data-opl-cloud-agent-webui="v1">
    <header class="topbar">
      <div class="topbar-brand">
        <span class="eyebrow">OPL CLOUD</span>
        <h1 id="workspace-title">智能体工作空间</h1>
      </div>
      <div class="topbar-actions">
        <span id="runtime-status" class="status" role="status">正在连接…</span>
        <button id="new-chat" class="btn-secondary" type="button" disabled>新建对话</button>
        <button id="export-chat" class="btn-secondary" type="button" disabled>导出会话</button>
        <a id="console-link" class="btn-link" rel="noopener noreferrer" target="_blank" hidden>返回控制台</a>
      </div>
    </header>

    <section id="guidance" class="guidance" aria-live="polite" hidden></section>

    <section class="workspace" aria-label="智能体对话">
      <div id="messages" class="messages" aria-live="polite">
        <div class="empty">
          <strong>开始对话</strong>
          <span>输入任务开始对话，按 Ctrl / ⌘ + Enter 发送。</span>
        </div>
      </div>

      <form id="composer" class="composer">
        <div class="field">
          <label for="agent">智能体</label>
          <select id="agent" required disabled>
            <option>正在加载智能体…</option>
          </select>
        </div>
        <div class="field field--grow">
          <label for="prompt">输入任务</label>
          <textarea id="prompt" rows="5" required placeholder="输入你想交给智能体完成的任务…" disabled></textarea>
        </div>
        <div class="composer-actions">
          <span id="hint">正在检查运行状态…</span>
          <button id="send" class="btn-primary" type="submit" disabled>发送</button>
        </div>
      </form>
    </section>

    <details class="diagnostics">
      <summary>技术详情</summary>
      <pre id="diagnostics-body">尚未加载。</pre>
    </details>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
