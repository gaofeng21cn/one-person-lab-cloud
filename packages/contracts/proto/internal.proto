syntax = "proto3";
package opl.cloud.api;
option go_package = "opl-cloud/packages/contracts/go/api;api";
import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
// Target contract, not current runtime evidence. Internal services authenticate mTLS
// service identities and revalidate tenant/actor authorization. Never accept browser
// self-asserted tenant, price, provider, wallet identity or raw image.
// int64 money=USD micros; wire JSON adapters encode decimal strings, never doubles.
// Owner databases, operations and Outbox/Inbox are isolated; no cross-owner SQL.
message CallContext {
 string request_id = 1;
 string idempotency_key = 2;
 string authorization_context_id = 3;
 string actor_id = 4;
 optional string session_id = 5;
 AuthorizationScope scope = 6;
 optional string accepted_operation_grant_id = 7;
 google.protobuf.Timestamp deadline_at = 8;
}



message FieldError {
 string field = 1;
 ErrorCodeEnum code = 2;
 string message = 3;
}

message Error {
 ErrorCodeEnum code = 1;
 string message = 2;
 string request_id = 3;
 repeated FieldError field_errors = 4;
}

