// ResolveBuildInput is side-effect-free. Claim IDs are empty until a queued job
// exists. Worker acquires all three, commits IDs locally, then binds owner evidence
// BEFORE reading source bytes or invoking BuildKit. No cross-owner atomic transaction.
message ReferenceTarget { oneof target { string package_version_id = 1; string runtime_version_id = 2; string webui_version_id = 3; string capability_version_id = 4; } }
enum ReferenceClaimState { REFERENCE_CLAIM_STATE_UNSPECIFIED = 0; REFERENCE_CLAIM_STATE_ACQUIRED = 1; REFERENCE_CLAIM_STATE_BOUND = 2; REFERENCE_CLAIM_STATE_RELEASED = 3; }
