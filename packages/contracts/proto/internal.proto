message ProviderPlanChangeExecutionPlanReference { string id = 1; string digest = 2; PlanChangeExecutionStrategy strategy = 3; string approval_receipt_id = 4; }
message ReadProviderExecutionPlanRequest { CallContext context = 1; string workspace_id = 2; ProviderPlanChangeExecutionPlanReference reference = 3; }
message ProviderPlanChangeExecutionPlan { ProviderPlanChangeExecutionPlanReference reference = 1; string workspace_id = 2; string provider_profile_id = 3; string source_resource_set_id = 4; string expected_source_resource_version = 5; string source_compute_resource_id = 6; string source_storage_resource_id = 7; string source_attachment_id = 8; ResourcePlanSnapshot source = 9; ResourcePlanSnapshot target = 10; optional string target_pool_id = 11; PlanChangeStorageAction storage_action = 12; bool filesystem_expansion_required = 13; bool drain_required = 14; bool preserve_storage_identity = 15; google.protobuf.Timestamp approved_at = 16; }
// Fabric freezes this concrete strategy before quote. Its immutable preflight
// record/approval receipt, not a client-provided plan, is resolved on execution.
// Current Tencent TKE may claim a target pool and rebind existing CBS rather than
// directly reset a customer CVM type. A changed Compute ID is valid only under that
// approved strategy and exact data/app/Key readback. Storage expansion is a separate
// supported capability; shrink is never fabricated. Failure cannot switch strategy.

message SourceFinancialSnapshot { int32 schema_version = 1; string subscription_id = 2; int64 subscription_version = 3; string period_id = 4; string compute_plan_id = 5; string storage_plan_id = 6; string accepted_price_policy_version_id = 7; int64 accepted_monthly_usd_micros = 8; string original_period_start = 9; string original_period_end = 10; int64 period_start_milliseconds = 11; int64 period_end_milliseconds = 12; int32 billing_anchor_day = 13; string source_owner_evidence_reference = 14; }
// SourceFinancialSnapshot is a fixed, typed, immutable financial basis: no observedAt,
// current app/config state or display-only mutable data in its bytes. Workspace
// encodes once and returns original UTF-8 bytes plus SHA-256; Catalog/acceptance/plan
// retain those SAME bytes. The typed projection is decoded and checked against them,
// not reserialized to invent a matching digest. Source native UnixMilli is computed
// before PG timestamp rounding. Original S/E text remains unchanged for provenance.
// Catalog captures quoteT native UnixMilli once. All price/refund multiplication is
// arbitrary precision integer; canonical ms columns, NEVER PG timestamps or float.

// The Gateway derives the refund settlement key from original charge + purpose +
// PlanChange (+ deletion receipt for deletion). A requested/unknown SAME settlement
// returns its existing refund identity/readback, never a second smaller refund.
// Missing authoritative accepted price means no financial snapshot/quote; never
// encode absent evidence as a zero-price snapshot or recalculate from current catalog.


