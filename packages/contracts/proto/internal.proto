// Outbox INSERT is atomic with the owning state mutation. Producers retry delivery
// with the SAME event_id. Consumers verify exact event type/version and tenant scope;
// INSERT inbox_events(event_id) and local state change + local Outbox happen in one
// database transaction before ACK. UNIQUE producer+event_id prevents duplicate effects.
// Event versions may have legitimate gaps because consumers subscribe to a subset.
// Immutable facts deduplicate by event_id plus business identity, regardless of order.
// Mutable projections use monotonic aggregate_version CAS to reject stale overwrite.
// Dependent effects require explicit predecessor facts/receipts; missing dependencies
// stay unprocessed for retry, never infer lost events from version gaps. Duplicate ACK;
// unsupported schema rejects explicitly. No cross-owner transaction or NATS.
message EventEnvelope {
 string event_id = 1; string event_type = 2; int32 schema_version = 3;
 string owner = 4; string tenant_id = 5; string aggregate_id = 6;
 int64 aggregate_version = 7; google.protobuf.Timestamp occurred_at = 8;
 string request_id = 9;
 string scope = 10; // tenant requires tenant_id; platform forbids it. Validated against events.json.
 oneof payload {
 PackageUploadedEvent package_uploaded = 20;
 BuildArtifactConfirmedEvent build_artifact_confirmed = 21;
 CapabilityVersionRegisteredEvent capability_version_registered = 22;
 BuildFailedEvent build_failed = 23;
 WalletOperationObservedEvent wallet_operation_observed = 24;
 ResourcesObservedEvent resources_observed = 25;
