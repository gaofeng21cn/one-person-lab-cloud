message ClaimUsageEvidence { string claim_id = 1; OwnerEnum owner = 2; string resource_id = 3; string operation_id = 4; string accepted_input_digest = 5; OperationStatusEnum operation_status = 6; bool actively_required = 7; int64 committed_version = 8; optional string terminal_receipt_id = 9; optional string confirmed_absence_receipt_id = 10; Observation outcome = 11; google.protobuf.Timestamp observed_at = 12; string deployment_descriptor_digest = 13; int64 execution_epoch = 14; string deployment_descriptor_object_ref = 15; }
message ResolvePublisherContractRequest { CallContext context = 1; PublisherContractReference reference = 2; }
message ResolvedPublisherContract { PublisherContractReference reference = 1; PublisherContract contract = 2; ArtifactReference image = 3; Observation outcome = 4; }
// ClaimUsageReadback is implemented by existing Build/Workspace owners, not a new
// process. Capability authenticates the exact owner peer and queries committed
// state; a caller-supplied receipt string alone never proves bind/release validity.
service ClaimUsageReadback { rpc ReadClaimUsage(ReadClaimUsageRequest) returns (ClaimUsageEvidence); }
