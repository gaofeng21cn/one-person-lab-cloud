message AcceptedOperationGrantRequest { string authorization_context_id = 1; OwnerCommitEvidence owner_commit_evidence = 2; repeated AuthorizationActionEnum allowed_actions = 3; optional string renewal_consent_id = 4; optional string subscription_period_id = 5; }
enum AcceptedGrantMode { ACCEPTED_GRANT_MODE_UNSPECIFIED = 0; ACCEPTED_GRANT_MODE_CONTINUE_ORIGINAL = 1; ACCEPTED_GRANT_MODE_CLOSEOUT_ONLY = 2; ACCEPTED_GRANT_MODE_REVOKED = 3; }
message AcceptedOperationGrant { string id = 1; AuthorizationScope scope = 2; string actor_id = 3; OwnerEnum accepted_operation_owner = 4; string accepted_operation_id = 5; AuthorizationActionEnum accepted_action = 6; string resource_id = 7; int64 accepted_permission_version = 8; repeated AuthorizationActionEnum allowed_actions = 9; AcceptedGrantMode mode = 10; google.protobuf.Timestamp issued_at = 11; optional google.protobuf.Timestamp expires_at = 12; optional google.protobuf.Timestamp revoked_at = 13; optional google.protobuf.Timestamp obligation_completed_at = 14; }
// CloudIdentityAuthorization lives in Gateway Integration using tenant owner DB.
// issuer MUST be cloud_identity; signed mTLS peer has a fixed service/action
// allowlist. Never trust a service identity or role supplied inside request body.
// Interactive: validate live session, scope, membership/platform role, latest
// permission_version, exact audience/action/resource on EVERY privileged call.
// Accepted grant: verify owner committed operation accepted within original context
// lifetime via typed owner readback. Allowed actions are the intersection of the
// original action's fixed workflow and requested actions, never arbitrary elevation.
// Logout/member revoke cannot erase debt/cleanup obligations; Tenant inactive or
// revoked owner access allows ONLY readback/closeout/refund/revoke/delete already
// authorized resources, not a new debit/purchase/resize/extension. Automatic renewal
// additionally requires exact saved consent+same subscription period identity.
// Unavailable authorizer rejects; no stale cached allow decision. Platform scope has
// NO fabricated tenant ID. Platform admins may target a tenant unlike their session.
message ReadOwnerCommitRequest { OwnerEnum owner = 1; string operation_id = 2; string resource_id = 3; }
service OwnerCommitReadback { rpc ReadOwnerCommit(ReadOwnerCommitRequest) returns (OwnerCommitEvidence); }
