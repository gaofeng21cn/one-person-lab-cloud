message BindReferenceRequest { CallContext context = 1; string claim_id = 2; OwnerCommitEvidence owner_commit_evidence = 3; }
enum TerminalOperationStatus { TERMINAL_OPERATION_STATUS_UNSPECIFIED = 0; TERMINAL_OPERATION_STATUS_SUCCEEDED = 1; TERMINAL_OPERATION_STATUS_FAILED = 2; TERMINAL_OPERATION_STATUS_CANCELLED = 3; }
message ReleaseEvidence { OwnerEnum owner = 1; string operation_id = 2; string resource_id = 3; TerminalOperationStatus terminal_status = 4; string terminal_receipt_id = 5; optional string confirmed_resource_absence_receipt_id = 6; }
message ReleaseReferenceRequest { CallContext context = 1; string claim_id = 2; ReleaseEvidence release_evidence = 3; }
message ReferenceClaim { string id = 1; ReferenceTarget target = 2; OwnerEnum claimant_owner = 3; string claimant_resource_id = 4; ReferenceClaimState state = 5; optional string bound_operation_id = 6; optional string bound_input_digest = 7; google.protobuf.Timestamp acquired_at = 8; optional google.protobuf.Timestamp released_at = 9; }
