message AuthorizationRequest { AuthorizationScope scope = 1; string actor_id = 2; optional string session_id = 3; optional string authorization_context_id = 4; optional string accepted_operation_grant_id = 5; OwnerEnum audience_owner = 6; AuthorizationActionEnum action = 7; AuthorizationResource resource = 8; optional int64 expected_permission_version = 9; string request_id = 10; }
enum AuthorizationIssuer { AUTHORIZATION_ISSUER_UNSPECIFIED = 0; AUTHORIZATION_ISSUER_CLOUD_IDENTITY = 1; }
message AuthorizationDecision { AuthorizationResult result = 1; AuthorizationIssuer issuer = 2; optional string authorization_context_id = 3; AuthorizationScope scope = 4; string actor_id = 5; optional string session_id = 6; OwnerEnum audience_owner = 7; AuthorizationActionEnum action = 8; AuthorizationResource resource = 9; int64 permission_version = 10; google.protobuf.Timestamp issued_at = 11; google.protobuf.Timestamp expires_at = 12; optional ErrorCodeEnum denial_code = 13; optional string accepted_operation_grant_id = 14; }
