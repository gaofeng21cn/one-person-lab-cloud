// Scheduled plans do not hold a resource execution lock. Workspace app/model
// admission must remain compatible with the scheduled target and reject a conflict
// BEFORE changing the app, without silently cancelling/repricing the plan.
// Runtime restore RPC is NOT called for resource-only legacy bindings. Ledger
// evidence then explicitly says not_applicable and contains no fake readiness.
// quoteAt is the quote-generated pricing basis T, never the acceptance/worker time.
// An unrelated future period obligation already accepted/confirmed blocks a new
// PlanChange. An unpaid, unaccepted obligation may be rebound only by explicit
// cancel + new quote and obligation.version CAS, preserving its period identity.
// Own scheduled prepayment retains original source subscription version and may
// advance only to the matching obligation.confirmed_subscription_version; all
// unrelated financial/resource changes are stale. Current Workspace CAS fences
// ordinary app/config changes separately, not by changing the financial basis.

enum PlanChangeExecutionStrategy { PLAN_CHANGE_EXECUTION_STRATEGY_UNSPECIFIED = 0; PLAN_CHANGE_EXECUTION_STRATEGY_IN_PLACE_RESIZE = 1; PLAN_CHANGE_EXECUTION_STRATEGY_CLAIM_TARGET_POOL_AND_REBIND_EXISTING_STORAGE = 2; }
