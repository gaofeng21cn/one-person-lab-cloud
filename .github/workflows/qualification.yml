name: OPL Cloud Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node_console:
    name: node-console
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test Node
        run: |
          set -o pipefail
          # shellcheck disable=SC2016
          node --test --test-reporter=tap "tests/**/*.test.ts" | node -e '
            let output = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { process.stdout.write(chunk); output += chunk; });
            process.stdin.on("end", () => {
              const failed = [...output.matchAll(/^# fail (\d+)$/gm)];
              const skipped = [...output.matchAll(/^# skipped (\d+)$/gm)];
              if (failed.length !== 1 || skipped.length !== 1 || Number(failed[0][1]) !== 0 || Number(skipped[0][1]) !== 0) {
                console.error(`Node FAIL ${failed[0]?.[1] ?? "missing"} SKIP ${skipped[0]?.[1] ?? "missing"}; Node SKIP result missing or nonzero`);
                process.exit(1);
              }
            });
          '

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Check diff whitespace
        run: git diff --check

  go_contracts:
    name: go-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - *checkout

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/contracts/go/go.mod
          cache: false

      - name: Test Go contracts
        working-directory: packages/contracts/go
        run: go test -count=1 ./...

  postgres_ledger:
    name: postgres-ledger
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services: &postgres_service
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
      PGSSLMODE: disable
      OPL_POSTGRES_TESTS: "1"
    steps:
      - *checkout

      - &setup_node
        name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            services/ledger/go.sum
            services/internal/postgresmigrate/go.sum

      - name: Test PostgreSQL migrations
        working-directory: services/internal/postgresmigrate
        env:
          GO_TEST_ARGS: "-race -count=1"
        run: &go_test |
          set -o pipefail
          go test -run '^$' ./...
          package_list="$(go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./...)"
          mapfile -t test_packages < <(sed '/^$/d' <<< "$package_list")
          ((${#test_packages[@]} > 0))
          read -r -a go_test_args <<< "$GO_TEST_ARGS"
          # shellcheck disable=SC2016
          go test "${go_test_args[@]}" -json "${test_packages[@]}" | node -e '
            let output = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { process.stdout.write(chunk); output += chunk; });
            process.stdin.on("end", () => {
              const events = output.trim().split(/\n/).filter(Boolean).map(JSON.parse);
              const failed = events.filter((event) => event.Action === "fail");
              const skipped = events.filter((event) => event.Action === "skip");
              if (failed.length || skipped.length) {
                console.error(`Go FAIL ${failed.length} SKIP ${skipped.length}; Go SKIP result missing or nonzero`);
                process.exit(1);
              }
            });
          '

      - name: Test Ledger
        working-directory: services/ledger
        env:
          GO_TEST_ARGS: "-count=1"
        run: *go_test

  control_plane:
    name: control-plane
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services: *postgres_service
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
      PGSSLMODE: disable
      OPL_POSTGRES_TESTS: "1"
      OPL_CAPACITY_TESTS: "1"
    steps:
      - *checkout

      - *setup_node

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache-dependency-path: services/control-plane/go.sum

      - name: Test Control Plane
        working-directory: services/control-plane
        env:
          GO_TEST_ARGS: "-timeout=15m -count=1"
        run: *go_test

  fabric:
    name: fabric
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services: *postgres_service
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
      PGSSLMODE: disable
      OPL_POSTGRES_TESTS: "1"
      OPL_FABRIC_LOCAL_DOCKER_INTEGRATION: "1"
    steps:
      - name: Initialize Local qualification directory
        run: |
          set -euo pipefail
          qualification_root="$RUNNER_TEMP/opl-local-first-deploy-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'OPL_QUALIFICATION_ROOT=%s\n' "$qualification_root" >> "$GITHUB_ENV"

      - *checkout

      - *setup_node

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: services/fabric/go.sum

      - name: Load runner project quota support
        run: |
          set -euo pipefail
          kernel_release="$(uname -r)"
          uname -a
          kernel_config="/boot/config-$kernel_release"
          if test -r "$kernel_config"; then
            grep -E '^(CONFIG_QUOTA|CONFIG_QUOTACTL|CONFIG_QFMT|CONFIG_EXT4_FS)' "$kernel_config" || true
          fi
          modinfo -k "$kernel_release" quota_v2 || true
          if ! sudo modprobe -v quota_v2; then
            # A present module that cannot load is a different host error. Only
            # missing modules justify installing the matching Ubuntu package.
            if modinfo -k "$kernel_release" quota_v2; then
              exit 1
            fi
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y "linux-modules-extra-$kernel_release"
            sudo depmod -a "$kernel_release"
            modinfo -k "$kernel_release" quota_v2
            sudo modprobe -v quota_v2
          fi

      - name: Prepare project quota filesystem
        run: |
          set -euo pipefail
          test "$OPL_QUALIFICATION_ROOT" = "$RUNNER_TEMP/opl-local-first-deploy-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$OPL_QUALIFICATION_ROOT"
          # The real Local plan reserves 10 GiB. Keep room for filesystem metadata
          # and the fixture while refusing to overcommit the runner filesystem.
          available_bytes="$(df -B1 --output=avail "$RUNNER_TEMP" | tail -n 1 | tr -d ' ')"
          [[ "$available_bytes" =~ ^[0-9]+$ ]]
          (( available_bytes >= 14 * 1024 * 1024 * 1024 ))
          mkdir -p "$OPL_QUALIFICATION_ROOT"/{storage,tmp,home}
          quota_image="$OPL_QUALIFICATION_ROOT/quota.img"
          truncate -s 12G "$quota_image"
          mkfs.ext4 -F -q -O project,quota -E quotatype=prjquota "$quota_image"
          sudo mount -o loop,prjquota "$quota_image" "$OPL_QUALIFICATION_ROOT/storage"
          sudo chown "$(id -u):$(id -g)" "$OPL_QUALIFICATION_ROOT/storage"

      - name: Compile Local qualification executables without privilege
        run: |
          set -euo pipefail
          go -C services/fabric build -o "$OPL_QUALIFICATION_ROOT/fabric" ./cmd/fabric
          go -C services/serve build -o "$OPL_QUALIFICATION_ROOT/serve" ./cmd/server
          go -C services/fabric test -c -tags=opl_project_quota -o "$OPL_QUALIFICATION_ROOT/project-quota.test" ./internal/fabric
          go -C services/workspace test -c -tags=livebuild -o "$OPL_QUALIFICATION_ROOT/first-deploy.test" ./internal/launch
          "$OPL_QUALIFICATION_ROOT/project-quota.test" -test.list '^TestLinuxLocalDockerProjectQuotaEnforcesHardLimit$' | grep -Fx 'TestLinuxLocalDockerProjectQuotaEnforcesHardLimit'
          "$OPL_QUALIFICATION_ROOT/first-deploy.test" -test.list '^TestLocalFirstApplicationDeploymentQualification$' | grep -Fx 'TestLocalFirstApplicationDeploymentQualification'
          # Pull the immutable application image once as the ordinary runner.
          # The privileged test reuses the daemon's cached digest.
          base_image="$(awk 'toupper($1) == "FROM" { print $2; exit }' deploy/portable/qualification-workspace.Dockerfile)"
          [[ "$base_image" =~ @sha256:[a-f0-9]{64}$ ]]
          docker pull "$base_image"

      - name: Test Fabric
        working-directory: services/fabric
        env:
          GO_TEST_ARGS: "-count=1"
        run: *go_test

      - name: Test Linux project quota as privileged capability
        working-directory: services/fabric
        run: |
          set -euo pipefail
          sudo env -i PATH="$PATH" HOME="$OPL_QUALIFICATION_ROOT/home" TMPDIR="$OPL_QUALIFICATION_ROOT/tmp" \
            OPL_TEST_PROJECT_QUOTA_ROOT="$OPL_QUALIFICATION_ROOT/storage" \
            "$OPL_QUALIFICATION_ROOT/project-quota.test" \
            -test.run '^TestLinuxLocalDockerProjectQuotaEnforcesHardLimit$' -test.count=1 -test.timeout=2m -test.v

      - name: Test first Local application deployment with real owners
        working-directory: services/workspace
        run: |
          set -euo pipefail
          sudo env -i PATH="$PATH" HOME="$OPL_QUALIFICATION_ROOT/home" TMPDIR="$OPL_QUALIFICATION_ROOT/tmp" \
            OPL_TEST_PROJECT_QUOTA_ROOT="$OPL_QUALIFICATION_ROOT/storage" \
            OPL_OWNER_MIGRATION_TEST_ADMIN_DSN="postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable" \
            OPL_POSTGRES_TESTS=1 OPL_LOCAL_FIRST_DEPLOY_QUALIFICATION=1 PGSSLMODE=disable \
            OPL_QUALIFICATION_FABRIC_BINARY="$OPL_QUALIFICATION_ROOT/fabric" \
            OPL_QUALIFICATION_SERVE_BINARY="$OPL_QUALIFICATION_ROOT/serve" \
            "$OPL_QUALIFICATION_ROOT/first-deploy.test" \
            -test.run '^TestLocalFirstApplicationDeploymentQualification$' -test.count=1 -test.timeout=15m -test.v

      - name: Remove project quota filesystem
        if: ${{ always() }}
        run: |
          set -euo pipefail
          test "$OPL_QUALIFICATION_ROOT" = "$RUNNER_TEMP/opl-local-first-deploy-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -L "$OPL_QUALIFICATION_ROOT"
          if mountpoint -q "$OPL_QUALIFICATION_ROOT/storage"; then
            sudo umount "$OPL_QUALIFICATION_ROOT/storage"
          fi
          if test -d "$OPL_QUALIFICATION_ROOT"; then
            sudo rm -rf --one-file-system -- "$OPL_QUALIFICATION_ROOT"
          fi

  validate:
    name: validate
    if: ${{ always() }}
    needs:
      - node_console
      - go_contracts
      - postgres_ledger
      - control_plane
      - fabric
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful test jobs
        env:
          NODE_CONSOLE_RESULT: ${{ needs.node_console.result }}
          GO_CONTRACTS_RESULT: ${{ needs.go_contracts.result }}
          POSTGRES_LEDGER_RESULT: ${{ needs.postgres_ledger.result }}
          CONTROL_PLANE_RESULT: ${{ needs.control_plane.result }}
          FABRIC_RESULT: ${{ needs.fabric.result }}
        run: |
          if [[ "$NODE_CONSOLE_RESULT" != "success" ||
                "$GO_CONTRACTS_RESULT" != "success" ||
                "$POSTGRES_LEDGER_RESULT" != "success" ||
                "$CONTROL_PLANE_RESULT" != "success" ||
                "$FABRIC_RESULT" != "success" ]]; then
            printf 'node-console=%s\ngo-contracts=%s\npostgres-ledger=%s\ncontrol-plane=%s\nfabric=%s\n' \
              "$NODE_CONSOLE_RESULT" \
              "$GO_CONTRACTS_RESULT" \
              "$POSTGRES_LEDGER_RESULT" \
              "$CONTROL_PLANE_RESULT" \
              "$FABRIC_RESULT"
            exit 1
          fi
