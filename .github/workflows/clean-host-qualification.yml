name: Clean Host Qualification

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact 40-character Product candidate commit.
        required: true
        type: string
      cloud_image_ref:
        description: Exact immutable OPL Cloud image reference.
        required: true
        type: string
      workspace_image_ref:
        description: Exact immutable Workspace image reference; empty builds only the existing qualification fixture.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: clean-host-qualification-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  clean_host_qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare immutable qualification Workspace image
        id: workspace
        shell: bash
        env:
          SUPPLIED_WORKSPACE_IMAGE: ${{ inputs.workspace_image_ref }}
          PRODUCT_SHA: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ -n "$SUPPLIED_WORKSPACE_IMAGE" ]; then
            [[ "$SUPPLIED_WORKSPACE_IMAGE" =~ ^[a-z0-9.-]+(:[1-9][0-9]*)?/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
            printf 'image_ref=%s\n' "$SUPPLIED_WORKSPACE_IMAGE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Build only the existing fixture. The supplied Cloud Candidate is
          # still pulled and qualified by digest, without a source rebuild.
          registry="opl-qualification-workspace-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'registry=%s\n' "$registry" >> "$GITHUB_OUTPUT"
          docker run -d --name "$registry" -p 127.0.0.1::5000 \
            registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "5000/tcp") 0).HostPort}}' "$registry")"
          [[ "$port" =~ ^[1-9][0-9]*$ ]]
          repository="127.0.0.1:$port/opl-qualification-workspace"
          tag="$repository:fixture"
          printf 'image_tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          docker build --file deploy/portable/qualification-workspace.Dockerfile \
            --label "org.opencontainers.image.revision=$PRODUCT_SHA" --tag "$tag" .
          docker push "$tag"
          image="$(docker image inspect --format '{{index .RepoDigests 0}}' "$tag")"
          [[ "$image" == "$repository@sha256:"* ]]
          [[ "${image##*@}" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker pull "$image"
          printf 'image_ref=%s\n' "$image" >> "$GITHUB_OUTPUT"

      # The qualification binds this host's installation facts before Docker
      # starts: the quota-enabled Workspace storage root and the provider
      # profile describing the packages this host can host. GitHub's hosted
      # runner has neither, so this entry prepares them on the runner instead
      # of inventing them inside the qualification.
      - name: Prepare the Local-Docker storage root
        id: storage
        shell: bash
        run: |
          set -euo pipefail
          kernel_release="$(uname -r)"
          if ! sudo modprobe -v quota_v2; then
            if modinfo -k "$kernel_release" quota_v2; then
              exit 1
            fi
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y "linux-modules-extra-$kernel_release"
            sudo depmod -a "$kernel_release"
            modinfo -k "$kernel_release" quota_v2
            sudo modprobe -v quota_v2
          fi
          qualification_root="/tmp/opl-clean-host-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$qualification_root"
          available_bytes="$(df -B1 --output=avail /tmp | tail -n 1 | tr -d ' ')"
          [[ "$available_bytes" =~ ^[0-9]+$ ]]
          # Fail explicitly instead of relying on `set -e` to abort on a bare (( )).
          if (( available_bytes < 14 * 1024 * 1024 * 1024 )); then
            echo "insufficient free space for the Local-Docker storage root: ${available_bytes} bytes" >&2
            exit 1
          fi
          mkdir -p "$qualification_root/storage"
          printf 'OPL_QUALIFICATION_ROOT=%s\n' "$qualification_root" >> "$GITHUB_ENV"
          quota_image="$qualification_root/quota.img"
          truncate -s 12G "$quota_image"
          mkfs.ext4 -F -q -O project,quota -E quotatype=prjquota "$quota_image"
          sudo mount -o loop,prjquota "$quota_image" "$qualification_root/storage"
          sudo chown "$(id -u):$(id -g)" "$qualification_root/storage"
          printf 'storage_root=%s\n' "$qualification_root/storage" >> "$GITHUB_OUTPUT"

      - name: Run local Workspace qualification
        shell: bash
        env:
          PRODUCT_SHA: ${{ inputs.ref }}
          CLOUD_IMAGE_REF: ${{ inputs.cloud_image_ref }}
          WORKSPACE_IMAGE_REF: ${{ steps.workspace.outputs.image_ref }}
          OPL_FABRIC_LOCAL_DOCKER_STORAGE_ROOT: ${{ steps.storage.outputs.storage_root }}
          OPL_FABRIC_LOCAL_DOCKER_PROVIDER_PROFILE_JSON: '{"schemaVersion":1,"packages":[{"id":"basic","name":"Basic Workspace","available":true,"compute":{"id":"local-basic","server":"configured","cpu":2,"memoryGb":4,"instanceType":"local-basic"},"storage":{"sizeGb":10,"quotaPolicy":"linux-project"}}]}'
        run: |
          set -euo pipefail
          npm run qualify:local:workspace -- \
            --source-sha "$PRODUCT_SHA" \
            --cloud-image "$CLOUD_IMAGE_REF" \
            --workspace-image "$WORKSPACE_IMAGE_REF" \
            --authority-mode fixture \
            --receipt "$RUNNER_TEMP/local-workspace-qualification.json"

      - name: Upload local qualification receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: local-workspace-qualification
          path: ${{ runner.temp }}/local-workspace-qualification.json
          if-no-files-found: error

      - name: Remove the Local-Docker storage root
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          qualification_root="${OPL_QUALIFICATION_ROOT:-}"
          # An earlier step may have failed before the root was created; cleanup
          # succeeds without work in that case.
          [ -n "$qualification_root" ] || exit 0
          test "$qualification_root" = "/tmp/opl-clean-host-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -L "$qualification_root"
          if mountpoint -q "$qualification_root/storage"; then
            sudo umount "$qualification_root/storage"
          fi
          if test -d "$qualification_root"; then
            sudo rm -rf --one-file-system -- "$qualification_root"
          fi

      - name: Remove run-owned Workspace fixture registry
        if: ${{ always() && steps.workspace.outputs.registry != '' }}
        shell: bash
        env:
          REGISTRY: ${{ steps.workspace.outputs.registry }}
          IMAGE_TAG: ${{ steps.workspace.outputs.image_tag }}
        run: |
          set -euo pipefail
          test "$REGISTRY" = "opl-qualification-workspace-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if docker container inspect "$REGISTRY" >/dev/null 2>&1; then
            docker rm --force "$REGISTRY"
          fi
          if [ -n "$IMAGE_TAG" ] && docker image inspect "$IMAGE_TAG" >/dev/null 2>&1; then
            docker image rm "$IMAGE_TAG"
          fi
