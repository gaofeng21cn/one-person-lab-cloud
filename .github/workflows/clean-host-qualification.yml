name: Clean Host Qualification
run-name: Cloud local qualification ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact 40-character Product candidate commit.
        required: true
        type: string
      cloud_image_ref:
        description: Exact immutable OPL Cloud image reference.
        required: true
        type: string
      workspace_image_ref:
        description: Exact immutable Workspace image reference; empty builds only the existing qualification fixture.
        required: false
        type: string
      mode:
        description: Native Local-Docker qualification using the declared local-v2 topology.
        required: false
        default: local-v2
        type: choice
        options:
          - local-v2
      customer_package_dir:
        description: Directory of the customer package to upload, relative to the checkout; empty qualifies the repository fixture.
        required: false
        type: string
      customer_package_url:
        description: HTTPS URL of a customer package archive to qualify; empty qualifies the repository fixture.
        required: false
        type: string
      customer_probe_path:
        description: Path of the probe file inside the customer package that carries the run nonce.
        required: false
        default: agent/provenance/probe.txt
        type: string
      customer_evidence_level:
        description: Evidence level this run has to reach for the customer package.
        required: false
        default: content-provenance
        type: choice
        options:
          - content-provenance
          - artifact-identity

permissions:
  contents: read

concurrency:
  group: clean-host-qualification-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  clean_host_qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare immutable qualification Build artifacts
        id: workspace
        shell: bash
        env:
          SUPPLIED_WORKSPACE_IMAGE: ${{ inputs.workspace_image_ref }}
          PRODUCT_SHA: ${{ inputs.ref }}
        run: bash tests/tools/fixtures/clean-host-build.sh prepare

      # The qualification binds this host's installation facts before Docker
      # starts: the quota-enabled Workspace storage root and the provider
      # profile describing the packages this host can host. GitHub's hosted
      # runner has neither, so this entry prepares them on the runner instead
      # of inventing them inside the qualification.
      - name: Prepare the Local-Docker storage root
        id: storage
        shell: bash
        run: |
          set -euo pipefail
          kernel_release="$(uname -r)"
          if ! sudo modprobe -v quota_v2; then
            if modinfo -k "$kernel_release" quota_v2; then
              exit 1
            fi
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y "linux-modules-extra-$kernel_release"
            sudo depmod -a "$kernel_release"
            modinfo -k "$kernel_release" quota_v2
            sudo modprobe -v quota_v2
          fi
          qualification_root="/tmp/opl-clean-host-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$qualification_root"
          available_bytes="$(df -B1 --output=avail /tmp | tail -n 1 | tr -d ' ')"
          [[ "$available_bytes" =~ ^[0-9]+$ ]]
          # Fail explicitly instead of relying on `set -e` to abort on a bare (( )).
          if (( available_bytes < 14 * 1024 * 1024 * 1024 )); then
            echo "insufficient free space for the Local-Docker storage root: ${available_bytes} bytes" >&2
            exit 1
          fi
          mkdir -p "$qualification_root/storage"
          printf 'OPL_QUALIFICATION_ROOT=%s\n' "$qualification_root" >> "$GITHUB_ENV"
          quota_image="$qualification_root/quota.img"
          truncate -s 12G "$quota_image"
          mkfs.ext4 -F -q -O project,quota -E quotatype=prjquota "$quota_image"
          sudo mount -o loop,prjquota "$quota_image" "$qualification_root/storage"
          sudo chown "$(id -u):$(id -g)" "$qualification_root/storage"
          printf 'storage_root=%s\n' "$qualification_root/storage" >> "$GITHUB_OUTPUT"

      - name: Prepare the customer package to qualify
        id: customer
        shell: bash
        env:
          CUSTOMER_PACKAGE_DIR: ${{ inputs.customer_package_dir }}
          CUSTOMER_PACKAGE_URL: ${{ inputs.customer_package_url }}
          CUSTOMER_PROBE_PATH: ${{ inputs.customer_probe_path }}
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/customer-package"
          rm -rf -- "$package_root"
          mkdir -p "$package_root"
          if [ -n "$CUSTOMER_PACKAGE_DIR" ]; then
            # A package directory of the checkout. The probe path is the file
            # inside it that carries the run nonce.
            test -d "$CUSTOMER_PACKAGE_DIR"
            printf 'package_dir=%s\n' "$PWD/$CUSTOMER_PACKAGE_DIR" >> "$GITHUB_OUTPUT"
            printf 'probe_path=%s\n' "$CUSTOMER_PROBE_PATH" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$CUSTOMER_PACKAGE_URL" ]; then
            # A package archive. It is unpacked so the run can put its own
            # nonce into the package before the package is uploaded.
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              "$CUSTOMER_PACKAGE_URL" --output "$package_root/package.zip"
            unzip -q "$package_root/package.zip" -d "$package_root/extracted"
            test -d "$package_root/extracted"
            printf 'package_dir=%s\n' "$package_root/extracted" >> "$GITHUB_OUTPUT"
            printf 'probe_path=%s\n' "$CUSTOMER_PROBE_PATH" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The repository fixture is one input of the same shape as any other
          # customer package.
          printf 'package_dir=%s\n' "$PWD/tests/tools/fixtures/customer-agent-package" >> "$GITHUB_OUTPUT"
          printf 'probe_path=%s\n' "$CUSTOMER_PROBE_PATH" >> "$GITHUB_OUTPUT"

      - name: Prepare and exercise the native owner installation
        if: ${{ inputs.mode == 'local-v2' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_SHA: ${{ inputs.ref }}
          CLOUD_IMAGE_REF: ${{ inputs.cloud_image_ref }}
          WORKSPACE_IMAGE_REF: ${{ steps.workspace.outputs.image_ref }}
          STORAGE_ROOT: ${{ steps.storage.outputs.storage_root }}
          INSTALLER_SHA: ${{ github.sha }}
          REGISTRY_HOST: ${{ steps.workspace.outputs.registry_host }}
          RUNTIME_IMAGE: ${{ steps.workspace.outputs.runtime_image }}
          WEBUI_IMAGE: ${{ steps.workspace.outputs.webui_image }}
          FRONTEND_IMAGE: ${{ steps.workspace.outputs.frontend_image }}
          RECIPE_REF: ${{ steps.workspace.outputs.recipe_ref }}
          CUSTOMER_PACKAGE_DIR: ${{ steps.customer.outputs.package_dir }}
          CUSTOMER_PROBE_PATH: ${{ steps.customer.outputs.probe_path }}
          CUSTOMER_EVIDENCE_LEVEL: ${{ inputs.customer_evidence_level }}
        shell: bash
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/native-qualification-installer"
          mkdir -p "$installer/tools"
          # Installer control code is separately bound to the workflow revision;
          # the product checkout and image remain the exact supplied Candidate.
          for file in local-v2-clean-host.ts local-v2-installation-facts.ts; do
            gh api "repos/$GITHUB_REPOSITORY/contents/tools/$file?ref=$INSTALLER_SHA" --jq .content |
              base64 --decode > "$installer/tools/$file"
          done
          directory="$OPL_QUALIFICATION_ROOT/native"
          project="opl-native-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          args=(--product-root "$PWD" --directory "$directory" --project "$project"
            --source-sha "$PRODUCT_SHA" --cloud-image "$CLOUD_IMAGE_REF"
            --workspace-image "$WORKSPACE_IMAGE_REF" --storage-root "$STORAGE_ROOT")
          args+=(--insecure-http-hosts "$REGISTRY_HOST" --build-registry "$REGISTRY_HOST"
            --runtime-image "$RUNTIME_IMAGE" --webui-image "$WEBUI_IMAGE"
            --frontend-image "$FRONTEND_IMAGE" --recipe-ref "$RECIPE_REF")
          node "$installer/tools/local-v2-clean-host.ts" "${args[@]}"
          bash deploy/portable/local-v2-pki.sh "$directory/pki"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            https://agent-plugins.org/schemas/1.0.0/plugin.schema.json --output "$directory/plugin.schema.json"
          expected="$(awk -F= '$1 == "OPL_CAPABILITY_PACKAGE_SCHEMA_DIGEST" { print $2 }' "$directory/installation.env")"
          printf '%s  %s\n' "${expected#sha256:}" "$directory/plugin.schema.json" | sha256sum --check
          printf 'OPL_NATIVE_PROJECT=%s\n' "$project" >> "$GITHUB_ENV"
          native_args=(--mode local-v2 --source-sha "$PRODUCT_SHA" --installation-env "$directory/installation.env"
            --application-contract "$directory/application.json" --project "$project")
          bootstrap="$RUNNER_TEMP/local-v2-bootstrap.json"
          node tools/local-workspace-qualification.ts "${native_args[@]}" --receipt "$bootstrap" || true
          # The first run obtains the Tenant from its real owner before this
          # installation may bind Fabric to it. No purchase precedes that bind.
          if ! node "$installer/tools/local-v2-clean-host.ts" "${args[@]}" --bind-from "$bootstrap"; then
            cp "$bootstrap" "$RUNNER_TEMP/local-workspace-qualification.json"
            exit 1
          fi
          bash tests/tools/fixtures/clean-host-build.sh attach "$project" "$directory/installation.env" "$REGISTRY_HOST"
          # The customer package chain runs on the qualified installation: the
          # package the operator named is uploaded, built explicitly, and the
          # Workspace that runs that exact version has to answer with the nonce
          # this run put into the package.
          node tools/local-workspace-qualification.ts "${native_args[@]}" \
            --build-catalog "$directory/build-catalog.json" \
            --customer-package-dir "$CUSTOMER_PACKAGE_DIR" \
            --customer-probe-path "$CUSTOMER_PROBE_PATH" \
            --customer-expected-evidence-level "$CUSTOMER_EVIDENCE_LEVEL" \
            --receipt "$RUNNER_TEMP/local-workspace-qualification.json"

      - name: Upload local qualification receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: local-workspace-qualification
          path: ${{ runner.temp }}/local-workspace-qualification.json
          if-no-files-found: error

      - name: Preserve the separate native Tenant bootstrap attempt
        if: ${{ always() && inputs.mode == 'local-v2' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: local-v2-tenant-bootstrap
          path: ${{ runner.temp }}/local-v2-bootstrap.json
          if-no-files-found: ignore

      - name: Preserve native owner and lifecycle readbacks
        if: ${{ always() && inputs.mode == 'local-v2' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: local-v2-native-evidence
          path: ${{ runner.temp }}/local-workspace-qualification.json.diagnostic.json
          if-no-files-found: ignore

      - name: Remove the Local-Docker storage root
        if: ${{ always() }}
        env:
          PRODUCT_SHA: ${{ inputs.ref }}
          CLOUD_IMAGE_REF: ${{ inputs.cloud_image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          qualification_root="${OPL_QUALIFICATION_ROOT:-}"
          # An earlier step may have failed before the root was created; cleanup
          # succeeds without work in that case.
          [ -n "$qualification_root" ] || exit 0
          test "$qualification_root" = "/tmp/opl-clean-host-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -L "$qualification_root"
          cleanup_failed=0
          if [ -n "${OPL_NATIVE_PROJECT:-}" ]; then
            test "$OPL_NATIVE_PROJECT" = "opl-native-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            bash tests/tools/fixtures/clean-host-build.sh detach "$OPL_NATIVE_PROJECT" || cleanup_failed=1
            docker compose --project-name "$OPL_NATIVE_PROJECT" \
              --env-file "$qualification_root/native/installation.env" \
              -f deploy/portable/compose.local-v2.yaml down --volumes --remove-orphans || cleanup_failed=1
            if [ -f "$RUNNER_TEMP/local-workspace-qualification.json" ]; then
              cleanup_receipt="$RUNNER_TEMP/local-workspace-qualification.json"
              if [ -f "$cleanup_receipt.diagnostic.json" ]; then
                cleanup_receipt="$cleanup_receipt.diagnostic.json"
              fi
              node "$RUNNER_TEMP/native-qualification-installer/tools/local-v2-clean-host.ts" \
                --product-root "$PWD" --directory "$qualification_root/native" --project "$OPL_NATIVE_PROJECT" \
                --source-sha "$PRODUCT_SHA" --cloud-image "$CLOUD_IMAGE_REF" \
                --cleanup-from "$cleanup_receipt" || cleanup_failed=1
            fi
          fi
          if mountpoint -q "$qualification_root/storage"; then
            sudo umount "$qualification_root/storage"
          fi
          if test -d "$qualification_root"; then
            sudo rm -rf --one-file-system -- "$qualification_root"
          fi
          exit "$cleanup_failed"

      - name: Remove run-owned Build artifacts and services
        if: ${{ always() && steps.workspace.outputs.registry != '' }}
        shell: bash
        env:
          REGISTRY_HOST: ${{ steps.workspace.outputs.registry_host }}
        run: bash tests/tools/fixtures/clean-host-build.sh cleanup "$REGISTRY_HOST"
