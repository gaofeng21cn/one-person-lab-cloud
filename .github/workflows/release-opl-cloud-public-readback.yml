name: Read Back OPL Cloud Release

on:
  workflow_run:
    workflows:
      - Release OPL Cloud
    types: [completed]
  workflow_dispatch:
    inputs:
      publication_run_id:
        description: Completed successful Release OPL Cloud run to verify again.
        required: true
        type: string

permissions:
  contents: read

jobs:
  public-readback:
    name: Read back public release independently
    if: >-
      ${{
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
          github.actor == github.triggering_actor &&
          (github.actor == github.repository_owner || github.actor == 'RenDeHuang'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    env:
      PRODUCT_REPOSITORY: ${{ github.repository }}
      EVENT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
      MANUAL_RUN_ID: ${{ inputs.publication_run_id || '' }}
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}

    steps:
      - name: Resolve completed publication run and sealed artifact
        id: authority
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$EVENT_RUN_ID"
          if [ -z "$run_id" ]; then
            run_id="$MANUAL_RUN_ID"
          fi
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          run_json="$(gh api "repos/$PRODUCT_REPOSITORY/actions/runs/$run_id")"
          jq -e \
            --arg repository "$PRODUCT_REPOSITORY" \
            --arg run_id "$run_id" \
            '(.id | tostring) == $run_id and
             .repository.full_name == $repository and
             .path == ".github/workflows/release-opl-cloud-image.yml" and
             .event == "workflow_dispatch" and .head_branch == "main" and
             .status == "completed" and .conclusion == "success" and
             (.head_sha | test("^[0-9a-f]{40}$"))' \
            <<< "$run_json" >/dev/null

          workflow_sha="$(jq -r .head_sha <<< "$run_json")"
          workflow_ref="refs/heads/$(jq -r .head_branch <<< "$run_json")"
          artifacts_json="$(gh api "repos/$PRODUCT_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")"
          artifact_name="$(jq -r \
            --arg prefix "opl-cloud-publication-admission-" \
            --arg run_id "$run_id" \
            '[.artifacts[] | select(.name | startswith($prefix)) |
              select(.expired == false and (.workflow_run.id | tostring) == $run_id)] |
              if length == 1 then .[0].name else empty end' \
            <<< "$artifacts_json")"
          if [[ "$artifact_name" =~ ^opl-cloud-publication-admission-([0-9a-f]{40})-[1-9][0-9]*$ ]]; then
            product_sha="${BASH_REMATCH[1]}"
          else
            exit 1
          fi
          {
            echo "run_id=$run_id"
            echo "artifact_name=$artifact_name"
            echo "product_sha=$product_sha"
            echo "workflow_sha=$workflow_sha"
            echo "workflow_ref=$workflow_ref"
          } >> "$GITHUB_OUTPUT"

      - name: Download sealed publication checkpoint
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.authority.outputs.artifact_name }}
          path: artifacts/publication
          github-token: ${{ github.token }}
          run-id: ${{ steps.authority.outputs.run_id }}

      - name: Validate publication identity and provenance
        env:
          PRODUCT_SHA: ${{ steps.authority.outputs.product_sha }}
          PUBLICATION_WORKFLOW_SHA: ${{ steps.authority.outputs.workflow_sha }}
          PUBLICATION_WORKFLOW_REF: ${{ steps.authority.outputs.workflow_ref }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="artifacts/publication/release/opl-cloud-release.json"
          provenance="artifacts/publication/release-provenance.json"
          test -s "$manifest"
          test -s "$provenance"
          jq -e \
            --arg repository "$PRODUCT_REPOSITORY" \
            --arg product_sha "$PRODUCT_SHA" \
            --arg workflow_sha "$PUBLICATION_WORKFLOW_SHA" \
            --arg workflow_ref "$PUBLICATION_WORKFLOW_REF" \
            '.schemaVersion == 2 and .productRepository == $repository and
             .source.sha == $product_sha' "$manifest" >/dev/null
          jq -e \
            --arg repository "$PRODUCT_REPOSITORY" \
            --arg workflow_sha "$PUBLICATION_WORKFLOW_SHA" \
            --arg workflow_ref "$PUBLICATION_WORKFLOW_REF" \
            '.schemaVersion == 2 and .productRepository == $repository and
             .workflowSha == $workflow_sha and .workflowRef == $workflow_ref' \
            "$provenance" >/dev/null
          release_tag="$(jq -r .releaseTag "$manifest")"
          image_digest="$(jq -r .candidate.image.digest "$manifest")"
          [[ "$release_tag" =~ ^v0\.[0-9]+\.[0-9]+$ ]]
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "RELEASE_TAG=$release_tag"
            echo "EXPECTED_IMAGE_DIGEST=$image_digest"
            echo "PUBLICATION_WORKFLOW_SHA=$PUBLICATION_WORKFLOW_SHA"
            echo "PUBLICATION_WORKFLOW_REF=$PUBLICATION_WORKFLOW_REF"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Read back GHCR without publication credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker buildx imagetools inspect "$IMAGE_REPOSITORY:$RELEASE_TAG" --format '{{.Manifest.Digest}}')" = "$EXPECTED_IMAGE_DIGEST"

      - name: Read back public GitHub Release bytes anonymously
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$PRODUCT_REPOSITORY"
          curl -fsSL -H 'Accept: application/vnd.github+json' "$api/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/public-release.json"
          curl -fsSL -H 'Accept: application/vnd.github+json' "$api/commits/$RELEASE_TAG" > "$RUNNER_TEMP/public-tag-commit.json"
          test "$(jq -r .sha "$RUNNER_TEMP/public-tag-commit.json")" = "$(jq -r .source.sha artifacts/publication/release/opl-cloud-release.json)"
          expected_names="$(printf '%s\n' \
            SHA256SUMS \
            compose.deployment-customer-owned.yaml \
            compose.deployment-managed-tke.yaml \
            compose.deployment-platform-owned.yaml \
            compose.fabric-local-docker.yaml \
            compose.fabric-tencent-tke.yaml \
            compose.local-workspace.yaml \
            compose.yaml \
            opl-cloud-release.json \
            opl-cloud.env.example | sort -u)"
          actual_names="$(jq -r '.assets[].name' "$RUNNER_TEMP/public-release.json" | sort)"
          test "$(jq -r .tag_name "$RUNNER_TEMP/public-release.json")" = "$RELEASE_TAG"
          test "$(jq -r .draft "$RUNNER_TEMP/public-release.json")" = false
          test "$actual_names" = "$expected_names"
          mkdir -p artifacts/public-readback
          while IFS= read -r name; do
            url="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .browser_download_url' "$RUNNER_TEMP/public-release.json")"
            test -n "$url"
            curl -fsSL "$url" -o "artifacts/public-readback/$name"
          done <<< "$expected_names"
          (cd artifacts/public-readback && sha256sum --check --strict SHA256SUMS)
          cmp artifacts/public-readback/opl-cloud-release.json artifacts/publication/release/opl-cloud-release.json

      - name: Verify public asset attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          predicate_type="https://github.com/gaofeng21cn/one-person-lab-cloud/attestations/opl-cloud-release/v1"
          provenance="artifacts/publication/release-provenance.json"
          for asset in artifacts/public-readback/*; do
            verification="$(gh attestation verify "$asset" \
              --repo "$PRODUCT_REPOSITORY" \
              --signer-workflow "$PRODUCT_REPOSITORY/.github/workflows/release-opl-cloud-image.yml" \
              --source-digest "$PUBLICATION_WORKFLOW_SHA" \
              --source-ref "$PUBLICATION_WORKFLOW_REF" \
              --predicate-type "$predicate_type" \
              --deny-self-hosted-runners \
              --format json)"
            jq -e --slurpfile expected "$provenance" '
              map(select(.verificationResult.statement.predicate == $expected[0])) | length >= 1
            ' <<< "$verification" >/dev/null
          done
          printf 'Published and publicly read back %s at %s\n' "$IMAGE_REPOSITORY@$EXPECTED_IMAGE_DIGEST" "$RELEASE_TAG"
