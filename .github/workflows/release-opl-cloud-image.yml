name: Release OPL Cloud
on:
  workflow_dispatch:
    inputs:
      version:
        description: v0.x.y release tag; publication retries reuse this tag.
        required: true
        type: string
      ref:
        description: Exact 40-character product commit already merged into main.
        required: true
        type: string
      candidate_run_id:
        description: Successful Build OPL Cloud Candidate run for this product commit.
        required: true
        type: string
      local_qualification_run_id:
        description: Successful Clean Host Qualification run for the same Candidate digest.
        required: true
        type: string
      instance_deployment_verification_run_id:
        description: Successful Instance installation identity and health verification for this Candidate.
        required: true
        type: string
      source_verification_run_id:
        description: Successful complete Pull Request CI run for the exact frozen Product SHA.
        required: true
        type: string
permissions:
  contents: read
jobs:
  admission:
    name: Admit qualified Candidate bytes
    environment: cloud-release
    if: ${{ github.ref == 'refs/heads/main' && github.actor == github.triggering_actor && (github.actor == github.repository_owner || github.actor == 'RenDeHuang') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      artifact_id: ${{ steps.publication_artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.publication_artifact.outputs.artifact-digest }}
      artifact_name: ${{ steps.release_bundle.outputs.artifact_name }}
      candidate_receipt_digest: ${{ steps.candidate.outputs.candidate_receipt_digest }}
      image_digest: ${{ steps.candidate.outputs.image_digest }}
      installation_receipt_digest: ${{ steps.installation.outputs.receipt_digest }}
      installation_run_digest: ${{ steps.installation.outputs.run_digest }}
      product_tree: ${{ steps.candidate.outputs.product_tree }}
      source_paths_digest: ${{ steps.source_paths.outputs.receipt_digest }}
    env:
      PRODUCT_REPOSITORY: ${{ github.repository }}
      PRODUCT_SHA: ${{ inputs.ref }}
      RELEASE_TAG: ${{ inputs.version }}
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
      INSTANCE_REPOSITORY: gaofeng21cn/opl-instance-medopl
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      LOCAL_QUALIFICATION_RUN_ID: ${{ inputs.local_qualification_run_id }}
      INSTANCE_DEPLOYMENT_RUN_ID: ${{ inputs.instance_deployment_verification_run_id }}
      SOURCE_VERIFICATION_RUN_ID: ${{ inputs.source_verification_run_id }}
    steps:
      - name: Require exact publication inputs and private evidence reader
        env:
          INSTANCE_EVIDENCE_TOKEN: ${{ secrets.OPL_GITHUB_RELEASE_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v0\.[0-9]+\.[0-9]+$ ]]
          [[ "$PRODUCT_SHA" =~ ^[0-9a-f]{40}$ ]]
          for run_id in "$CANDIDATE_RUN_ID" "$LOCAL_QUALIFICATION_RUN_ID" "$INSTANCE_DEPLOYMENT_RUN_ID" "$SOURCE_VERIFICATION_RUN_ID"; do
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          done
          test -n "$INSTANCE_EVIDENCE_TOKEN"
      - name: Resolve exact evidence runs and artifacts
        id: evidence
        env:
          CLOUD_TOKEN: ${{ github.token }}
          INSTANCE_TOKEN: ${{ secrets.OPL_GITHUB_RELEASE_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          authority="$RUNNER_TEMP/opl-cloud-release-authority"
          mkdir -p "$authority"
          GH_TOKEN="$CLOUD_TOKEN" gh api "repos/$PRODUCT_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > "$authority/candidate-run.json"
          GH_TOKEN="$CLOUD_TOKEN" gh api "repos/$PRODUCT_REPOSITORY/actions/runs/$LOCAL_QUALIFICATION_RUN_ID" > "$authority/local-run.json"
          GH_TOKEN="$CLOUD_TOKEN" gh api "repos/$PRODUCT_REPOSITORY/actions/runs/$SOURCE_VERIFICATION_RUN_ID" > "$authority/source-run.json"
          GH_TOKEN="$CLOUD_TOKEN" gh api "repos/$PRODUCT_REPOSITORY/actions/runs/$SOURCE_VERIFICATION_RUN_ID/jobs?per_page=100" > "$authority/source-jobs.json"
          GH_TOKEN="$INSTANCE_TOKEN" gh api "repos/$INSTANCE_REPOSITORY/actions/runs/$INSTANCE_DEPLOYMENT_RUN_ID" > "$authority/instance-deployment-run.json"
          validate_run() {
            local file="$1" run_id="$2" repository="$3" workflow="$4"
            jq -e --arg run_id "$run_id" --arg repository "$repository" --arg workflow "$workflow" '
              (.id | tostring) == $run_id and .repository.full_name == $repository and
              .path == $workflow and .event == "workflow_dispatch" and .head_branch == "main" and
              .status == "completed" and .conclusion == "success" and
              (.head_sha | test("^[0-9a-f]{40}$"))
            ' "$file" >/dev/null
          }
          # A Candidate may be built on an admitted integration branch. Bind its exact
          # source here; the later source gate proves reachability from canonical main.
          validate_candidate_run() {
            local file="$1" run_id="$2" repository="$3" workflow="$4"
            jq -e --arg run_id "$run_id" --arg repository "$repository" --arg workflow "$workflow" --arg product_sha "$PRODUCT_SHA" '
              (.id | tostring) == $run_id and .repository.full_name == $repository and
              .path == $workflow and .event == "workflow_dispatch" and
              .status == "completed" and .conclusion == "success" and .head_sha == $product_sha
            ' "$file" >/dev/null
          }
          validate_candidate_run "$authority/candidate-run.json" "$CANDIDATE_RUN_ID" "$PRODUCT_REPOSITORY" ".github/workflows/build-opl-cloud-candidate.yml"
          validate_run "$authority/local-run.json" "$LOCAL_QUALIFICATION_RUN_ID" "$PRODUCT_REPOSITORY" ".github/workflows/clean-host-qualification.yml"
          validate_run "$authority/instance-deployment-run.json" "$INSTANCE_DEPLOYMENT_RUN_ID" "$INSTANCE_REPOSITORY" ".github/workflows/deployment-verify.yml"
          attempt="$(jq -r .run_attempt "$authority/candidate-run.json")"
          [[ "$attempt" =~ ^[1-9][0-9]*$ ]]
          candidate_artifact="opl-cloud-candidate-$PRODUCT_SHA-$attempt"
          GH_TOKEN="$CLOUD_TOKEN" gh api "repos/$PRODUCT_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100" > "$authority/candidate-artifacts.json"
          GH_TOKEN="$CLOUD_TOKEN" gh api "repos/$PRODUCT_REPOSITORY/actions/runs/$LOCAL_QUALIFICATION_RUN_ID/artifacts?per_page=100" > "$authority/local-artifacts.json"
          GH_TOKEN="$INSTANCE_TOKEN" gh api "repos/$INSTANCE_REPOSITORY/actions/runs/$INSTANCE_DEPLOYMENT_RUN_ID/artifacts?per_page=100" > "$authority/deployment-artifacts.json"
          require_artifact() {
            jq -e --arg name "$2" --arg run "$3" '[.artifacts[] | select(.name == $name and .expired == false and (.workflow_run.id | tostring) == $run)] | length == 1' "$1" >/dev/null
          }
          require_artifact "$authority/candidate-artifacts.json" "$candidate_artifact" "$CANDIDATE_RUN_ID"
          require_artifact "$authority/local-artifacts.json" "local-workspace-qualification" "$LOCAL_QUALIFICATION_RUN_ID"
          require_artifact "$authority/deployment-artifacts.json" "opl-cloud-deployment-verification-$INSTANCE_DEPLOYMENT_RUN_ID" "$INSTANCE_DEPLOYMENT_RUN_ID"
          {
            echo "candidate_artifact=$candidate_artifact"
            echo "candidate_run_attempt=$attempt"
            echo "deployment_authority_sha=$(jq -r .head_sha "$authority/instance-deployment-run.json")"
          } >> "$GITHUB_OUTPUT"
          echo "OPL_RELEASE_AUTHORITY=$authority" >> "$GITHUB_ENV"
      - name: Checkout exact release authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: release-authority
      - name: Checkout exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false
          path: product-source
      - name: Checkout exact Instance installation validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: gaofeng21cn/opl-instance-medopl
          ref: ${{ steps.evidence.outputs.deployment_authority_sha }}
          token: ${{ secrets.OPL_GITHUB_RELEASE_ADMIN_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: instance-deployment-authority
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Download exact Candidate bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ steps.evidence.outputs.candidate_artifact }}
          path: evidence/candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Download exact Local qualification
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: local-workspace-qualification
          path: evidence/local
          github-token: ${{ github.token }}
          run-id: ${{ inputs.local_qualification_run_id }}
      - name: Download exact Instance installation verification
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: opl-cloud-deployment-verification-${{ inputs.instance_deployment_verification_run_id }}
          path: evidence/instance-deployment
          github-token: ${{ secrets.OPL_GITHUB_RELEASE_ADMIN_TOKEN }}
          repository: gaofeng21cn/opl-instance-medopl
          run-id: ${{ inputs.instance_deployment_verification_run_id }}
      - name: Validate exact Candidate source and bundle
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product-source rev-parse HEAD)" = "$PRODUCT_SHA"
          # Admitting the Candidate run by source SHA instead of by dispatch branch must
          # not weaken the published-source invariant. The released commit stays bound
          # to canonical main history, so a commit that exists only on an unmerged
          # branch can never be published even when its branch built a valid Candidate.
          git -C product-source fetch --no-tags "https://github.com/$PRODUCT_REPOSITORY.git" main:refs/remotes/promotion-source/main
          if ! git -C product-source merge-base --is-ancestor "$PRODUCT_SHA" refs/remotes/promotion-source/main; then
            echo "Released Product SHA is not an ancestor of canonical main." >&2
            exit 1
          fi
          product_tree="$(git -C product-source rev-parse 'HEAD^{tree}')"
          node --experimental-strip-types product-source/tools/cloud-candidate-receipt.ts validate-bundle --bundle evidence/candidate
          node --experimental-strip-types product-source/tools/cloud-candidate-receipt.ts export-env \
            --receipt evidence/candidate/opl-cloud-candidate.json --github-env "$GITHUB_ENV"
          candidate_receipt_digest="$(node --experimental-strip-types product-source/tools/cloud-candidate-receipt.ts digest --receipt evidence/candidate/opl-cloud-candidate.json)"
          candidate_run_attempt='${{ steps.evidence.outputs.candidate_run_attempt }}'
          jq -e \
            --arg repository "$PRODUCT_REPOSITORY" \
            --arg product_sha "$PRODUCT_SHA" \
            --arg product_tree "$product_tree" \
            --arg workflow_sha "$(jq -r .head_sha "$OPL_RELEASE_AUTHORITY/candidate-run.json")" \
            --arg run_id "$CANDIDATE_RUN_ID" \
            --arg run_attempt "$candidate_run_attempt" '
              .product.repository == $repository and .product.sha == $product_sha and .product.tree == $product_tree and
              .provenance.workflowRepository == $repository and .provenance.workflowSha == $workflow_sha and
              .provenance.workflowRunId == $run_id and .provenance.workflowRunAttempt == $run_attempt
            ' evidence/candidate/opl-cloud-candidate.json >/dev/null
          {
            echo "candidate_receipt_digest=$candidate_receipt_digest"
            echo "product_tree=$product_tree"
            echo "image_ref=$(jq -r .cloudImage.indexRef evidence/candidate/opl-cloud-candidate.json)"
            echo "image_digest=$(jq -r .cloudImage.indexDigest evidence/candidate/opl-cloud-candidate.json)"
            echo "amd64_digest=$(jq -r '.cloudImage.platforms[] | select(.platform == "linux/amd64") | .digest' evidence/candidate/opl-cloud-candidate.json)"
            echo "arm64_digest=$(jq -r '.cloudImage.platforms[] | select(.platform == "linux/arm64") | .digest' evidence/candidate/opl-cloud-candidate.json)"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Read back Candidate index and platform bytes
        env:
          PACKAGES_TOKEN: ${{ github.token }}
          EXPECTED_IMAGE: ${{ steps.candidate.outputs.image_ref }}
          EXPECTED_DIGEST: ${{ steps.candidate.outputs.image_digest }}
          EXPECTED_AMD64: ${{ steps.candidate.outputs.amd64_digest }}
          EXPECTED_ARM64: ${{ steps.candidate.outputs.arm64_digest }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PACKAGES_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          manifest="$(docker buildx imagetools inspect "$EXPECTED_IMAGE" --format '{{json .Manifest}}')"
          test "$(jq -r .digest <<< "$manifest")" = "$EXPECTED_DIGEST"
          jq -e --arg amd64 "$EXPECTED_AMD64" --arg arm64 "$EXPECTED_ARM64" '
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest] == [$amd64]) and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest] == [$arm64]) and
            all(.manifests[];
              (.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64")) or
              (.platform.os == "unknown" and .platform.architecture == "unknown" and
               .annotations["vnd.docker.reference.type"] == "attestation-manifest")
            )
          ' <<< "$manifest" >/dev/null
          for identity in "amd64:$EXPECTED_AMD64" "arm64:$EXPECTED_ARM64"; do
            architecture="${identity%%:*}"
            digest="${identity#*:}"
            image="$(docker buildx imagetools inspect "$IMAGE_REPOSITORY@$digest" --format '{{json .Image}}')"
            jq -e --arg architecture "$architecture" --arg revision "$PRODUCT_SHA" '
              .os == "linux" and .architecture == $architecture and
              .config.Labels["org.opencontainers.image.revision"] == $revision
            ' <<< "$image" >/dev/null
          done
          docker logout ghcr.io >/dev/null 2>&1 || true
      - name: Install locked Product validator dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: product-source
      - name: Validate Local clean-host qualification
        id: local
        env:
          VALIDATOR: ${{ github.workspace }}/product-source/tools/local-workspace-qualification.ts
          RECEIPT: ${{ github.workspace }}/evidence/local/local-workspace-qualification.json
          EXPECTED_TREE: ${{ steps.candidate.outputs.product_tree }}
          EXPECTED_IMAGE: ${{ steps.candidate.outputs.image_ref }}
          EXPECTED_DIGEST: ${{ steps.candidate.outputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(find evidence/local -type f | wc -l | tr -d ' ')" = 1
          node --experimental-strip-types --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { pathToFileURL } from "node:url";
          const { validateLocalQualificationReceipt } = await import(pathToFileURL(process.env.VALIDATOR));
          const receipt = validateLocalQualificationReceipt(JSON.parse(await readFile(process.env.RECEIPT, "utf8")));
          if (receipt.source.sha !== process.env.PRODUCT_SHA || receipt.source.tree !== process.env.EXPECTED_TREE ||
              receipt.images.cloud.input !== process.env.EXPECTED_IMAGE || receipt.images.cloud.repoDigest !== process.env.EXPECTED_IMAGE ||
              receipt.images.cloud.digest !== process.env.EXPECTED_DIGEST || receipt.qualification.authorityMode !== "fixture") {
            throw new Error("local_qualification_candidate_binding_invalid");
          }
          NODE
          echo "local_receipt_digest=sha256:$(sha256sum "$RECEIPT" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Validate independent Instance installation evidence
        id: installation
        env:
          DEPLOYMENT_RECEIPT: ${{ github.workspace }}/evidence/instance-deployment/evidence.json
          DEPLOYMENT_AUTHORITY: ${{ github.workspace }}/instance-deployment-authority
          EXPECTED_DEPLOYMENT_SHA: ${{ steps.evidence.outputs.deployment_authority_sha }}
          CANDIDATE: ${{ github.workspace }}/evidence/candidate/opl-cloud-candidate.json
          VALIDATOR: ${{ github.workspace }}/release-authority/tools/cloud-release-installation.ts
        shell: bash
        run: |
          set -euo pipefail
          test "$(find evidence/instance-deployment -type f | wc -l | tr -d ' ')" = 1
          test "$(git -C "$DEPLOYMENT_AUTHORITY" rev-parse HEAD)" = "$EXPECTED_DEPLOYMENT_SHA"
          node "$DEPLOYMENT_AUTHORITY/tools/deployment-verification-receipt.mjs" validate --receipt "$DEPLOYMENT_RECEIPT"

          node --input-type=module <<'NODE'
          import { readFile, appendFile } from 'node:fs/promises';
          import { pathToFileURL } from 'node:url';
          const { validateReleaseInstallationReadback } = await import(pathToFileURL(process.env.VALIDATOR));
          const read = async path => JSON.parse(await readFile(path, 'utf8'));
          const deploymentText = await readFile(process.env.DEPLOYMENT_RECEIPT, 'utf8');
          const result = validateReleaseInstallationReadback({
            candidate: await read(process.env.CANDIDATE), deployment: JSON.parse(deploymentText), deploymentText,
            deploymentRun: await read(process.env.OPL_RELEASE_AUTHORITY + '/instance-deployment-run.json'),
            deploymentRunId: process.env.INSTANCE_DEPLOYMENT_RUN_ID,
          });
          await appendFile(process.env.GITHUB_OUTPUT, 'receipt_digest=' + result.receiptDigest + '\nrun_digest=' + result.runDigest + '\n');
          NODE
      - name: Verify exact-source business entry paths and completed CI
        id: source_paths
        env:
          CANDIDATE: ${{ github.workspace }}/evidence/candidate/opl-cloud-candidate.json
          PRODUCT_ROOT: ${{ github.workspace }}/product-source
          VALIDATOR: ${{ github.workspace }}/release-authority/tools/cloud-release-source-paths.ts
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile, appendFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { pathToFileURL } from 'node:url';
          const { verifyReleaseSourcePaths } = await import(pathToFileURL(process.env.VALIDATOR));
          const read = async path => JSON.parse(await readFile(path, 'utf8'));
          const result = await verifyReleaseSourcePaths({candidate: await read(process.env.CANDIDATE), productRoot: process.env.PRODUCT_ROOT,
            run: await read(process.env.OPL_RELEASE_AUTHORITY + '/source-run.json'), jobs: await read(process.env.OPL_RELEASE_AUTHORITY + '/source-jobs.json')});
          const text = JSON.stringify(result) + '\n';
          await writeFile('evidence/source-paths.json', text);
          await appendFile(process.env.GITHUB_OUTPUT, 'receipt_digest=sha256:' + createHash('sha256').update(text).digest('hex') + '\n');
          NODE
      - name: Seal release bundle from admitted Candidate bytes
        id: release_bundle
        env:
          PRODUCT_TREE: ${{ steps.candidate.outputs.product_tree }}
          CANDIDATE_RUN_ATTEMPT: ${{ steps.evidence.outputs.candidate_run_attempt }}
          CANDIDATE_RECEIPT_DIGEST: ${{ steps.candidate.outputs.candidate_receipt_digest }}
          IMAGE_REF: ${{ steps.candidate.outputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.candidate.outputs.image_digest }}
          AMD64_DIGEST: ${{ steps.candidate.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.candidate.outputs.arm64_digest }}
          LOCAL_RECEIPT_DIGEST: ${{ steps.local.outputs.local_receipt_digest }}
          DEPLOYMENT_RECEIPT_DIGEST: ${{ steps.installation.outputs.receipt_digest }}
          DEPLOYMENT_RUN_DIGEST: ${{ steps.installation.outputs.run_digest }}
          DEPLOYMENT_AUTHORITY_SHA: ${{ steps.evidence.outputs.deployment_authority_sha }}
          SOURCE_PATHS_DIGEST: ${{ steps.source_paths.outputs.receipt_digest }}
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/publication"
          release="$root/release"
          mkdir -p "$release"
          for asset in compose.yaml compose.deployment-platform-owned.yaml compose.deployment-managed-tke.yaml compose.deployment-customer-owned.yaml compose.fabric-local-docker.yaml compose.fabric-tencent-tke.yaml compose.local-workspace.yaml opl-cloud.env.example; do
            cp "evidence/candidate/$asset" "$release/$asset"
          done
          jq -n --slurpfile candidate evidence/candidate/opl-cloud-candidate.json --slurpfile sourcePaths evidence/source-paths.json \
            --arg tag "$RELEASE_TAG" --arg candidateRun "$CANDIDATE_RUN_ID" --arg candidateDigest "$CANDIDATE_RECEIPT_DIGEST" \
            --arg localRun "$LOCAL_QUALIFICATION_RUN_ID" --arg localDigest "$LOCAL_RECEIPT_DIGEST" \
            --arg deploymentRun "$INSTANCE_DEPLOYMENT_RUN_ID" --arg deploymentDigest "$DEPLOYMENT_RECEIPT_DIGEST" \
            --arg deploymentRunDigest "$DEPLOYMENT_RUN_DIGEST" --arg deploymentAuthority "$DEPLOYMENT_AUTHORITY_SHA" \
            --arg sourceDigest "$SOURCE_PATHS_DIGEST" '
            $candidate[0] as $c | {
              schemaVersion:4, product:"OPL Cloud", productRepository:$c.product.repository, releaseTag:$tag,
              source:{sha:$c.product.sha,tree:$c.product.tree}, acceptance:"installation_and_source_paths",
              candidate:{workflowRunId:$candidateRun,workflowRunAttempt:$c.provenance.workflowRunAttempt,receiptDigest:$candidateDigest,
                image:{ref:$c.cloudImage.indexRef,digest:$c.cloudImage.indexDigest,platforms:$c.cloudImage.platforms}},
              installation:{repository:"gaofeng21cn/opl-instance-medopl",workflowRunId:$deploymentRun,runDigest:$deploymentRunDigest,
                receiptDigest:$deploymentDigest,authoritySha:$deploymentAuthority,status:"deployment_verified"},
              qualifications:{local:{repository:$c.product.repository,workflowRunId:$localRun,receiptDigest:$localDigest},
                sourcePaths:($sourcePaths[0]+{receiptDigest:$sourceDigest})},
              assets:["compose.yaml","compose.deployment-platform-owned.yaml","compose.deployment-managed-tke.yaml","compose.deployment-customer-owned.yaml",
                "compose.fabric-local-docker.yaml","compose.fabric-tencent-tke.yaml","compose.local-workspace.yaml","opl-cloud.env.example","SHA256SUMS"]
            }' > "$release/opl-cloud-release.json"
          (cd "$release" && sha256sum compose.yaml compose.deployment-platform-owned.yaml compose.deployment-managed-tke.yaml compose.deployment-customer-owned.yaml compose.fabric-local-docker.yaml compose.fabric-tencent-tke.yaml compose.local-workspace.yaml opl-cloud.env.example opl-cloud-release.json > SHA256SUMS && sha256sum --check --strict SHA256SUMS)
          release_manifest_digest="sha256:$(sha256sum "$release/opl-cloud-release.json" | cut -d ' ' -f1)"
          jq -n --slurpfile manifest "$release/opl-cloud-release.json" --arg workflowSha "$GITHUB_SHA" --arg workflowRef "$GITHUB_REF" \
            --arg manifestDigest "$release_manifest_digest" '
            $manifest[0] as $m | {schemaVersion:4,productRepository:$m.productRepository,workflowSha:$workflowSha,workflowRef:$workflowRef,
              releaseTag:$m.releaseTag,releaseManifestDigest:$manifestDigest,candidateReceiptDigest:$m.candidate.receiptDigest,imageDigest:$m.candidate.image.digest,
              acceptance:$m.acceptance,installation:$m.installation,
              evidenceClasses:{businessSourcePaths:$m.qualifications.sourcePaths,instanceDeployment:$m.installation},
              qualification:{localReceiptDigest:$m.qualifications.local.receiptDigest,sourcePathsDigest:$m.qualifications.sourcePaths.receiptDigest}}
            ' > "$root/release-provenance.json"
          echo "artifact_name=opl-cloud-publication-admission-$PRODUCT_SHA-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Upload sealed publication checkpoint
        id: publication_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.release_bundle.outputs.artifact_name }}
          path: artifacts/publication/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Remove private evidence and validator checkouts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for path in evidence release-authority product-source instance-deployment-authority "$OPL_RELEASE_AUTHORITY"; do
            [ -e "$path" ] || continue
            find "$path" -mindepth 1 -delete
            rmdir "$path"
          done
  publish:
    name: Publish admitted Candidate bytes
    if: ${{ github.ref == 'refs/heads/main' && github.actor == github.triggering_actor && (github.actor == github.repository_owner || github.actor == 'RenDeHuang') }}
    needs: admission
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloud-release
    concurrency:
      group: opl-cloud-publication-global
      cancel-in-progress: false
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      PRODUCT_REPOSITORY: ${{ github.repository }}
      PRODUCT_SHA: ${{ inputs.ref }}
      RELEASE_TAG: ${{ inputs.version }}
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
      ARTIFACT_ID: ${{ needs.admission.outputs.artifact_id }}
      ARTIFACT_DIGEST: ${{ needs.admission.outputs.artifact_digest }}
      ARTIFACT_NAME: ${{ needs.admission.outputs.artifact_name }}
      EXPECTED_IMAGE_DIGEST: ${{ needs.admission.outputs.image_digest }}
      EXPECTED_INSTALLATION_RECEIPT_DIGEST: ${{ needs.admission.outputs.installation_receipt_digest }}
      EXPECTED_INSTALLATION_RUN_DIGEST: ${{ needs.admission.outputs.installation_run_digest }}
      EXPECTED_INSTALLATION_RUN_ID: ${{ inputs.instance_deployment_verification_run_id }}
      EXPECTED_SOURCE_PATHS_DIGEST: ${{ needs.admission.outputs.source_paths_digest }}
      EXPECTED_PRODUCT_TREE: ${{ needs.admission.outputs.product_tree }}
      EXPECTED_CANDIDATE_RECEIPT_DIGEST: ${{ needs.admission.outputs.candidate_receipt_digest }}
    steps:
      - name: Verify sealed publication checkpoint identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          normalized_digest="${ARTIFACT_DIGEST#sha256:}"
          [[ "$normalized_digest" =~ ^[0-9a-f]{64}$ ]]
          metadata="$(gh api "repos/$PRODUCT_REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          jq -e \
            --arg id "$ARTIFACT_ID" \
            --arg name "$ARTIFACT_NAME" \
            --arg digest "$normalized_digest" \
            --arg run_id "$GITHUB_RUN_ID" '
              (.id | tostring) == $id and .name == $name and .expired == false and
              (.workflow_run.id | tostring) == $run_id and
              (.digest == $digest or .digest == ("sha256:" + $digest))
            ' <<< "$metadata" >/dev/null
      - name: Download sealed publication checkpoint
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.admission.outputs.artifact_name }}
          path: artifacts/publication
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Validate exact release bundle
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            release-provenance.json \
            release/SHA256SUMS \
            release/compose.deployment-customer-owned.yaml \
            release/compose.deployment-managed-tke.yaml \
            release/compose.deployment-platform-owned.yaml \
            release/compose.fabric-local-docker.yaml \
            release/compose.fabric-tencent-tke.yaml \
            release/compose.local-workspace.yaml \
            release/compose.yaml \
            release/opl-cloud-release.json \
            release/opl-cloud.env.example | sort)"
          actual="$(find artifacts/publication -type f -print | sed 's#^artifacts/publication/##' | sort)"
          test "$actual" = "$expected"
          (cd artifacts/publication/release && sha256sum --check --strict SHA256SUMS)
          jq -e --arg repository "$PRODUCT_REPOSITORY" --arg tag "$RELEASE_TAG" --arg sha "$PRODUCT_SHA" \
            --arg tree "$EXPECTED_PRODUCT_TREE" --arg candidate "$EXPECTED_CANDIDATE_RECEIPT_DIGEST" --arg digest "$EXPECTED_IMAGE_DIGEST" --arg installation "$EXPECTED_INSTALLATION_RECEIPT_DIGEST" \
            --arg installationRun "$EXPECTED_INSTALLATION_RUN_DIGEST" --arg installationRunId "$EXPECTED_INSTALLATION_RUN_ID" \
            --arg sourcePaths "$EXPECTED_SOURCE_PATHS_DIGEST" '
            .schemaVersion == 4 and .productRepository == $repository and .releaseTag == $tag and .source.sha == $sha and
            .source.tree == $tree and .candidate.receiptDigest == $candidate and .candidate.image.digest == $digest and .acceptance == "installation_and_source_paths" and
            .installation.repository == "gaofeng21cn/opl-instance-medopl" and .installation.status == "deployment_verified" and
            .installation.receiptDigest == $installation and .installation.runDigest == $installationRun and .installation.workflowRunId == $installationRunId and
            .qualifications.sourcePaths.status == "source_verified" and .qualifications.sourcePaths.scope == "business_source_paths" and
            .qualifications.sourcePaths.productSha == $sha and .qualifications.sourcePaths.productTree == .source.tree and .qualifications.sourcePaths.receiptDigest == $sourcePaths and
            .qualifications.sourcePaths.paidBusinessExecuted == false and .qualifications.sourcePaths.customerReadsExecuted == false and
            (.qualifications | has("business") or has("customer") or has("instance") | not)
          ' artifacts/publication/release/opl-cloud-release.json >/dev/null
          jq -e --slurpfile manifest artifacts/publication/release/opl-cloud-release.json \
            --arg sha "$GITHUB_SHA" --arg sourcePaths "$EXPECTED_SOURCE_PATHS_DIGEST" '
            $manifest[0] as $m | .schemaVersion == 4 and .workflowSha == $sha and .workflowRef == "refs/heads/main" and
            .productRepository == $m.productRepository and .releaseTag == $m.releaseTag and .acceptance == $m.acceptance and
            .candidateReceiptDigest == $m.candidate.receiptDigest and .imageDigest == $m.candidate.image.digest and
            .installation == $m.installation and .evidenceClasses.businessSourcePaths == $m.qualifications.sourcePaths and
            .evidenceClasses.instanceDeployment == $m.installation and .qualification.sourcePathsDigest == $sourcePaths
          ' artifacts/publication/release-provenance.json >/dev/null
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            artifacts/publication/release/compose.yaml
            artifacts/publication/release/compose.deployment-platform-owned.yaml
            artifacts/publication/release/compose.deployment-managed-tke.yaml
            artifacts/publication/release/compose.deployment-customer-owned.yaml
            artifacts/publication/release/compose.fabric-local-docker.yaml
            artifacts/publication/release/compose.fabric-tencent-tke.yaml
            artifacts/publication/release/compose.local-workspace.yaml
            artifacts/publication/release/opl-cloud.env.example
            artifacts/publication/release/opl-cloud-release.json
            artifacts/publication/release/SHA256SUMS
          predicate-type: https://github.com/gaofeng21cn/one-person-lab-cloud/attestations/opl-cloud-release/v1
          predicate-path: artifacts/publication/release-provenance.json
      - name: Log in to GHCR
        env:
          PACKAGES_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PACKAGES_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Promote exact Candidate digest to release tag
        shell: bash
        run: |
          set -euo pipefail
          candidate="$IMAGE_REPOSITORY@$EXPECTED_IMAGE_DIGEST"
          candidate_digest="$(docker buildx imagetools inspect "$candidate" --format '{{.Manifest.Digest}}')"
          test "$candidate_digest" = "$EXPECTED_IMAGE_DIGEST"
          current_digest="$(docker buildx imagetools inspect "$IMAGE_REPOSITORY:$RELEASE_TAG" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          if [ "$current_digest" != "$EXPECTED_IMAGE_DIGEST" ]; then
            docker buildx imagetools create --tag "$IMAGE_REPOSITORY:$RELEASE_TAG" "$candidate"
          fi
          published_digest="$(docker buildx imagetools inspect "$IMAGE_REPOSITORY:$RELEASE_TAG" --format '{{.Manifest.Digest}}')"
          test "$published_digest" = "$EXPECTED_IMAGE_DIGEST"
      - name: Reconcile GitHub Release on the same tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="artifacts/publication/release"
          assets=(
            "$release_dir/compose.yaml"
            "$release_dir/compose.deployment-platform-owned.yaml"
            "$release_dir/compose.deployment-managed-tke.yaml"
            "$release_dir/compose.deployment-customer-owned.yaml"
            "$release_dir/compose.fabric-local-docker.yaml"
            "$release_dir/compose.fabric-tencent-tke.yaml"
            "$release_dir/compose.local-workspace.yaml"
            "$release_dir/opl-cloud.env.example"
            "$release_dir/opl-cloud-release.json"
            "$release_dir/SHA256SUMS"
          )
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Portable OPL Cloud stable release with the native owner architecture and Cloud Console.

          Validation: immutable Linux amd64/arm64 Candidate, successful clean-host Local-Docker lifecycle, exact-Candidate medopl installation and independent read-only verification, and successful source CI with verified business entry paths.

          Paid Workspace procurement, charges, renewals and refunds were not executed for this release. Business-path source verification does not establish live provider billing or customer business acceptance. Installation configuration, credentials and deployment remain Instance-owned.

          Download all assets from this release and verify SHA256SUMS before installation.
          NOTES
          if gh api "repos/$PRODUCT_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh api "repos/$PRODUCT_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$PRODUCT_SHA"
          fi
          if gh release view "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh api "repos/$PRODUCT_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$PRODUCT_SHA"
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$PRODUCT_REPOSITORY"
            gh release edit "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          else
            gh release create "$RELEASE_TAG" \
              --repo "$PRODUCT_REPOSITORY" \
              --target "$PRODUCT_SHA" \
              --title "OPL Cloud $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --latest \
              "${assets[@]}"
          fi
          expected_names="$(printf '%s\n' "${assets[@]##*/}" | sort)"
          actual_names="$(gh release view "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" --json assets --jq '.assets[].name' | sort)"
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            if ! grep -Fqx "$name" <<< "$expected_names"; then
              gh release delete-asset "$RELEASE_TAG" "$name" --repo "$PRODUCT_REPOSITORY" --yes
            fi
          done <<< "$actual_names"
          test "$(gh release view "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" --json assets --jq '.assets[].name' | sort)" = "$expected_names"
      - name: Log out from GHCR
        if: always()
        shell: bash
        run: docker logout ghcr.io >/dev/null 2>&1 || true
