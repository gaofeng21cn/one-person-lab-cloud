name: Release OPL Cloud

on:
  workflow_dispatch:
    inputs:
      version:
        description: v0.x.y release tag; publication retries reuse this tag.
        required: true
        type: string
      ref:
        description: Exact 40-character product commit already merged into main.
        required: true
        type: string
      candidate_run_id:
        description: Successful Build OPL Cloud Candidate run for this product commit.
        required: true
        type: string
      local_qualification_run_id:
        description: Successful Clean Host Qualification run for the same Candidate digest.
        required: true
        type: string
      instance_qualification_decision_run_id:
        description: Successful required=true Instance Qualification Decision run for the same Candidate.
        required: true
        type: string
      instance_workspace_verification_run_id:
        description: Successful Instance post-activation run with workspace_verified evidence for that decision.
        required: true
        type: string

permissions:
  contents: read

jobs:
  admission:
    name: Admit qualified Candidate bytes
    if: ${{ github.ref == 'refs/heads/main' && github.actor == github.triggering_actor && (github.actor == github.repository_owner || github.actor == 'RenDeHuang') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      artifact_id: ${{ steps.publication_artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.publication_artifact.outputs.artifact-digest }}
      artifact_name: ${{ steps.release_bundle.outputs.artifact_name }}
      candidate_receipt_digest: ${{ steps.candidate.outputs.candidate_receipt_digest }}
      image_digest: ${{ steps.candidate.outputs.image_digest }}
      product_tree: ${{ steps.candidate.outputs.product_tree }}
      qualification_scope_digest: ${{ steps.instance.outputs.qualification_scope_digest }}
    env:
      PRODUCT_REPOSITORY: ${{ github.repository }}
      PRODUCT_SHA: ${{ inputs.ref }}
      RELEASE_TAG: ${{ inputs.version }}
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
      INSTANCE_REPOSITORY: gaofeng21cn/opl-instance-medopl
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      LOCAL_QUALIFICATION_RUN_ID: ${{ inputs.local_qualification_run_id }}
      INSTANCE_DECISION_RUN_ID: ${{ inputs.instance_qualification_decision_run_id }}
      INSTANCE_WORKSPACE_RUN_ID: ${{ inputs.instance_workspace_verification_run_id }}

    steps:
      - name: Require exact publication inputs and private evidence reader
        env:
          INSTANCE_EVIDENCE_TOKEN: ${{ secrets.OPL_INSTANCE_EVIDENCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v0\.[0-9]+\.[0-9]+$ ]]
          [[ "$PRODUCT_SHA" =~ ^[0-9a-f]{40}$ ]]
          for run_id in "$CANDIDATE_RUN_ID" "$LOCAL_QUALIFICATION_RUN_ID" "$INSTANCE_DECISION_RUN_ID" "$INSTANCE_WORKSPACE_RUN_ID"; do
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          done
          test -n "$INSTANCE_EVIDENCE_TOKEN"

      - name: Resolve exact evidence runs and artifacts
        id: evidence
        env:
          CLOUD_TOKEN: ${{ github.token }}
          INSTANCE_TOKEN: ${{ secrets.OPL_INSTANCE_EVIDENCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          authority="$RUNNER_TEMP/opl-cloud-release-authority"
          mkdir -p "$authority"

          GH_TOKEN="$CLOUD_TOKEN" gh api "repos/$PRODUCT_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > "$authority/candidate-run.json"
          GH_TOKEN="$CLOUD_TOKEN" gh api "repos/$PRODUCT_REPOSITORY/actions/runs/$LOCAL_QUALIFICATION_RUN_ID" > "$authority/local-run.json"
          GH_TOKEN="$INSTANCE_TOKEN" gh api "repos/$INSTANCE_REPOSITORY/actions/runs/$INSTANCE_DECISION_RUN_ID" > "$authority/instance-decision-run.json"
          GH_TOKEN="$INSTANCE_TOKEN" gh api "repos/$INSTANCE_REPOSITORY/actions/runs/$INSTANCE_WORKSPACE_RUN_ID" > "$authority/instance-workspace-run.json"

          validate_run() {
            local file="$1" run_id="$2" repository="$3" workflow="$4"
            jq -e --arg run_id "$run_id" --arg repository "$repository" --arg workflow "$workflow" '
              (.id | tostring) == $run_id and .repository.full_name == $repository and
              .path == $workflow and .event == "workflow_dispatch" and .head_branch == "main" and
              .status == "completed" and .conclusion == "success" and
              (.head_sha | test("^[0-9a-f]{40}$"))
            ' "$file" >/dev/null
          }
          validate_run "$authority/candidate-run.json" "$CANDIDATE_RUN_ID" "$PRODUCT_REPOSITORY" ".github/workflows/build-opl-cloud-candidate.yml"
          validate_run "$authority/local-run.json" "$LOCAL_QUALIFICATION_RUN_ID" "$PRODUCT_REPOSITORY" ".github/workflows/clean-host-qualification.yml"
          validate_run "$authority/instance-decision-run.json" "$INSTANCE_DECISION_RUN_ID" "$INSTANCE_REPOSITORY" ".github/workflows/qualification-decision.yml"
          validate_run "$authority/instance-workspace-run.json" "$INSTANCE_WORKSPACE_RUN_ID" "$INSTANCE_REPOSITORY" ".github/workflows/verify.yml"

          candidate_attempt="$(jq -r '.run_attempt | tostring' "$authority/candidate-run.json")"
          [[ "$candidate_attempt" =~ ^[1-9][0-9]*$ ]]
          candidate_artifact="opl-cloud-candidate-$PRODUCT_SHA-$candidate_attempt"
          local_artifact="local-workspace-qualification"
          decision_artifact="opl-cloud-qualification-decision-$INSTANCE_DECISION_RUN_ID"
          workspace_artifact="verify-post-activation"

          GH_TOKEN="$CLOUD_TOKEN" gh api "repos/$PRODUCT_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100" > "$authority/candidate-artifacts.json"
          GH_TOKEN="$CLOUD_TOKEN" gh api "repos/$PRODUCT_REPOSITORY/actions/runs/$LOCAL_QUALIFICATION_RUN_ID/artifacts?per_page=100" > "$authority/local-artifacts.json"
          GH_TOKEN="$INSTANCE_TOKEN" gh api "repos/$INSTANCE_REPOSITORY/actions/runs/$INSTANCE_DECISION_RUN_ID/artifacts?per_page=100" > "$authority/instance-decision-artifacts.json"
          GH_TOKEN="$INSTANCE_TOKEN" gh api "repos/$INSTANCE_REPOSITORY/actions/runs/$INSTANCE_WORKSPACE_RUN_ID/artifacts?per_page=100" > "$authority/instance-workspace-artifacts.json"

          require_artifact() {
            local file="$1" name="$2" run_id="$3"
            jq -e --arg name "$name" --arg run_id "$run_id" '
              [.artifacts[] | select(.name == $name and .expired == false and (.workflow_run.id | tostring) == $run_id)] | length == 1
            ' "$file" >/dev/null
          }
          require_artifact "$authority/candidate-artifacts.json" "$candidate_artifact" "$CANDIDATE_RUN_ID"
          require_artifact "$authority/local-artifacts.json" "$local_artifact" "$LOCAL_QUALIFICATION_RUN_ID"
          require_artifact "$authority/instance-decision-artifacts.json" "$decision_artifact" "$INSTANCE_DECISION_RUN_ID"
          require_artifact "$authority/instance-workspace-artifacts.json" "$workspace_artifact" "$INSTANCE_WORKSPACE_RUN_ID"

          {
            echo "candidate_artifact=$candidate_artifact"
            echo "candidate_run_attempt=$candidate_attempt"
            echo "decision_authority_sha=$(jq -r .head_sha "$authority/instance-decision-run.json")"
            echo "workspace_authority_sha=$(jq -r .head_sha "$authority/instance-workspace-run.json")"
          } >> "$GITHUB_OUTPUT"
          echo "OPL_RELEASE_AUTHORITY=$authority" >> "$GITHUB_ENV"

      - name: Checkout exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false
          path: product-source

      - name: Checkout exact Instance decision validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/opl-instance-medopl
          ref: ${{ steps.evidence.outputs.decision_authority_sha }}
          token: ${{ secrets.OPL_INSTANCE_EVIDENCE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: instance-decision-authority

      - name: Checkout exact Instance workspace validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/opl-instance-medopl
          ref: ${{ steps.evidence.outputs.workspace_authority_sha }}
          token: ${{ secrets.OPL_INSTANCE_EVIDENCE_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          path: instance-workspace-authority

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Download exact Candidate bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.evidence.outputs.candidate_artifact }}
          path: evidence/candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Download exact Local qualification
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: local-workspace-qualification
          path: evidence/local
          github-token: ${{ github.token }}
          run-id: ${{ inputs.local_qualification_run_id }}

      - name: Download exact Instance qualification decision
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opl-cloud-qualification-decision-${{ inputs.instance_qualification_decision_run_id }}
          path: evidence/instance-decision
          github-token: ${{ secrets.OPL_INSTANCE_EVIDENCE_TOKEN }}
          repository: gaofeng21cn/opl-instance-medopl
          run-id: ${{ inputs.instance_qualification_decision_run_id }}

      - name: Download exact Instance workspace verification
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verify-post-activation
          path: evidence/instance-workspace
          github-token: ${{ secrets.OPL_INSTANCE_EVIDENCE_TOKEN }}
          repository: gaofeng21cn/opl-instance-medopl
          run-id: ${{ inputs.instance_workspace_verification_run_id }}

      - name: Validate exact Candidate source and bundle
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product-source rev-parse HEAD)" = "$PRODUCT_SHA"
          product_tree="$(git -C product-source rev-parse 'HEAD^{tree}')"
          node --experimental-strip-types product-source/tools/cloud-candidate-receipt.ts validate-bundle --bundle evidence/candidate
          node --experimental-strip-types product-source/tools/cloud-candidate-receipt.ts export-env \
            --receipt evidence/candidate/opl-cloud-candidate.json --github-env "$GITHUB_ENV"
          candidate_receipt_digest="$(node --experimental-strip-types product-source/tools/cloud-candidate-receipt.ts digest --receipt evidence/candidate/opl-cloud-candidate.json)"
          candidate_run_attempt='${{ steps.evidence.outputs.candidate_run_attempt }}'
          jq -e \
            --arg repository "$PRODUCT_REPOSITORY" \
            --arg product_sha "$PRODUCT_SHA" \
            --arg product_tree "$product_tree" \
            --arg workflow_sha "$(jq -r .head_sha "$OPL_RELEASE_AUTHORITY/candidate-run.json")" \
            --arg run_id "$CANDIDATE_RUN_ID" \
            --arg run_attempt "$candidate_run_attempt" '
              .product.repository == $repository and .product.sha == $product_sha and .product.tree == $product_tree and
              .provenance.workflowRepository == $repository and .provenance.workflowSha == $workflow_sha and
              .provenance.workflowRunId == $run_id and .provenance.workflowRunAttempt == $run_attempt
            ' evidence/candidate/opl-cloud-candidate.json >/dev/null
          {
            echo "candidate_receipt_digest=$candidate_receipt_digest"
            echo "product_tree=$product_tree"
            echo "image_ref=$(jq -r .cloudImage.indexRef evidence/candidate/opl-cloud-candidate.json)"
            echo "image_digest=$(jq -r .cloudImage.indexDigest evidence/candidate/opl-cloud-candidate.json)"
            echo "amd64_digest=$(jq -r '.cloudImage.platforms[] | select(.platform == "linux/amd64") | .digest' evidence/candidate/opl-cloud-candidate.json)"
            echo "arm64_digest=$(jq -r '.cloudImage.platforms[] | select(.platform == "linux/arm64") | .digest' evidence/candidate/opl-cloud-candidate.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Read back Candidate index and platform bytes
        env:
          PACKAGES_TOKEN: ${{ github.token }}
          EXPECTED_IMAGE: ${{ steps.candidate.outputs.image_ref }}
          EXPECTED_DIGEST: ${{ steps.candidate.outputs.image_digest }}
          EXPECTED_AMD64: ${{ steps.candidate.outputs.amd64_digest }}
          EXPECTED_ARM64: ${{ steps.candidate.outputs.arm64_digest }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PACKAGES_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          manifest="$(docker buildx imagetools inspect "$EXPECTED_IMAGE" --format '{{json .Manifest}}')"
          test "$(jq -r .digest <<< "$manifest")" = "$EXPECTED_DIGEST"
          jq -e --arg amd64 "$EXPECTED_AMD64" --arg arm64 "$EXPECTED_ARM64" '
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest] == [$amd64]) and
            ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest] == [$arm64]) and
            all(.manifests[];
              (.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64")) or
              (.platform.os == "unknown" and .platform.architecture == "unknown" and
               .annotations["vnd.docker.reference.type"] == "attestation-manifest")
            )
          ' <<< "$manifest" >/dev/null
          for identity in "amd64:$EXPECTED_AMD64" "arm64:$EXPECTED_ARM64"; do
            architecture="${identity%%:*}"
            digest="${identity#*:}"
            image="$(docker buildx imagetools inspect "$IMAGE_REPOSITORY@$digest" --format '{{json .Image}}')"
            jq -e --arg architecture "$architecture" --arg revision "$PRODUCT_SHA" '
              .os == "linux" and .architecture == $architecture and
              .config.Labels["org.opencontainers.image.revision"] == $revision
            ' <<< "$image" >/dev/null
          done
          docker logout ghcr.io >/dev/null 2>&1 || true

      - name: Validate Local clean-host qualification
        id: local
        env:
          VALIDATOR: ${{ github.workspace }}/product-source/tools/local-workspace-qualification.ts
          RECEIPT: ${{ github.workspace }}/evidence/local/local-workspace-qualification.json
          EXPECTED_TREE: ${{ steps.candidate.outputs.product_tree }}
          EXPECTED_IMAGE: ${{ steps.candidate.outputs.image_ref }}
          EXPECTED_DIGEST: ${{ steps.candidate.outputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(find evidence/local -type f | wc -l | tr -d ' ')" = 1
          node --experimental-strip-types --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { pathToFileURL } from "node:url";
          const { validateLocalQualificationReceipt } = await import(pathToFileURL(process.env.VALIDATOR));
          const receipt = validateLocalQualificationReceipt(JSON.parse(await readFile(process.env.RECEIPT, "utf8")));
          if (receipt.source.sha !== process.env.PRODUCT_SHA || receipt.source.tree !== process.env.EXPECTED_TREE ||
              receipt.images.cloud.input !== process.env.EXPECTED_IMAGE || receipt.images.cloud.repoDigest !== process.env.EXPECTED_IMAGE ||
              receipt.images.cloud.digest !== process.env.EXPECTED_DIGEST || receipt.qualification.authorityMode !== "fixture") {
            throw new Error("local_qualification_candidate_binding_invalid");
          }
          NODE
          echo "local_receipt_digest=sha256:$(sha256sum "$RECEIPT" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Validate Instance decision and workspace qualification
        id: instance
        env:
          CANDIDATE: ${{ github.workspace }}/evidence/candidate/opl-cloud-candidate.json
          DECISION_RECEIPT: ${{ github.workspace }}/evidence/instance-decision/evidence.json
          WORKSPACE_RECEIPT: ${{ github.workspace }}/evidence/instance-workspace/evidence.json
          DECISION_AUTHORITY: ${{ github.workspace }}/instance-decision-authority
          WORKSPACE_AUTHORITY: ${{ github.workspace }}/instance-workspace-authority
          EXPECTED_DECISION_SHA: ${{ steps.evidence.outputs.decision_authority_sha }}
          EXPECTED_WORKSPACE_SHA: ${{ steps.evidence.outputs.workspace_authority_sha }}
        shell: bash
        run: |
          set -euo pipefail
          export DECISION_RUN="$OPL_RELEASE_AUTHORITY/instance-decision-run.json"
          export WORKSPACE_RUN="$OPL_RELEASE_AUTHORITY/instance-workspace-run.json"
          gate_output="$OPL_RELEASE_AUTHORITY/instance-gate-output"
          test "$(find evidence/instance-decision -type f | wc -l | tr -d ' ')" = 1
          test "$(find evidence/instance-workspace -type f | wc -l | tr -d ' ')" = 1
          test "$(git -C "$DECISION_AUTHORITY" rev-parse HEAD)" = "$EXPECTED_DECISION_SHA"
          test "$(git -C "$WORKSPACE_AUTHORITY" rev-parse HEAD)" = "$EXPECTED_WORKSPACE_SHA"
          node "$DECISION_AUTHORITY/tools/qualification-decision.mjs" validate "$DECISION_RECEIPT"
          node "$DECISION_AUTHORITY/tools/qualification-decision.mjs" gate \
            --candidate "$CANDIDATE" \
            --decision-receipt "$DECISION_RECEIPT" \
            --decision-run "$DECISION_RUN" \
            --decision-run-id "$INSTANCE_DECISION_RUN_ID" \
            --repository "$INSTANCE_REPOSITORY" \
            --github-output "$gate_output"
          node "$WORKSPACE_AUTHORITY/tools/fresh-workspace-readback.mjs" validate "$WORKSPACE_RECEIPT"

          read_gate_digest() {
            local key="$1" value
            test "$(grep -c "^${key}=" "$gate_output")" = 1
            value="$(sed -n "s/^${key}=//p" "$gate_output")"
            [[ "$value" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s' "$value"
          }
          qualification_decision_receipt_digest="$(read_gate_digest qualification_decision_receipt_digest)"
          qualification_decision_run_digest="$(read_gate_digest qualification_decision_run_digest)"
          qualification_scope_digest="$(read_gate_digest qualification_scope_digest)"
          export QUALIFICATION_DECISION_RECEIPT_DIGEST="$qualification_decision_receipt_digest"
          export QUALIFICATION_DECISION_RUN_DIGEST="$qualification_decision_run_digest"
          export QUALIFICATION_SCOPE_DIGEST="$qualification_scope_digest"
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const candidate = JSON.parse(await readFile(process.env.CANDIDATE, "utf8"));
          const receipt = JSON.parse(await readFile(process.env.WORKSPACE_RECEIPT, "utf8"));
          const expected = {
            candidateReceiptDigest: process.env.OPL_CANDIDATE_RECEIPT_DIGEST,
            productSha: candidate.product.sha,
            productTree: candidate.product.tree,
            cloudImageRef: candidate.cloudImage.indexRef,
            cloudImageDigest: candidate.cloudImage.indexDigest,
            cloudImageRevision: candidate.cloudImage.revision,
          };
          if (receipt.status !== "workspace_verified" ||
              Object.entries(expected).some(([key, value]) => receipt[key] !== value) ||
              receipt.qualificationDecisionReceiptDigest !== process.env.QUALIFICATION_DECISION_RECEIPT_DIGEST ||
              receipt.qualificationDecisionRunDigest !== process.env.QUALIFICATION_DECISION_RUN_DIGEST ||
              receipt.qualificationScopeDigest !== process.env.QUALIFICATION_SCOPE_DIGEST ||
              Object.values(receipt.mutationCounts).some((value) => value !== 0)) {
            throw new Error("instance_workspace_candidate_binding_invalid");
          }
          NODE
          {
            echo "qualification_decision_receipt_digest=$QUALIFICATION_DECISION_RECEIPT_DIGEST"
            echo "qualification_decision_run_digest=$QUALIFICATION_DECISION_RUN_DIGEST"
            echo "qualification_scope_digest=$QUALIFICATION_SCOPE_DIGEST"
            echo "workspace_receipt_digest=sha256:$(sha256sum "$WORKSPACE_RECEIPT" | cut -d ' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Seal release bundle from admitted Candidate bytes
        id: release_bundle
        env:
          PRODUCT_TREE: ${{ steps.candidate.outputs.product_tree }}
          CANDIDATE_RUN_ATTEMPT: ${{ steps.evidence.outputs.candidate_run_attempt }}
          CANDIDATE_RECEIPT_DIGEST: ${{ steps.candidate.outputs.candidate_receipt_digest }}
          IMAGE_REF: ${{ steps.candidate.outputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.candidate.outputs.image_digest }}
          AMD64_DIGEST: ${{ steps.candidate.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.candidate.outputs.arm64_digest }}
          LOCAL_RECEIPT_DIGEST: ${{ steps.local.outputs.local_receipt_digest }}
          DECISION_RECEIPT_DIGEST: ${{ steps.instance.outputs.qualification_decision_receipt_digest }}
          DECISION_RUN_DIGEST: ${{ steps.instance.outputs.qualification_decision_run_digest }}
          WORKSPACE_RECEIPT_DIGEST: ${{ steps.instance.outputs.workspace_receipt_digest }}
          QUALIFICATION_SCOPE_DIGEST: ${{ steps.instance.outputs.qualification_scope_digest }}
          DECISION_AUTHORITY_SHA: ${{ steps.evidence.outputs.decision_authority_sha }}
          WORKSPACE_AUTHORITY_SHA: ${{ steps.evidence.outputs.workspace_authority_sha }}
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/publication"
          release="$root/release"
          mkdir -p "$release"
          for asset in compose.yaml compose.deployment-platform-owned.yaml compose.deployment-managed-tke.yaml compose.deployment-customer-owned.yaml compose.fabric-local-docker.yaml compose.fabric-tencent-tke.yaml compose.local-workspace.yaml opl-cloud.env.example; do
            cp "evidence/candidate/$asset" "$release/$asset"
          done
          jq -n \
            --arg repository "$PRODUCT_REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            --arg sha "$PRODUCT_SHA" \
            --arg tree "$PRODUCT_TREE" \
            --arg candidateRunId "$CANDIDATE_RUN_ID" \
            --arg candidateRunAttempt "$CANDIDATE_RUN_ATTEMPT" \
            --arg candidateReceiptDigest "$CANDIDATE_RECEIPT_DIGEST" \
            --arg imageRef "$IMAGE_REF" \
            --arg imageDigest "$IMAGE_DIGEST" \
            --arg amd64Digest "$AMD64_DIGEST" \
            --arg arm64Digest "$ARM64_DIGEST" \
            --arg localRunId "$LOCAL_QUALIFICATION_RUN_ID" \
            --arg localReceiptDigest "$LOCAL_RECEIPT_DIGEST" \
            --arg instanceRepository "$INSTANCE_REPOSITORY" \
            --arg decisionRunId "$INSTANCE_DECISION_RUN_ID" \
            --arg decisionRunDigest "$DECISION_RUN_DIGEST" \
            --arg decisionReceiptDigest "$DECISION_RECEIPT_DIGEST" \
            --arg decisionAuthoritySha "$DECISION_AUTHORITY_SHA" \
            --arg workspaceRunId "$INSTANCE_WORKSPACE_RUN_ID" \
            --arg workspaceReceiptDigest "$WORKSPACE_RECEIPT_DIGEST" \
            --arg workspaceAuthoritySha "$WORKSPACE_AUTHORITY_SHA" \
            --arg qualificationScopeDigest "$QUALIFICATION_SCOPE_DIGEST" '
            {
              schemaVersion: 2,
              product: "OPL Cloud",
              productRepository: $repository,
              releaseTag: $tag,
              source: {sha: $sha, tree: $tree},
              candidate: {
                workflowRunId: $candidateRunId,
                workflowRunAttempt: $candidateRunAttempt,
                receiptDigest: $candidateReceiptDigest,
                image: {
                  ref: $imageRef,
                  digest: $imageDigest,
                  platforms: [
                    {platform: "linux/amd64", digest: $amd64Digest},
                    {platform: "linux/arm64", digest: $arm64Digest}
                  ]
                }
              },
              qualifications: {
                local: {repository: $repository, workflowRunId: $localRunId, receiptDigest: $localReceiptDigest},
                instance: {
                  repository: $instanceRepository,
                  decision: {workflowRunId: $decisionRunId, runDigest: $decisionRunDigest, receiptDigest: $decisionReceiptDigest, authoritySha: $decisionAuthoritySha},
                  workspace: {workflowRunId: $workspaceRunId, receiptDigest: $workspaceReceiptDigest, authoritySha: $workspaceAuthoritySha, status: "workspace_verified"},
                  scopeDigest: $qualificationScopeDigest
                }
              },
              assets: [
                "compose.yaml",
                "compose.deployment-platform-owned.yaml",
                "compose.deployment-managed-tke.yaml",
                "compose.deployment-customer-owned.yaml",
                "compose.fabric-local-docker.yaml",
                "compose.fabric-tencent-tke.yaml",
                "compose.local-workspace.yaml",
                "opl-cloud.env.example",
                "SHA256SUMS"
              ]
            }
          ' > "$release/opl-cloud-release.json"
          (
            cd "$release"
            sha256sum \
              compose.yaml \
              compose.deployment-platform-owned.yaml \
              compose.deployment-managed-tke.yaml \
              compose.deployment-customer-owned.yaml \
              compose.fabric-local-docker.yaml \
              compose.fabric-tencent-tke.yaml \
              compose.local-workspace.yaml \
              opl-cloud.env.example \
              opl-cloud-release.json \
              > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
          )
          release_manifest_digest="sha256:$(sha256sum "$release/opl-cloud-release.json" | cut -d ' ' -f1)"
          jq -n \
            --arg productRepository "$PRODUCT_REPOSITORY" \
            --arg workflowSha "$GITHUB_SHA" \
            --arg workflowRef "$GITHUB_REF" \
            --arg releaseTag "$RELEASE_TAG" \
            --arg releaseManifestDigest "$release_manifest_digest" \
            --arg candidateReceiptDigest "$CANDIDATE_RECEIPT_DIGEST" \
            --arg imageDigest "$IMAGE_DIGEST" \
            --arg localReceiptDigest "$LOCAL_RECEIPT_DIGEST" \
            --arg decisionReceiptDigest "$DECISION_RECEIPT_DIGEST" \
            --arg workspaceReceiptDigest "$WORKSPACE_RECEIPT_DIGEST" \
            --arg qualificationScopeDigest "$QUALIFICATION_SCOPE_DIGEST" '
            {
              schemaVersion: 2,
              productRepository: $productRepository,
              workflowSha: $workflowSha,
              workflowRef: $workflowRef,
              releaseTag: $releaseTag,
              releaseManifestDigest: $releaseManifestDigest,
              candidateReceiptDigest: $candidateReceiptDigest,
              imageDigest: $imageDigest,
              qualification: {
                localReceiptDigest: $localReceiptDigest,
                decisionReceiptDigest: $decisionReceiptDigest,
                workspaceReceiptDigest: $workspaceReceiptDigest,
                scopeDigest: $qualificationScopeDigest
              }
            }
          ' > "$root/release-provenance.json"
          artifact_name="opl-cloud-publication-admission-$PRODUCT_SHA-$GITHUB_RUN_ID"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload sealed publication checkpoint
        id: publication_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release_bundle.outputs.artifact_name }}
          path: artifacts/publication/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Remove private evidence and validator checkouts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for path in evidence instance-decision-authority instance-workspace-authority "$OPL_RELEASE_AUTHORITY"; do
            [ -e "$path" ] || continue
            find "$path" -mindepth 1 -delete
            rmdir "$path"
          done

  publish:
    name: Publish admitted Candidate bytes
    if: ${{ github.ref == 'refs/heads/main' && github.actor == github.triggering_actor && (github.actor == github.repository_owner || github.actor == 'RenDeHuang') }}
    needs: admission
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloud-release
    concurrency:
      group: opl-cloud-publication-global
      cancel-in-progress: false
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      PRODUCT_REPOSITORY: ${{ github.repository }}
      PRODUCT_SHA: ${{ inputs.ref }}
      RELEASE_TAG: ${{ inputs.version }}
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
      ARTIFACT_ID: ${{ needs.admission.outputs.artifact_id }}
      ARTIFACT_DIGEST: ${{ needs.admission.outputs.artifact_digest }}
      ARTIFACT_NAME: ${{ needs.admission.outputs.artifact_name }}
      EXPECTED_IMAGE_DIGEST: ${{ needs.admission.outputs.image_digest }}

    steps:
      - name: Verify sealed publication checkpoint identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          normalized_digest="${ARTIFACT_DIGEST#sha256:}"
          [[ "$normalized_digest" =~ ^[0-9a-f]{64}$ ]]
          metadata="$(gh api "repos/$PRODUCT_REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          jq -e \
            --arg id "$ARTIFACT_ID" \
            --arg name "$ARTIFACT_NAME" \
            --arg digest "$normalized_digest" \
            --arg run_id "$GITHUB_RUN_ID" '
              (.id | tostring) == $id and .name == $name and .expired == false and
              (.workflow_run.id | tostring) == $run_id and
              (.digest == $digest or .digest == ("sha256:" + $digest))
            ' <<< "$metadata" >/dev/null

      - name: Download sealed publication checkpoint
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.admission.outputs.artifact_name }}
          path: artifacts/publication
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Validate exact release bundle
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            release-provenance.json \
            release/SHA256SUMS \
            release/compose.deployment-customer-owned.yaml \
            release/compose.deployment-managed-tke.yaml \
            release/compose.deployment-platform-owned.yaml \
            release/compose.fabric-local-docker.yaml \
            release/compose.fabric-tencent-tke.yaml \
            release/compose.local-workspace.yaml \
            release/compose.yaml \
            release/opl-cloud-release.json \
            release/opl-cloud.env.example | sort)"
          actual="$(find artifacts/publication -type f -print | sed 's#^artifacts/publication/##' | sort)"
          test "$actual" = "$expected"
          (cd artifacts/publication/release && sha256sum --check --strict SHA256SUMS)
          jq -e \
            --arg repository "$PRODUCT_REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            --arg sha "$PRODUCT_SHA" \
            --arg tree '${{ needs.admission.outputs.product_tree }}' \
            --arg candidate '${{ needs.admission.outputs.candidate_receipt_digest }}' \
            --arg digest "$EXPECTED_IMAGE_DIGEST" \
            --arg scope '${{ needs.admission.outputs.qualification_scope_digest }}' '
              .schemaVersion == 2 and .productRepository == $repository and .releaseTag == $tag and
              .source == {sha:$sha,tree:$tree} and .candidate.receiptDigest == $candidate and
              .candidate.image.digest == $digest and .qualifications.instance.scopeDigest == $scope and
              .qualifications.instance.workspace.status == "workspace_verified"
            ' artifacts/publication/release/opl-cloud-release.json >/dev/null

      - name: Attest release assets
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            artifacts/publication/release/compose.yaml
            artifacts/publication/release/compose.deployment-platform-owned.yaml
            artifacts/publication/release/compose.deployment-managed-tke.yaml
            artifacts/publication/release/compose.deployment-customer-owned.yaml
            artifacts/publication/release/compose.fabric-local-docker.yaml
            artifacts/publication/release/compose.fabric-tencent-tke.yaml
            artifacts/publication/release/compose.local-workspace.yaml
            artifacts/publication/release/opl-cloud.env.example
            artifacts/publication/release/opl-cloud-release.json
            artifacts/publication/release/SHA256SUMS
          predicate-type: https://github.com/gaofeng21cn/one-person-lab-cloud/attestations/opl-cloud-release/v1
          predicate-path: artifacts/publication/release-provenance.json

      - name: Log in to GHCR
        env:
          PACKAGES_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PACKAGES_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Promote exact Candidate digest to release tag
        shell: bash
        run: |
          set -euo pipefail
          candidate="$IMAGE_REPOSITORY@$EXPECTED_IMAGE_DIGEST"
          candidate_digest="$(docker buildx imagetools inspect "$candidate" --format '{{.Manifest.Digest}}')"
          test "$candidate_digest" = "$EXPECTED_IMAGE_DIGEST"
          current_digest="$(docker buildx imagetools inspect "$IMAGE_REPOSITORY:$RELEASE_TAG" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          if [ "$current_digest" != "$EXPECTED_IMAGE_DIGEST" ]; then
            docker buildx imagetools create --tag "$IMAGE_REPOSITORY:$RELEASE_TAG" "$candidate"
          fi
          published_digest="$(docker buildx imagetools inspect "$IMAGE_REPOSITORY:$RELEASE_TAG" --format '{{.Manifest.Digest}}')"
          test "$published_digest" = "$EXPECTED_IMAGE_DIGEST"

      - name: Reconcile GitHub Release on the same tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="artifacts/publication/release"
          assets=(
            "$release_dir/compose.yaml"
            "$release_dir/compose.deployment-platform-owned.yaml"
            "$release_dir/compose.deployment-managed-tke.yaml"
            "$release_dir/compose.deployment-customer-owned.yaml"
            "$release_dir/compose.fabric-local-docker.yaml"
            "$release_dir/compose.fabric-tencent-tke.yaml"
            "$release_dir/compose.local-workspace.yaml"
            "$release_dir/opl-cloud.env.example"
            "$release_dir/opl-cloud-release.json"
            "$release_dir/SHA256SUMS"
          )
          if gh api "repos/$PRODUCT_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh api "repos/$PRODUCT_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$PRODUCT_SHA"
          fi
          if gh release view "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh api "repos/$PRODUCT_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$PRODUCT_SHA"
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$PRODUCT_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$PRODUCT_REPOSITORY" \
              --target "$PRODUCT_SHA" \
              --title "OPL Cloud $RELEASE_TAG" \
              --generate-notes \
              "${assets[@]}"
          fi
          expected_names="$(printf '%s\n' "${assets[@]##*/}" | sort)"
          actual_names="$(gh release view "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" --json assets --jq '.assets[].name' | sort)"
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            if ! grep -Fqx "$name" <<< "$expected_names"; then
              gh release delete-asset "$RELEASE_TAG" "$name" --repo "$PRODUCT_REPOSITORY" --yes
            fi
          done <<< "$actual_names"
          test "$(gh release view "$RELEASE_TAG" --repo "$PRODUCT_REPOSITORY" --json assets --jq '.assets[].name' | sort)" = "$expected_names"

      - name: Log out from GHCR
        if: always()
        shell: bash
        run: docker logout ghcr.io >/dev/null 2>&1 || true
