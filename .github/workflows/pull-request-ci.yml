name: Pull Request CI

on:
  pull_request:
    branches:
      - main
    # `edited` re-runs the governance check when the pull-request body changes;
    # without it a stale green check would survive a rewritten claim.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pull-request-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency_review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  governance:
    name: governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # Record compliance and freshness use only the base commit's checker;
      # head is inspected data. Actual execution belongs to the validate job,
      # and merge eligibility still follows the existing review/merge rules.
      - name: Check the pull request governance record
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base_dir="$RUNNER_TEMP/governance-base-record"
          git worktree add --detach --force "$base_dir" "$PR_BASE_SHA"
          entry="$base_dir/tools/check-pr-governance.ts"
          if [ ! -f "$entry" ]; then
            echo "::error title=Governance checker missing::${PR_BASE_SHA} has no governance checker; refusing to execute the pull request head copy"
            exit 1
          fi
          node "$entry" --body-env PR_BODY --base-env PR_BASE_SHA --head-env PR_HEAD_SHA --mode record --root "$GITHUB_WORKSPACE"

  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install spec generator toolchain
        run: |
          python3 -m pip install -r docs/spec/target/checks/requirements.txt

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false

      - name: Install contract generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1

      - name: Install OS sandbox for scoped checks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          # bubblewrap needs unprivileged user namespaces; newer Ubuntu images
          # restrict them via AppArmor, so relax that restriction for the runner.
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate source
        run: |
          go_bin="$(go env GOPATH)/bin"
          echo "$go_bin" >> "$GITHUB_PATH"
          PATH="$PATH:$go_bin" npm run verify:local

      - name: Check diff whitespace
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
