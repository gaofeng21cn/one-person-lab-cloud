name: Pull Request CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pull-request-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency_review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Single source of truth for the pinned contract generator versions: the
      # same values key the binary cache and drive the install.
      PROTOC_GEN_GO_VERSION: "1.36.6"
      PROTOC_GEN_GO_GRPC_VERSION: "1.5.1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          # The spec generators are only used by the plan and contract checks,
          # but the exhaustive gate always needs them; the wheel cache keeps the
          # install at pinned versions without paying the download each run.
          cache: "pip"
          cache-dependency-path: docs/spec/target/checks/requirements.txt

      - name: Install spec generator toolchain
        run: |
          python3 -m pip install -r docs/spec/target/checks/requirements.txt

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          # The exhaustive gate compiles every module and runs nine database-free
          # lanes, so a cold module and build cache is the largest avoidable cost
          # in the critical path (Fabric alone compiled for 41s). The key covers
          # every module's go.sum: any dependency change still invalidates it.
          cache: true
          cache-dependency-path: |
            apps/console-bff/go.sum
            packages/contracts/go/go.sum
            services/build/go.sum
            services/capability/go.sum
            services/control-plane/go.sum
            services/fabric/go.sum
            services/gateway-integration/go.sum
            services/internal/ownerservice/go.sum
            services/internal/ownerstore/go.sum
            services/internal/postgresmigrate/go.sum
            services/ledger/go.sum
            services/resource-catalog/go.sum
            services/runtime-control/go.sum
            services/serve/go.sum
            services/workspace/go.sum

      - name: Restore contract generator binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/bin/protoc-gen-go
            ~/go/bin/protoc-gen-go-grpc
          # Versioned key: a generator bump must produce a fresh install instead
          # of reusing binaries the freshness check would reject.
          key: ${{ runner.os }}-${{ runner.arch }}-contract-generators-protoc-gen-go-${{ env.PROTOC_GEN_GO_VERSION }}-protoc-gen-go-grpc-${{ env.PROTOC_GEN_GO_GRPC_VERSION }}

      - name: Install contract generators
        run: |
          go_bin="$(go env GOPATH)/bin"
          if [ -x "$go_bin/protoc-gen-go" ] && [ -x "$go_bin/protoc-gen-go-grpc" ]; then
            # Restored from the version-keyed cache above; the pinned versions
            # are still the ones the contract freshness check requires.
            "$go_bin/protoc-gen-go" --version
            "$go_bin/protoc-gen-go-grpc" --version
          else
            go install "google.golang.org/protobuf/cmd/protoc-gen-go@v${PROTOC_GEN_GO_VERSION}"
            go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v${PROTOC_GEN_GO_GRPC_VERSION}"
          fi

      - name: Install OS sandbox for scoped checks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          # bubblewrap needs unprivileged user namespaces; newer Ubuntu images
          # restrict them via AppArmor, so relax that restriction for the runner.
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate source
        run: |
          go_bin="$(go env GOPATH)/bin"
          echo "$go_bin" >> "$GITHUB_PATH"
          PATH="$PATH:$go_bin" npm run verify:local

      - name: Validate changed development plan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { developmentPlanVerificationSteps, pullRequestChangedPaths } from './tools/verify-local.ts';
          const paths = pullRequestChangedPaths(process.env.PR_BASE_SHA, process.env.PR_HEAD_SHA, process.cwd());
          for (const step of developmentPlanVerificationSteps(paths)) {
            execFileSync(step.command, step.args, { stdio: 'inherit' });
          }
          NODE

      - name: Check diff whitespace
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
