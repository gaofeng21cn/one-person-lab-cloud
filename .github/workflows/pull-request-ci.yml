name: Pull Request CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pull-request-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PROTOC_GEN_GO_VERSION: "1.36.6"
  PROTOC_GEN_GO_GRPC_VERSION: "1.5.1"

jobs:
  dependency_review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  source:
    name: source
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - &node
        name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: docs/spec/target/checks/requirements.txt

      - name: Install spec generator toolchain
        run: python3 -m pip install -r docs/spec/target/checks/requirements.txt

      - &go
        name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: |
            apps/console-bff/go.sum
            packages/contracts/go/go.sum
            services/build/go.sum
            services/capability/go.sum
            services/control-plane/go.sum
            services/fabric/go.sum
            services/gateway-integration/go.sum
            services/internal/ownerservice/go.sum
            services/internal/ownerstore/go.sum
            services/internal/postgresmigrate/go.sum
            services/ledger/go.sum
            services/resource-catalog/go.sum
            services/runtime-control/go.sum
            services/serve/go.sum
            services/workspace/go.sum

      - name: Restore contract generator binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/bin/protoc-gen-go
            ~/go/bin/protoc-gen-go-grpc
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go.outputs.go-version }}-contract-generators-protoc-gen-go-${{ env.PROTOC_GEN_GO_VERSION }}-protoc-gen-go-grpc-${{ env.PROTOC_GEN_GO_GRPC_VERSION }}

      - name: Install contract generators
        run: |
          go_bin="$(go env GOPATH)/bin"
          if [ -x "$go_bin/protoc-gen-go" ] && [ -x "$go_bin/protoc-gen-go-grpc" ]; then
            "$go_bin/protoc-gen-go" --version
            "$go_bin/protoc-gen-go-grpc" --version
          else
            go install "google.golang.org/protobuf/cmd/protoc-gen-go@v${PROTOC_GEN_GO_VERSION}"
            go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v${PROTOC_GEN_GO_GRPC_VERSION}"
          fi
          echo "$go_bin" >> "$GITHUB_PATH"

      - name: Install OS sandbox for scoped checks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          # bubblewrap needs unprivileged user namespaces; newer Ubuntu images
          # restrict them via AppArmor, so relax that restriction for the runner.
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - &dependencies
        name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate source
        run: npm run verify:local -- --group source

      - name: Validate Agent Workbench source
        working-directory: webui/agent-workbench
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

      - name: Validate changed development plan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { developmentPlanVerificationSteps, pullRequestChangedPaths } from './tools/verify-local.ts';
          const paths = pullRequestChangedPaths(process.env.PR_BASE_SHA, process.env.PR_HEAD_SHA, process.cwd());
          for (const step of developmentPlanVerificationSteps(paths)) {
            execFileSync(step.command, step.args, { stdio: 'inherit' });
          }
          NODE

      - name: Check diff whitespace
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"

  go:
    name: go
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - *checkout
      - *node
      - *go
      - *dependencies
      - name: Validate Go
        run: npm run verify:local -- --group go

  browser:
    name: browser (${{ matrix.shard }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - *checkout
      - *node
      - *dependencies
      - name: Validate browser shard
        run: npm run verify:local -- --group browser --shard "${{ matrix.shard }}"

      - name: Validate Agent Workbench browser fixture
        if: matrix.shard == '1/2'
        working-directory: webui/agent-workbench
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run test:browser

  validate:
    name: validate
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [dependency_review, source, go, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const results = JSON.parse(process.env.REQUIRED_RESULTS);
          const required = ['dependency_review', 'source', 'go', 'browser'];
          const unsuccessful = required.filter(name => results[name]?.result !== 'success');
          if (unsuccessful.length > 0) {
            console.error('Required validation jobs did not succeed:', unsuccessful);
            process.exit(1);
          }
          NODE
