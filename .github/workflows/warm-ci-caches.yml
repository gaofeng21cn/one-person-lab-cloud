name: Warm CI Caches
on:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: warm-ci-caches-${{ github.ref }}
  cancel-in-progress: false
env:
  PROTOC_GEN_GO_VERSION: 1.36.6
  PROTOC_GEN_GO_GRPC_VERSION: 1.5.1
jobs:
  warm_cache:
    name: warm-cache
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/spec/target/checks/requirements.txt
      - name: Install spec generator toolchain
        run: python3 -m pip install -r docs/spec/target/checks/requirements.txt
      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.26.x
          cache: true
          cache-dependency-path: |
            apps/console-bff/go.sum
            packages/contracts/go/go.sum
            services/build/go.sum
            services/capability/go.sum
            services/control-plane/go.sum
            services/fabric/go.sum
            services/gateway-integration/go.sum
            services/internal/ownerservice/go.sum
            services/internal/ownerstore/go.sum
            services/internal/postgresmigrate/go.sum
            services/internal/tkeapply/go.sum
            services/ledger/go.sum
            services/resource-catalog/go.sum
            services/runtime-control/go.sum
            services/serve/go.sum
            services/workspace/go.sum
      - name: Restore contract generator binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/go/bin/protoc-gen-go
            ~/go/bin/protoc-gen-go-grpc
          key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.go.outputs.go-version }}-contract-generators-protoc-gen-go-${{ env.PROTOC_GEN_GO_VERSION }}-protoc-gen-go-grpc-${{ env.PROTOC_GEN_GO_GRPC_VERSION }}
      - name: Install contract generators
        run: |
          go_bin="$(go env GOPATH)/bin"
          if [ -x "$go_bin/protoc-gen-go" ] && [ -x "$go_bin/protoc-gen-go-grpc" ]; then
            "$go_bin/protoc-gen-go" --version
            "$go_bin/protoc-gen-go-grpc" --version
          else
            go install "google.golang.org/protobuf/cmd/protoc-gen-go@v${PROTOC_GEN_GO_VERSION}"
            go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v${PROTOC_GEN_GO_GRPC_VERSION}"
          fi
          echo "$go_bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check generated contracts and warm generator dependencies
        run: npm run verify:generated-contracts
      - name: Warm Go compilation and run database-free tests
        run: npm run verify:local -- --group go
