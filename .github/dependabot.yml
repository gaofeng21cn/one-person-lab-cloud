version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      time: "03:00"
      timezone: Asia/Shanghai
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 1

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      time: "03:00"
      timezone: Asia/Shanghai
    groups:
      npm:
        patterns:
          - "*"
    open-pull-requests-limit: 2

  - package-ecosystem: gomod
    directory: /services/control-plane
    schedule:
      interval: weekly
      time: "03:00"
      timezone: Asia/Shanghai
    groups:
      go-modules:
        patterns:
          - "*"
    open-pull-requests-limit: 1

  - package-ecosystem: gomod
    directory: /services/fabric
    schedule:
      interval: weekly
      time: "03:00"
      timezone: Asia/Shanghai
    groups:
      go-modules:
        patterns:
          - "*"
    open-pull-requests-limit: 1

  - package-ecosystem: gomod
    directory: /services/internal/postgresmigrate
    schedule:
      interval: weekly
      time: "03:00"
      timezone: Asia/Shanghai
    groups:
      go-modules:
        patterns:
          - "*"
    open-pull-requests-limit: 1

  - package-ecosystem: gomod
    directory: /services/ledger
    schedule:
      interval: weekly
      time: "03:00"
      timezone: Asia/Shanghai
    groups:
      go-modules:
        patterns:
          - "*"
    open-pull-requests-limit: 1

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
