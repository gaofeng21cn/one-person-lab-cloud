function upload(){const step=state.uploadStep;return head('上传智能体','文件上传与构建是两个明确动作；已上传的包不等于可部署版本。',link('返回智能体','agents'),'F04 · 上传与构建确认')+`<div class="stepper">${['选择包与版本','上传并验证','确认构建'].map((s,i)=>`<div class="step ${i+1===step?'active':i+1<step?'done':''}"><i>${i+1}</i>${s}</div>`).join('')}</div><div class="main-side"><section class="panel pad">${step===1?`<div class="stack"><label>目标智能体<select><option>研究助手 · 本空间私有</option></select></label><div class="fieldrow"><label>版本号<input id="uploadVersion" value="1.5.0"><small>版本提交后保持原始字节不可变；版本号唯一性由服务端校验。</small></label><label>分组<select><option>默认分组</option><option>研究项目</option></select></label></div><div class="uploadzone"><h3>选择标准能力包</h3><p>格式与大小限制来自批准的上传策略，不在这里设固定配额。</p><input type="file" id="packageFile" aria-label="选择能力包文件" style="margin:15px 0"><p>或使用完全离线的示例包走查交互。</p>${button('使用示例能力包','sample-upload','smallbutton')}</div></div>`:step===2?`<h2>核对上传对象</h2><div class="sectiongap">${kv([['文件','research-agent-1.5.0.tar.gz · 示例'],['传输','全部示例分片已确认'],['完整对象校验',state.uploaded?badge('校验通过','good'):badge('等待验证','info')],['恢复方式','刷新后按 uploadId 读取原分片，不创建第二个包']])}</div>${banner('传输完成不是验证通过。服务端应核对分片、对象版本、实际大小与摘要。')}${button('模拟服务端校验通过','verify-upload','primary',state.uploaded)}`:`<h2>确认新的构建任务</h2><div class="stack sectiongap"><label>WebUI<select id="uploadWebui"><option>标准工作台 2.0 · 已批准</option><option>轻量对话界面 1.1 · 已批准</option></select><small>运行底座由管理员当前批准策略冻结；客户不填写镜像地址。</small></label>${kv([['原始包版本','研究助手 1.5.0'],['上传状态',badge('已验证','good')],['运行底座','OPL Runtime 2.3 · 当前策略示例'],['收费','本交互不发起扣费；后续商业规则已确认']])}${banner('点击后建立持久构建任务。离开页面不会取消任务，不做定时跳转。')}</div>`}<div class="wizard-actions">${step>1?button('上一步','upload-back'):link('取消','agents')}${step===1?button('下一步','upload-next','primary'):step===2?button('确认已验证，继续','upload-next','primary',!state.uploaded):button('确认构建','start-build','primary',noWrite())}</div></section><aside>${panel('你会得到什么','<div class="stack"><p class="caption">1. 可恢复的上传会话与原始包版本</p><p class="caption">2. 你明确确认后的独 function build(){let b=state.buildState;let done=b==='succeeded',failed=b==='failed';return head('研究助手 1.5.0','构建记录保留不可变输入与历史，不把错误任务覆盖成新任务。',button('切换失败示例','build-fail')+button('模拟登记成功','build-success','primary'),'F05 · BUILD demo_build_015')+`<div class="main-side"><div>${panel('构建进度',`${badge(done?'版本已可部署':failed?'构建失败':'正在构建',done?'good':failed?'bad':'info')}<div class="timeline sectiongap">${['已排队','校验不可变输入','构建智能体','推送制品','登记可部署版本'].map((s,i)=>`<div class="timeline-row"><span class="dot ${done||i<2?'good':''}">${done||i<2?'✓':i+1}</span><div><h3>${s}</h3><p>${done?'示例：已取得该阶段读回':i<2?'已确认':i===2?failed?'输入构建报错，原任务不覆盖':'当前阶段；不显示预计耗时':'尚未完成'}</p></div></div>`).join('')}</div>${failed?banner('<strong>BUILD_FAILED · 示例</strong>需要修正能力包后提交新版本；本例 retryAllowed=false，不提供同输入重试。','bad'):done?link('部署可用版本','deploy','primary'):banner('生产应仅轮询 Operation，按 Retry-After 调度。此原型不会轮询网络。')}`)}${panel('已脱敏日志',`${button(state.showLogs?'收起日志':'展开日志','toggle-logs','smallbutton')}${state.showLogs?'<pre class="log sectiongap">[validating] package digest verified [示例]\n[validating] runtime policy frozen [示例]\n[building] isolated build in progress [示例]\n没有凭据、原始包内容或内部地址。</pre>':''}`)}</div><aside>${panel('固定输入',kv([['原始包','研究助手 1.5.0'],['运行底座','OPL Runtime 2.3'],['WebUI','标准工作台 2.0'],['来源','首次构建 · 示例'],['任务状态','仅示例，不代表真实构建']]))}${panel('下一步',`<p class="caption">网络读取失败只影响查看，不创建另一个构建。若原推送结果不确定，应核对原身份。</p><div class="sectiongap">${link('返回构建记录','agents','smallbutton')}</div>`)}</aside></div>`}
function workspaces(){return head('工作区','环境权益、资源状态和应用可用性分别展示。',link('部署智能体','deploy','primary'),'F08 · F09 · F16')+partial()+`<div class="toolbar"><input id="workspaceSearch" class="search" aria-label="搜索工作区" placeholder="搜索工作区名称"><select style="width:160px" aria-label="筛选状态"><option>全部状态</option><option>应用可用</option><option>需要处理</option></select><span class="spacer"></span><span class="caption">3 个工作区 · 示例</span></div>`+table(['工作区','资源 / 应用','服务周期','操作'],[[`<div class="celltitle">研究工作区</div><div class="cellsub">研究助手 ${state.version} · 2 核 / 4 GiB</div>`,`${badge('资源就绪','plain')} ${badge(planAppLabel(),planAppUsable()?'good':'warn')}`,'2026-09-01 → 2026-10-01',link('打开详情','workspace','smallbutton')],[`<div class="celltitle">分析环境</div><div class="cellsub">新部署操作进行中</div>`,`${badge('资源就绪','plain')} ${badge(state.scenario==='unknown'?'需要核实':'正在验证','warn')}`,'权益确认中 · 不显示已开通',button('查看进度','resume-operation','smallbutton')],[`<div class="celltitle">历史资源环境</div><div class="cellsub">迁移自原 resource-only 路径</div>`,`${badge('资源就绪','plain')} ${badge('待部署','info')}`,'保留原已付周期',link('部署到已有资源','adopt','smallbutton')]])}

const PLAN_FIXTURE={S:'2026-09-01T00:00:00Z',E:'2026-10-01T00:00:00Z',T:'2026-09-16T00:00:00Z',nextE:'2026-11-01T00:00:00Z',base:{id:'plan-standard',label:'标准型',cpu:2,memory:4,storage:50,monthly:'20000000',priceVersion:'price-standard-v1'}};
function planCurrent(){return state.currentPlan||PLAN_FIXTURE.base}
function planActual(){return state.actualPlan||planCurrent()}
function planPrice(n){let x=BigInt(n),whole=x/1000000n,f=(x%1000000n).toString().padStart(6,'0');return 'US$ '+whole+'.'+(f==='000000'?'00':f.replace(/0+$/,'').padEnd(2,'0'))}
function planDuration(v){let n=BigInt(v),parts=[];for(let [unit,label] of [[86400000n,'天'],[3600000n,'小时'],[60000n,'分'],[1000n,'秒'],[1n,'毫秒']]){let x=n/unit;n%=unit;if(x)parts.push(x+label)}return parts.join(' ')||'0毫秒'}
function planStamp(v){return v.replace('T',' ').replace('Z',' UTC')}
function planPeriod(){return {S:state.planPeriodStart||PLAN_FIXTURE.S,E:state.planPeriodEnd||PLAN_FIXTURE.E,T:state.planNow||PLAN_FIXTURE.T}}
function planPeriodLabel(){let q=planPeriod();return planStamp(q.S)+' → '+planStamp(q.E)}
function planSpec(v){return v.cpu+' 核 / '+v.memory+' GiB / '+v.storage+' GiB存储'}
function planTarget(key,src){if(key==='downgrade')return {id:'plan-light-'+src.storage,label:'轻量型',cpu:1,memory:2,storage:src.storage,monthly:src.storage===50?'12000000':'24000000',priceVersion:'price-light-v1'};if(key==='storage-shrink')return {id:'plan-unsupported-shrink',label:'不支持的盘缩容',cpu:1,memory:2,storage:25,monthly:'8000000',priceVersion:'rejected'};if(key==='mixed')return {id:'plan-unsupported-mixed',label:'混合变更',cpu:8,memory:2,storage:src.storage,monthly:'30000000',priceVersion:'rejected'};if(key==='same')return {...src};if(key==='large')return {id:'plan-large',label:'增强型',cpu:8,memory:16,storage:Math.max(100,src.storage),monthly:'60000000',priceVersion:'price-large-v1'};return {id:'plan-enhanced',label:'进阶型',cpu:4,memory:8,storage:100,monthly:'40000000',priceVersion:'price-enhanced-v1'}}
function planCalculation(src,target,period){let dims=['cpu','memory','storage'],up=dims.every(k=>target[k]>=src[k])&&dims.some(k=>target[k]>src[k]),down=dims.every(k=>target[k]<=src[k])&&dims.some(k=>target[k]<src[k]);if(dims.every(k=>target[k]===src[k]))return {error:'配置相同是no-op，不创建收费操作。'};if(!up&&!down)return {error:'CPU/内存等维度同时上升和下降是混合变更，本期拒绝；请选明确单向转换。'};if(target.storage<src.storage)return {error:'当前Tencent CBS原盘不支持缩容。下期降配也不能绕过此能力，不能只降价却保留大盘。'};let S=BigInt(Date.parse(period.S)),E=BigInt(Date.parse(period.E)),T=BigInt(Date.parse(period.T)),D=E-S,R=E-T;if(D<=0n||R<=0n||R>D)return {error:'当前不在原已付周期内，不能通过中途调整重新开始一个月。'};let diff=BigInt(target.monthly)-BigInt(src.monthly),delta=diff>0n?diff:0n;return {kind:up?'upgrade_immediate':'downgrade_next_period',S:period.S,E:period.E,T:period.T,periodMilliseconds:D.toString(),remainingMilliseconds:R.toString(),sourceMonthlyUSDMicros:src.monthly,targetMonthlyUSDMicros:target.monthly,chargeUSDMicros:up?((delta*R+D-1n)/D).toString():'0',nextPeriodTotalUSDMicros:target.monthly,plannedEffectiveAt:up?period.T:period.E,policyVersion:'workspace-plan-change-v1'}}
function planRecords(){return state.planChanges||[]}
function planSelected(){return planRecords().find(p=>p.id===state.selectedPlanChangeId)||planRecords().at(-1)||null}
function planOutstanding(){return planRecords().find(p=>!['applied','failed','cancelled'].includes(p.status)||['pending','unknown'].includes(p.refundOutcome))}
function planAppUsable(){let period=planPeriod();if(Date.parse(period.T)>=Date.parse(period.E))return false;let pc=planOutstanding();return !pc||!['applying','needs_attention','awaiting_payment'].includes(pc.status)}
function planAppLabel(){return planAppUsable()?'应用可用':'调整中，应用待确认'}
function planCanCancel(pc){return pc&&pc.kind==='downgrade_next_period'&&['scheduled','awaiting_payment'].includes(pc.status)&&!pc.paymentIssued&&!pc.executionStarted}
function planStatus(pc){if(pc.status==='scheduled'&&pc.paymentOutcome==='confirmed')return '下期已付款，等待原E';return ({requested:'已受理，尚未生效',scheduled:'已保存下期计划',awaiting_payment:'等待下期付款',applying:'正在执行调整',applied:'已实际生效',failed:'确定失败',needs_attention:'需要处理',cancelled:'已取消'})[pc.status]}
function planOpen(){let existing=planOutstanding();if(existing){state.selectedPlanChangeId=existing.id;state.tab.workspace='plans';navigate('workspace');render();toast(planCanCancel(existing)?'已有未完成计划；请显式取消后再创建新计划，不会覆盖原目标。':'已有操作或未决资源差异，先核对原计划，不能创建竞争操作。');return}state.planDraft={targetKey:state.planDraft?.targetKey||'upgrade',quote:null};openModal('调整套餐 · D17规则已确认',`<div class="stack">${banner('初始示例时钟为2026-09-16 00:00 UTC；当前时刻见原周期与报价。所有数值为交互示例，不连接后端、不实际扣款。')}<label>目标套餐<select id="planTarget"><option value="upgrade">升级：4核 / 8GiB / 100GiB · 40美元/月</option><option value="large">升级：8核 / 16GiB / 100GiB · 60美元/月</option><option value="downgrade">计算降配：1核 / 2GiB，保留原盘 · 下一期生效</option><option value="storage-shrink">反例：原盘缩为25GiB（拒绝）</option><option value="mixed">反例：CPU升、内存降（拒绝）</option><option value="same">反例：保持原配置（no-op）</option></select></label>${kv([['当前已生效套餐',planSpec(planCurrent())],['当前已接受月价',planPrice(planCurrent().monthly)],['原周期',planPeriodLabel()],['下期付款授权',(state.renewalMode||'manual')==='automatic'&&state.renewalConsent?'已有效同意自动续费':'手动续费，未授权自动扣款']])}<p class="caption">计算降配只预约下一期；磁盘能力仍必须允许。改变付款方式使用既有续费设置，不由此计划偷偷开启自动续费。</p><div class="formerror" id="planPreviewError"></div></div>`,'检查并获取报价（示例）',()=>{const key=$('#planTarget').value,src=structuredClone(planCurrent()),target=planTarget(key,src),cal=planCalculation(src,target,planPeriod());if(cal.error){$('#planPreviewError').textContent=cal.error;return false}state.planQuoteSequence=(state.planQuoteSequence||0)+1;state.planDraft={targetKey:key,quote:{id:'demo-quote-plan-'+state.planQuoteSequence,expiresAt:new Date(Date.parse(cal.T)+900000).toISOString(),source:src,target,calculation:cal,sourceSubscriptionVersion:state.planSubscriptionVersion||1,sourceWorkspaceVersion:state.planWorkspaceVersion||1}};state.tab.workspace='plans';navigate('workspace');return true});$('#planTarget').value=state.planDraft.targetKey}

function planQuoteView(q){let c=q.calculation,up=c.kind==='upgrade_immediate';return panel(up?'确认立即升级的补差报价':'确认下个账期的降配计划',`${banner(up?'<strong>立即进入执行，不重置到期日</strong>只有资源、挂载和Runtime实际验证完成后，才显示升级成功。':'<strong>当前套餐保持到原E，不退当前费用</strong>现在仅保存计划，不扣下期费用、不调用资源降配。')}<div class="grid cols2"><div>${kv([['原套餐',planSpec(q.source)],['目标套餐',planSpec(q.target)],['原已接受月价',planPrice(c.sourceMonthlyUSDMicros)],['目标批准月价',planPrice(c.targetMonthlyUSDMicros)],['报价基准T',planStamp(c.T)],['示例报价有效至',planStamp(q.expiresAt)]])}</div><div>${kv([['本期开始S',planStamp(c.S)],['原到期日E（升级保持）',planStamp(c.E)],['剩余已付周期',planDuration(c.remainingMilliseconds)+' / '+planDuration(c.periodMilliseconds)],[up?'本次补差':'现在收费',planPrice(c.chargeUSDMicros)],[up?'升级成功后月价':'下期目标月价',planPrice(c.nextPeriodTotalUSDMicros)],['下一周期',up?'由后续续费报价确定':planStamp(c.E)+' → '+planStamp(PLAN_FIXTURE.nextE)],['计划生效时点',up?'接受后立即执行；实际appliedAt另行确认':planStamp(c.plannedEffectiveAt)]])}</div></div><div class="sectiongap">${banner('执行影响示例：需要排空并短暂停止应用，调整后核对挂载/文件系统和运行资源限制；不承诺零停机。','warn')}</div><p class="caption">${up?'补差 = ceil(max(新月价−原月价,0) × 剩余毫秒 / 原周期毫秒)，只最终向上取整1微美元。':'在E边界使用唯一下一周期义务；手动未授权则awaiting_payment，不先扣旧高价再补救。'} 原已付周期 ${planStamp(c.S)} → ${planStamp(c.E)}。</p>${up?planPrecisionExample():''}<div class="sectiongap">${kv([['政策','workspace-plan-change-v1'],[up?'本次补差授权':'下期付款授权',up?'本次确认授权确切补差；接受后执行，零补差只记证据':(state.renewalMode||'manual')==='automatic'&&state.renewalConsent?'当前有效自动续费同意：边界可扣目标价':'手动：到E等待明确下期目标价付款'],['并发约束','当前Workspace与Subscription版本必须匹配；已有计划要先取消']])}</div><label class="checkrow sectiongap"><input id="planAccept" type="checkbox">我已核对原/目标月价、T/S/E、${up?'补差和中断影响':'下期目标价、原E与付款方式'}；这里只提交示例计划。</label><div class="inline sectiongap">${button('返回修改','plan-preview-back')}${button('使示例报价过期','plan-expire-quote','smallbutton')}${button(up?'接受补差并立即执行（示例）':'保存下期降配计划（示例）','plan-accept','primary',noWrite())}</div>`)}

function planAction(a){if(!a.startsWith('plan-')&&a!=='resize')return false;if(a==='resize'){planOpen();return true}let pc=planSelected();if(a==='plan-expire-quote'){if(state.planDraft?.quote)state.planNow=state.planDraft.quote.expiresAt;toast('该示例报价已过期，不能接受；请返回重新报价。');render();return true}if(a==='plan-preview-back'){state.planDraft.quote=null;planOpen();return true}if(a==='plan-accept'){let q=state.planDraft?.quote;if(!q||!$('#planAccept')?.checked){toast('请明确核对计划、金额、周期与影响。');return true}let existing=planRecords().find(x=>x.quoteId===q.id);if(existing){state.selectedPlanChangeId=existing.id;render();return true}if(planOutstanding()){toast('已有计划，必须显式取消后再新建。');return true}if(Date.parse(planPeriod().T)>=Date.parse(q.expiresAt)){toast('原报价已过期，请重新获取报价，不能沿用旧T或金额。');return true}if(q.sourceWorkspaceVersion!==(state.planWorkspaceVersion||1)||q.sourceSubscriptionVersion!==(state.planSubscriptionVersion||1)){state.planDraft.quote=null;toast('当前计划或订阅版本已变化，请重新报价。');render();return true}let cal=q.calculation;pc={id:'demo-plan-'+(planRecords().length+1),quoteId:q.id,source:q.source,target:q.target,calculation:cal,kind:cal.kind,status:cal.kind==='upgrade_immediate'?'requested':'scheduled',operationId:'demo-plan-operation-'+(planRecords().length+1),requestedAt:cal.T,appliedAt:null,initialOperationStatus:cal.kind==='upgrade_immediate'?'accepted':'succeeded',deliveryOutcome:'pending',resourceOutcome:'unchanged',scheduleVersion:1,paymentAttempts:0,paymentIssued:false,executionStarted:false};state.planChanges=[...planRecords(),pc];state.selectedPlanChangeId=pc.id;state.planDraft.quote=null;render();return true}if(!pc){toast('请先创建示例计划。');return true}if(a==='plan-read'){toast('重新读取同一个PlanChange，不创建新操作。');return true}if(a==='plan-cancel'){const expectedVersion=pc.scheduleVersion;if(!planCanCancel(pc)){toast('新期资金义务或执行已发出，不能简单取消。');return true}openModal('取消下期降配计划？',`<p>取消 ${pc.id}，不改变本期资源、不退本期费用。新的变更必须另行报价，不会覆盖历史。</p><p class="caption sectiongap">expectedScheduleVersion=${pc.scheduleVersio
