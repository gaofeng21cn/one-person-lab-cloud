x-external-capability-boundaries:
- Gateway tenant wallet delegation, idempotent wallet readback, application delegated session and Key reveal must be verified
  against actual Owner; missing capability rejects explicitly, no fallback.
- Cloud specification/CI/local tests do not authorize actual charges, provider procurement/deletion or production network
  access. Instance protected workflows own those effects.
- No Console endpoint dispatches Product Release or Instance deployment.
