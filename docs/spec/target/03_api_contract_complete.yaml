          kind: derived
          sources:
          - workspace.subscriptions.accepted_quote_snapshot
          - workspace.subscriptions.legacy_obligation_snapshot
          rule: typed原义务快照.refundPolicyVersionId；quoted来自已接受Quote快照，legacy只精确原证据，不推断缺失事实
        retentionPolicyVersionId:
          kind: derived
          sources:
          - workspace.subscriptions.accepted_quote_snapshot
          - workspace.subscriptions.legacy_obligation_snapshot
          rule: typed原义务快照.retentionPolicyVersionId；quoted来自已接受Quote快照，legacy只精确原证据，不推断缺失事实
        refundTerms:
          kind: derived
          sources:
          - workspace.subscriptions.accepted_quote_snapshot
          - workspace.subscriptions.legacy_obligation_snapshot
          rule: typed原义务快照.refundTerms；quoted来自已接受Quote快照，legacy只精确原证据，不推断缺失事实
        retentionTerms:
          kind: derived
          sources:
          - workspace.subscriptions.accepted_quote_snapshot
          - workspace.subscriptions.legacy_obligation_snapshot
          rule: typed原义务快照.retentionTerms；quoted来自已接受Quote快照，legacy只精确原证据，不推断缺失事实
        renewalMode: workspace.subscriptions.renewal_mode
        renewalConsentId: workspace.subscriptions.renewal_consent_id
        renewalSettingsVersion: workspace.subscriptions.renewal_settings_version
        version: workspace.subscriptions.version
        currentPricePolicyVersionId: workspace.subscriptions.current_price_policy_version_id
        currentMonthlyUSDMicros: workspace.subscriptions.current_monthly_usd_micros
      description: 保留原订阅的manual/automatic事实；automatic必须精确原授权/同周期义务，不因迁移降为manual或重新授权。新订阅显式选择，默认manual不自动收费；到期无已确认付款停止。 version是周期/成功生效计划的业务CAS版本，独立于renewalSettingsVersion。currentPricePolicyVersionId/currentMonthlyUSDMicros只保存客户已接受且成功生效的当前价；连续升级以其为Pold。scheduled目标不提前改它。
        legacy原价/政策证据不足时两current价格字段缺省，F11明确POLICY_UNCONFIGURED待Owner核实，不补0/不取最新价，不影响原资源只读访问。
      allOf:
      - oneOf:
        - properties:
            provenance:
              enum:
              - quoted
          required:
          - acceptedQuoteId
          - refundPolicyVersionId
          - retentionPolicyVersionId
          - refundTerms
          - retentionTerms
          - currentPricePolicyVersionId
          - currentMonthlyUSDMicros
          not:
            required:
            - legacyPurchaseId
        - properties:
            provenance:
              enum:
              - legacy_import
          required:
          - legacyPurchaseId
          not:
            required:
            - acceptedQuoteId
      - oneOf:
        - properties:
            renewalMode:
              enum:
              - manual
        - properties:
            renewalMode:
              enum:
              - automatic
          required:
          - renewalConsentId
