components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: opl_session
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
      description: tenant+actor+operationId作用域；相同规范化body返回同一身份；异body 409，保留覆盖业务义务。
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: *id007
      description: 匹配同源session并校验Origin。
    Cursor:
      name: cursor
      in: query
      schema: *id003
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    ErrorResponse:
      description: 稳定code分支，requestId追溯，message不参与客户端状态判断。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          description: 429/503必填整数秒1..300；其他同步错误省略。重新读取/提交须保留原幂等身份，不把503当原动作未执行。
          schema:
            type: integer
            minimum: 1
            maximum: 300
  schemas:
    OpaqueId:
      type: string
      minLength: 1
      maxLength: 256
      description: 不透明string；新旧ID原样保留，不假定UUID。
    USDMicros:
      type: string
      pattern: ^(?:0|[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$
      description: 微美元非负int64，JSON十进制字符串，范围0..9223372036854775807；禁止浮点/前导零。
    NonnegativeInt64:
      type: string
      pattern: ^(?:0|[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6]|9223372036854775807)$
      description: 非负int64的JSON十进制字符串，范围0..9223372036854775807；无前导零，不经JavaScript Number转换。
