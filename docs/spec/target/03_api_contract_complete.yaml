      - migrationRequired
      description: publisher批准兼容声明；不从semver启发式猜测；数据迁移不满足则拒绝。
    CapabilityVersion:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        packageId:
          $ref: '#/components/schemas/OpaqueId'
        packageVersionId:
          $ref: '#/components/schemas/OpaqueId'
        buildJobId:
          $ref: '#/components/schemas/OpaqueId'
        versionLabel:
