      description: 名称精确确认；停用是reenable，删除恢复是restore。restoreUntil只在确认deleted时设为deletedAt+15天，删除处理中无恢复倒计时；先收敛未决删除子操作。
    AssetCustody:
      type: object
      additionalProperties: false
      properties:
        tenantId:
          $ref: '#/components/schemas/OpaqueId'
        status:
          type: string
          enum:
          - restricted
          - retained
        packageCount:
          $ref: '#/components/schemas/NonnegativeInt64'
        buildCount:
          $ref: '#/components/schemas/NonnegativeInt64'
        restoreUntil:
          type: string
          format: date-time
        workspaceDeletionOperationIds:
