    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 256
        password:
          type: string
          format: password
          writeOnly: true
      required:
      - username
      - password
      description: TLS转发Gateway现有认证；密码不持久化，不进日志/事件。无公开注册、不假设OIDC能力。 幂等存储只保留请求去敏指纹/会话身份，绝不持久化password或完整request/response；session-cookie不进事件。
    Session:
      type: object
      additionalProperties: false
      properties:
        actorId:
          $ref: '#/components/schemas/OpaqueId'
        displayName:
          type: string
        tenantId:
          $ref: '#/components/schemas/OpaqueId'
        tenantName:
          type: string
        role:
          $ref: '#/components/schemas/TenantRole'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/AuthorizationAction'
        csrfToken:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
      - actorId
      - displayName
      - permissions
      - csrfToken
      - expiresAt
      x-owner: tenant
      description: 尚未接受Tenant邀请时tenant/role缺省，只能退出或接受绑定本人Gateway subject的邀请。HttpOnly Secure SameSite=Lax cookie。
    Tenant:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        name:
          type: string
        status:
          type: string
          enum:
          - active
          - suspended
          - deleting
          - deleted
        billingSub2apiUserId:
          $ref: '#/components/schemas/OpaqueId'
        restoreUntil:
          type: string
          format: date-time
        assetCustodyStatus:
          type: string
          enum:
          - tenant_owned
          - restricted
          - retained
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - name
      - status
      - assetCustodyStatus
      - createdAt
      - updatedAt
