x-authorization-rules:
  issuer: cloud_identity
  issuerProcess: gateway_integration
  identitySource: mTLS verified Instance CA URI-SAN urn:opl:instance:<instanceId>:service:<ServiceIdentity>; body values never
    assert service identity
  contextLifetimeSeconds: 30
  interactive: AuthorizeAction live-checks session, current tenant/platform permissions, exact action/resource/audience; no
    cached allow
  background: IssueAcceptedOperationGrant checks real Owner committed state, original context scope/acceptance timestamp and
    exact allowed action intersection; no caller-authored proof
  inactiveTenant: new entitlement/debit/procurement rejected; original readback/closeout/refund remain bounded to accepted
    identities
  automaticRenewal: always typed ReadRenewalConsent before issuing a new period debit; revoked consent blocks not-yet-issued
    charge, unknown issued charge remains original readback
  rpcGroups: Typed interfaces in the existing Owner processes of 01; Tenant/CloudIdentity and Gateway Integration are the
    same process. An RPC service block never creates a deployment unit.
  calleeValidation: The target owner calls GetAuthorizationContext, which uses the same live AuthorizeAction decision core;
    mTLS peer must equal context audience. Outbound service-action allowlist does not grant any end-user role.
