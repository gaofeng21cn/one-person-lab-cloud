        runtimeVersionId:
          $ref: '#/components/schemas/OpaqueId'
        webuiVersionId:
          $ref: '#/components/schemas/OpaqueId'
        artifactDigest:
          $ref: '#/components/schemas/Digest'
        status:
          type: string
