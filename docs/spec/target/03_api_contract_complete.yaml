          - capability.upload_chunks.size_bytes
          - capability.upload_chunks.observation_result
          rule: 本session confirmed分片按part_number排列
        expiresAt: capability.upload_sessions.expires_at
      description: Storage已确认parts读回，可断点恢复；页面不猜测已传字节。业务请求仅BFF，原始字节仅传Capability签署Storage URL。
    CreateUploadPartRequest:
      type: object
      additionalProperties: false
      properties:
        partNumber:
          type: integer
          format: int32
          minimum: 1
        sizeBytes:
          $ref: '#/components/schemas/NonnegativeInt64'
        sha256:
          $ref: '#/components/schemas/Digest'
      required:
      - partNumber
      - sizeBytes
      - sha256
    UploadPartAuthorization:
      type: object
      additionalProperties: false
      properties:
        uploadId:
          $ref: '#/components/schemas/OpaqueId'
        partNumber:
          type: integer
          format: int32
          minimum: 1
        method:
          type: string
          enum:
          - PUT
        url:
          type: string
          format: uri
        contentType:
          type: string
        requiredChecksumHeaderName:
          type: string
        requiredChecksumHeaderValue:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
      - uploadId
      - partNumber
      - method
      - url
      - contentType
      - requiredChecksumHeaderName
      - requiredChecksumHeaderValue
      - expiresAt
      description: 只允许PUT application/octet-stream到当前part/大小/校验和绑定的临时URL；此处无通用header map。签名URL仅内存使用不写日志，不用于业务调用。 签名URL不写持久幂等response_body；幂等重放返回同part身份并新签署有限时授权，不改变已上传字节。
