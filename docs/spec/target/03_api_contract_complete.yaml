        packageVersionId:
          $ref: '#/components/schemas/OpaqueId'
        status:
          type: string
          enum:
          - uploading
          - completed
          - expired
        sizeBytes:
          $ref: '#/components/schemas/NonnegativeInt64'
        sha256:
          $ref: '#/components/schemas/Digest'
        partSizeBytes:
          $ref: '#/components/schemas/NonnegativeInt64'
        completedParts:
          type: array
          items:
            $ref: '#/components/schemas/UploadPart'
        expiresAt:
          type: string
          format: date-time
      required:
      - id
      - packageVersionId
      - status
      - sizeBytes
      - sha256
      - partSizeBytes
      - completedParts
      - expiresAt
