openapi: 3.0.3
info:
  title: OPL Cloud complete Console BFF contract
  version: 2.26.3-plan-change
  description: 2026-09-21目标规格，不是实现/上线证据。React业务API仅同源/api/v2；原始上传字节仅Capability签署Storage URL。内部typed gRPC+PostgreSQL Outbox/Inbox。JSON金额string，UTC
    RFC3339。不透明ID。写入CSRF+Origin+Idempotency-Key。Tenant role owner>=admin>=member；platform_admin独立权限，不由Tenant owner自动获得。对象越权404。
    R01–R10闭环修订；D17套餐变更政策已由用户批准，按固定policy-v1实现。
servers:
- url: /
  description: Same-origin BFF, no instance domain hardcoding.
security:
- SessionCookie: []
