x-d17-semantic-invariants:
- Resource direction uses approved transition; same configuration/mixed/incomparable rejected, never classify by price.
- Only one unfinished PlanChange per Workspace; CAS sourceSubscriptionVersion and exact source plans at acceptance; duplicate
  intent replays original identity.
- Upgrade Quote T/amount frozen; zero charge never invokes Gateway.
- Scheduled initial Operation may finish while PlanChange remains scheduled; separate stable executionOperationId at boundary.
- Target next-period payment obligation is unique before confirmed history exists; manual/automatic/boundary share one identity
  and accepted target price.
- Confirmed failed target with retained irreversible storage can be fully compensated after fence/evidence; resource discrepancy
  remains needs_attention and blocks new changes.
- Each supplemental charge has coverage T..E; normal deletion floor refund independent from preserved base policy.
- Other future accepted/confirmed paid obligations block new PlanChange; unaccepted unpaid obligation may only rebind with
  explicit cancel/newQuote and its version CAS.
- Own scheduled plan prepayment permits only its verified sourceSubscriptionVersion->confirmedSubscriptionVersion advance;
  original financial/resource basis is unchanged.
- Scheduled does not hold execution lock; ordinary app/model updates must remain compatible with scheduled target, otherwise
  reject before change.
- Resource-only legacy skips Runtime readback only on authoritative current binding; existing app never skips it.
