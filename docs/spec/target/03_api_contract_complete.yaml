      type: object
      additionalProperties: false
      properties:
        os:
          type: string
          enum:
          - linux
        architecture:
          type: string
          enum:
          - amd64
          - arm64
        variant:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - os
      - architecture
    ArtifactReference:
      type: object
      additionalProperties: false
      properties:
        repository:
          type: string
          pattern: ^[a-z0-9]+(?:[.-][a-z0-9]+)*(?::[0-9]+)?/[a-z0-9]+(?:[._/-][a-z0-9]+)*$
          maxLength: 512
          description: 完整Registry/repository，无scheme、tag或digest；所属publisher namespace按路径段严格比较，不使用字符串模糊前缀。
        digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        platform:
          $ref: '#/components/schemas/ImagePlatform'
      required:
      - repository
      - digest
      - platform
      description: 可定位不可变OCI image身份；读取manifest必须精确匹配三个字段，不用latest或静默跨平台。
    RecipeArtifact:
      type: object
      additionalProperties: false
      properties:
        repository:
          type: string
          pattern: ^[a-z0-9]+(?:[.-][a-z0-9]+)*(?::[0-9]+)?/[a-z0-9]+(?:[._/-][a-z0-9]+)*$
          maxLength: 512
          description: 完整Registry/repository，无scheme、tag或digest；所属publisher namespace按路径段严格比较，不使用字符串模糊前缀。
        digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        mediaType:
          type: string
          enum:
          - application/vnd.opl.build-recipe.v1+tar
        dockerfilePath:
          type: string
          pattern: ^(?!/)(?!.*(?:^|/)\.\.?(/|$))[A-Za-z0-9_./-]+$
          maxLength: 512
      required:
      - repository
      - digest
      - mediaType
      - dockerfilePath
      description: 由发布者准入的不可变BuildKit recipe归档，不是客户任意Dockerfile；校验归档路径/recipe摘要。
    PackageBuildInput:
      type: object
      additionalProperties: false
      properties:
        contextName:
          type: string
          enum:
          - agent_package
        formatVersion:
          type: string
          minLength: 1
          maxLength: 256
        sourceRoot:
          type: string
          pattern: ^(?!/)(?!.*(?:^|/)\.\.?(/|$))[A-Za-z0-9_./-]+$
          maxLength: 512
        targetPath:
          type: string
          pattern: ^/(?!.*(?:^|/)\.\.(?:/|$))[A-Za-z0-9_./-]*$
          maxLength: 512
        uid:
          type: integer
          minimum: 0
          maximum: 2147483647
        gid:
          type: integer
          minimum: 0
          maximum: 2147483647
      required:
      - contextName
      - formatVersion
      - sourceRoot
      - targetPath
      - uid
      - gid
    WebuiBuildInput:
      type: object
      additionalProperties: false
      properties:
        contextName:
          type: string
          enum:
          - webui
        sourcePath:
          type: string
          pattern: ^/(?!.*(?:^|/)\.\.(?:/|$))[A-Za-z0-9_./-]*$
          maxLength: 512
        targetPath:
          type: string
          pattern: ^/(?!.*(?:^|/)\.\.(?:/|$))[A-Za-z0-9_./-]*$
          maxLength: 512
        uid:
          type: integer
          minimum: 0
          maximum: 2147483647
        gid:
          type: integer
          minimum: 0
          maximum: 2147483647
      required:
      - contextName
      - sourcePath
      - targetPath
      - uid
      - gid
    BuildRecipeContract:
      type: object
      additionalProperties: false
      properties:
        version:
          type: string
          enum:
          - opl-build-recipe/v1
        frontend:
          $ref: '#/components/schemas/ArtifactReference'
        recipe:
          $ref: '#/components/schemas/RecipeArtifact'
        runtimeContextName:
          type: string
          enum:
          - runtime
        packageInput:
          $ref: '#/components/schemas/PackageBuildInput'
        webuiInput:
          $ref: '#/components/schemas/WebuiBuildInput'
        networkPolicy:
          type: string
          enum:
          - none
        outputPlatform:
          $ref: '#/components/schemas/ImagePlatform'
        outputImageCommand:
          $ref: '#/components/schemas/BuildRecipeContractOutputImageCommand'
      required:
      - version
      - frontend
      - recipe
      - runtimeContextName
      - packageInput
      - webuiInput
      - networkPolicy
      - outputPlatform
      - outputImageCommand
      description: BuildKit三个命名context严格runtime/agent_package/webui；发布者recipe只能消费这些输入，网络none。需要联网依赖须由发布者预置在已批准digest中。输出平台必须等于Runtime与WebUI平台；准入执行官方/第三方契约测试，不推测COPY路径。
    ModelConfigurationContract:
      type: object
      additionalProperties: false
      properties:
        protocol:
          type: string
          enum:
          - opl-model-config/v1
        portName:
          type: string
          minLength: 1
          maxLength: 256
        applyPath:
          type: string
          pattern: ^/(?!.*(?:^|/)\.\.(?:/|$))[A-Za-z0-9_./-]*$
          maxLength: 512
        readbackPath:
          type: string
          pattern: ^/(?!.*(?:^|/)\.\.(?:/|$))[A-Za-z0-9_./-]*$
          maxLength: 512
        requestFields:
          type: array
          items:
            type: string
            enum:
            - version
            - selections
          minItems: 2
          maxItems: 2
          uniqueItems: true
        readbackFields:
          type: array
          items:
            type: string
            enum:
            - appliedVersion
            - selections
          minItems: 2
          maxItems: 2
          uniqueItems: true
        authorizationSecretInputName:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - protocol
      - portName
      - applyPath
      - readbackPath
      - requestFields
      - readbackFields
      - authorizationSecretInputName
      description: PUT applyPath提交ModelConfigurationPayload{version:int64 string,selections:[{slot,modelId}]}，GET readbackPath返回ModelConfigurationReadback；重复同version同payload返回同结果，异payload冲突；不能借此写应用任意JSON。
        portName引用applicationRevisionTemplate.ports；authorizationSecretInputName引用其SecretInputs，不另发明SecretSlot或用Gateway Key代替控制凭据。
    ApplicationAccessContract:
      oneOf:
      - $ref: '#/components/schemas/ApplicationOwnedAccessContract'
      - $ref: '#/components/schemas/CloudPrivateAccessContract'
      - $ref: '#/components/schemas/AnonymousAccessContract'
    DataUpgradeContract:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
          - compatible
          - publisher_migration
        compatibleFromSchemaVersions:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 256
        migrationArtifact:
          $ref: '#/components/schemas/ArtifactReference'
        backupRequired:
          type: boolean
        backupFormatVersion:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - mode
      - compatibleFromSchemaVersions
      - backupRequired
      allOf:
      - oneOf:
        - allOf:
          - properties:
              mode:
                enum:
                - publisher_migration
          - required:
            - migrationArtifact
            - backupFormatVersion
            properties:
              backupRequired:
                enum:
                - true
        - not:
