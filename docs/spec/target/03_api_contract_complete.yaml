      x-table: tenant.operations
      x-field-map:
        tenantId:
          kind: derived
          sources: &id042
          - tenant.operations.result
          - tenant.tenants.status
          - tenant.tenants.restore_until
          - capability.packages.id
          - build.build_jobs.id
          rule: 按Owner授权readback精确计数/恢复窗口与Workspace删除Operation引用；无持久counter
        status:
          kind: derived
          sources: *id042
          rule: 按Owner授权readback精确计数/恢复窗口与Workspace删除Operation引用；无持久counter
        packageCount:
          kind: derived
          sources: *id042
          rule: 按Owner授权readback精确计数/恢复窗口与Workspace删除Operation引用；无持久counter
        buildCount:
          kind: derived
          sources: *id042
          rule: 按Owner授权readback精确计数/恢复窗口与Workspace删除Operation引用；无持久counter
        restoreUntil:
          kind: derived
          sources: *id042
          rule: 按Owner授权readback精确计数/恢复窗口与Workspace删除Operation引用；无持久counter
        workspaceDeletionOperationIds:
          kind: derived
          sources: *id042
          rule: 按Owner授权readback精确计数/恢复窗口与Workspace删除Operation引用；无持久counter
      description: 不公开私有制品；恢复只恢复身份与保留资产权限，不复活已销毁数据、不重购。
    Namespace:
