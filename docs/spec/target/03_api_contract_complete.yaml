          $ref: '#/components/schemas/OpaqueId'
        role:
          type: string
          enum:
          - admin
          - member
        status:
          type: string
          enum:
          - pending
          - accepted
          - revoked
          - expired
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - inviteeGatewaySubjectId
      - role
      - status
      - expiresAt
      - createdAt
