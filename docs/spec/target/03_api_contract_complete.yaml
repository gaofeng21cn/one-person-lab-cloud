        restoreUntil: tenant.tenants.restore_until
        assetCustodyStatus:
          kind: derived
          sources:
          - tenant.tenants.status
          - tenant.operations.result
          rule: Tenant删除/恢复Operation及保留资产Owner读回，无counter表
        createdAt: tenant.tenants.created_at
        updatedAt: tenant.tenants.updated_at
    CreateTenantRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
